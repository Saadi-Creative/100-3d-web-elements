<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Spotlight Tracking Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; background: #0f172a; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        .spotlight-grid { position: relative; }
        
        .spotlight-card {
            background-color: rgba(255, 255, 255, 0.03); 
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: scale(0.8) translateY(50px);
            transition: opacity 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .spotlight-card.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        
        .spotlight-card::before {
            content: "";
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            background: radial-gradient(
                700px circle at var(--mouse-x, 0px) var(--mouse-y, 0px), 
                rgba(56, 189, 248, 0.5), /* Bright Sky Blue Spotlight */
                transparent 40%
            );
            z-index: 1;
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }
        
        .spotlight-grid:hover .spotlight-card::before { opacity: 1; }

        .spotlight-inner {
            background-color: #0f172a;
            position: absolute;
            inset: 2px;
            border-radius: 26px;
            z-index: 2;
            transition: background-color 0.4s ease;
        }

        .spotlight-card:hover .spotlight-inner { background-color: rgba(15, 23, 42, 0.7); }

        .feat-icon {
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.5s ease;
        }
        
        /* Keyframe for hover wiggle */
        @keyframes hoverWiggle {
            0% { transform: scale(1.1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-10deg); }
            50% { transform: scale(1.1) rotate(10deg); }
            75% { transform: scale(1.1) rotate(-10deg); }
            100% { transform: scale(1.1) rotate(0deg); }
        }

        .spotlight-card:hover .feat-icon {
            background-color: #334155; /* slate-700 */
            animation: hoverWiggle 0.5s ease forwards;
        }

        .feat-title { transition: transform 0.3s ease; }
        .spotlight-card:hover .feat-title { transform: translateX(5px); }

        /* Background Breathing */
        @keyframes breath {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.3; }
            50% { transform: translateX(-50%) scale(1.2); opacity: 0.6; }
        }
        .ambient-bg {
            animation: breath 8s ease-in-out infinite;
        }
        
        /* Initial Title states */
        .fade-up { opacity: 0; transform: translateY(-20px); transition: all 0.6s ease; }
        .fade-scale { opacity: 0; transform: scale(0.9); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .fade-in { opacity: 0; transition: all 0.6s ease; }
        
        .loaded .fade-up { opacity: 1; transform: translateY(0); }
        .loaded .fade-scale { opacity: 1; transform: scale(1); }
        .loaded .fade-in { opacity: 1; }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="loaded">
    <div id="root" class="w-full min-h-screen flex flex-col items-center pt-48 pb-40 relative">
        
        <div class="ambient-bg absolute top-0 left-1/2 w-[1000px] h-[600px] bg-sky-600/20 rounded-full blur-[150px] pointer-events-none z-0"></div>

        <div class="text-center max-w-4xl z-10 mb-32 px-6 relative">
            <div class="fade-up inline-flex items-center gap-3 px-5 py-2.5 rounded-full bg-slate-800/80 backdrop-blur border border-slate-700 text-sky-400 font-bold tracking-widest uppercase text-sm mb-8 shadow-xl" style="transition-delay: 0s;">
                <span class="w-2.5 h-2.5 rounded-full bg-sky-500 animate-pulse shadow-[0_0_10px_rgba(14,165,233,0.8)]"></span>
                Hardware Accelerated
            </div>
            
            <h1 class="fade-scale text-7xl md:text-[110px] font-black tracking-tighter text-white leading-[0.9] mb-8 drop-shadow-2xl" style="transition-delay: 0.2s;">
                Tactile Grids.
            </h1>
            
            <p class="fade-in text-2xl font-medium text-slate-400 max-w-2xl mx-auto leading-relaxed" style="transition-delay: 0.4s;">
                We amplified the component payload. Staggered physics-based entry properties, a slow breathing ambient background, and violent icon rotations bound directly to hover logic.
            </p>
        </div>

        <div id="spotlight-grid" class="spotlight-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-6xl mx-auto z-10 p-4"></div>
    </div>

    <script>
        const FEATURES = [
            { icon: "⚡️", title: "Supersonic Edge", text: "Global cache routing pushing 10ms P99 responses." },
            { icon: "🛡️", title: "Zero Trust", text: "Hardware-level cryptographic validation protocols." },
            { icon: "🧠", title: "Neural Synthesis", text: "Organic LLM context embeddings directly on isolated silicon." },
            { icon: "🌊", title: "Liquid Scaling", text: "Thousands of containers provisioned without orchestration." },
            { icon: "👁️", title: "Absolute Vision", text: "Real-time 3D telemetry visualization of every function." },
            { icon: "💎", title: "Flawless State", text: "Distributed multi-region active-active database clusters." }
        ];

        const grid = document.getElementById('spotlight-grid');

        FEATURES.forEach((feat, i) => {
            const html = `
                <div class="spotlight-card h-80 w-full group cursor-pointer shadow-2xl" style="transition-delay: ${i * 0.1}s">
                    <div class="spotlight-inner p-10 flex flex-col items-start justify-center pointer-events-none">
                        <div class="feat-icon w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700/50 flex items-center justify-center text-3xl mb-8 shadow-inner">
                            ${feat.icon}
                        </div>
                        <h3 class="feat-title text-2xl font-black text-white tracking-tight mb-4">
                            ${feat.title}
                        </h3>
                        <p class="text-slate-400 font-medium leading-relaxed group-hover:text-slate-300 transition-colors">
                            ${feat.text}
                        </p>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', html);
        });

        // Mouse tracking for spotlight
        const cards = document.querySelectorAll('.spotlight-card');
        grid.addEventListener('mousemove', (e) => {
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });

        // Entrance observer
        const observer = new IntersectionObserver(
            (entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            },
            { rootMargin: "-50px" }
        );

        cards.forEach(card => observer.observe(card));

    </script>
</body>
</html>
