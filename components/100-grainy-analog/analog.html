<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grainy Analog Shadows</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #e5e5e5; }
        
        .heavy-grain {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0.12;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-repeat: repeat;
        }

        .ambient-shadow {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            filter: blur(100px);
            will-change: transform;
            pointer-events: none;
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root" class="relative w-full h-screen overflow-hidden flex flex-col items-center justify-center">
        
        <div class="heavy-grain"></div>

        <div id="shadow-1" class="ambient-shadow w-[600px] h-[600px] z-0 transform -translate-x-1/2 -translate-y-1/2"></div>
        <div id="shadow-2" class="ambient-shadow w-[800px] h-[800px] bg-black/50 z-0 transform -translate-x-1/2 -translate-y-1/2"></div>

        <div class="relative z-10 max-w-2xl px-8 flex flex-col items-start w-full">
            <div class="w-16 h-1 bg-black mb-12"></div>
            
            <h1 class="text-8xl font-black text-black tracking-tighter leading-[0.9] mb-8">
                Analog<br/>Shadows.
            </h1>
            
            <p class="text-2xl font-medium text-black/60 leading-relaxed max-w-xl mb-12">
                A departure from digital perfection. Heavy physics-based ambient occlusion blobs lag violently behind your cursor natively, bound under a multiply-blended static film grain.
            </p>

            <button class="px-8 py-4 bg-black text-[#e5e5e5] font-bold text-lg hover:bg-black/80 transition-colors shadow-2xl relative overflow-hidden group">
                <span class="relative z-10">Read Manifesto</span>
            </button>
        </div>

        <div class="absolute right-12 bottom-12 font-mono text-black/30 tracking-widest text-sm z-10 rotate-90 origin-bottom-right">
            SYS // 100
        </div>

    </div>

    <script>
        const s1 = document.getElementById('shadow-1');
        const s2 = document.getElementById('shadow-2');

        let targetX = window.innerWidth / 2;
        let targetY = window.innerHeight / 2;

        let curX1 = targetX, curY1 = targetY;
        let curX2 = targetX, curY2 = targetY;

        window.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        });

        function render() {
            // Shadow 1 is faster
            curX1 += (targetX - curX1) * 0.08;
            curY1 += (targetY - curY1) * 0.08;

            // Shadow 2 is slower and heavier
            curX2 += (targetX - curX2) * 0.03;
            curY2 += (targetY - curY2) * 0.03;

            s1.style.transform = `translate(${curX1 - 300}px, ${curY1 - 300}px)`;
            s2.style.transform = `translate(${curX2 - 400}px, ${curY2 - 400}px)`;

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
