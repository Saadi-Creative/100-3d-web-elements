<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spatial Social Share Fan-Out</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        body {
            background: radial-gradient(circle at center, #101426 0%, #05070e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            perspective: 1000px;
        }

        .share-stage {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* Central Trigger Orb */
        .trigger-orb {
            position: relative;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 15px 35px rgba(2, 132, 199, 0.6),
                0 0 30px rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.4s ease;
            transform-style: preserve-3d;
        }

        .trigger-orb:hover {
            transform: scale(1.1) translateZ(10px);
            box-shadow: 0 20px 45px rgba(56, 189, 248, 0.8);
        }

        .trigger-orb.open {
            transform: rotate(45deg) scale(0.95);
            background: linear-gradient(135deg, #ef4444, #f43f5e);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.6);
        }

        /* Satellite Share Nodes */
        .satellite-node {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: rgba(18, 24, 38, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            cursor: pointer;
            z-index: 10;
            transform: translate3d(0, 0, 0) scale(0);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.3s ease,
                        box-shadow 0.2s ease,
                        border-color 0.2s ease;
            transform-style: preserve-3d;
        }

        .satellite-node:hover {
            border-color: var(--node-color, #38bdf8);
            box-shadow: 0 0 25px var(--node-glow, rgba(56, 189, 248, 0.5));
            transform: translate3d(var(--tx), var(--ty), 20px) scale(1.15) !important;
        }

        /* Fan-out open states */
        .share-stage.open .satellite-node[data-idx="0"] { --tx: 0px;    --ty: -110px; transform: translate3d(var(--tx), var(--ty), 0) scale(1); opacity: 1; transition-delay: 0.03s; }
        .share-stage.open .satellite-node[data-idx="1"] { --tx: 95px;   --ty: -55px;  transform: translate3d(var(--tx), var(--ty), 0) scale(1); opacity: 1; transition-delay: 0.07s; }
        .share-stage.open .satellite-node[data-idx="2"] { --tx: 95px;   --ty: 55px;   transform: translate3d(var(--tx), var(--ty), 0) scale(1); opacity: 1; transition-delay: 0.11s; }
        .share-stage.open .satellite-node[data-idx="3"] { --tx: 0px;    --ty: 110px;  transform: translate3d(var(--tx), var(--ty), 0) scale(1); opacity: 1; transition-delay: 0.15s; }
        .share-stage.open .satellite-node[data-idx="4"] { --tx: -95px;  --ty: 55px;   transform: translate3d(var(--tx), var(--ty), 0) scale(1); opacity: 1; transition-delay: 0.19s; }
        .share-stage.open .satellite-node[data-idx="5"] { --tx: -95px;  --ty: -55px;  transform: translate3d(var(--tx), var(--ty), 0) scale(1); opacity: 1; transition-delay: 0.23s; }

        /* Node Tooltips */
        .node-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-family: var(--font-mono, monospace);
            color: #cbd5e1;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .satellite-node:hover .node-tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* Toast Alert */
        .toast-banner {
            position: absolute;
            bottom: 32px;
            background: rgba(18, 24, 38, 0.9);
            border: 1px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 9999px;
            font-size: 12px;
            font-family: var(--font-mono, monospace);
            color: #f1f5f9;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 50;
        }

        .toast-banner.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="share-stage" id="stage">
        <div class="trigger-orb" id="orb-btn">
            <span>✦</span>
        </div>

        <div class="satellite-node" data-idx="0" style="--node-color: #1d9bf0; --node-glow: rgba(29,155,240,0.5);">
            <span>𝕏</span>
            <div class="node-tooltip">Share on X</div>
        </div>

        <div class="satellite-node" data-idx="1" style="--node-color: #0a66c2; --node-glow: rgba(10,102,194,0.5);">
            <span>in</span>
            <div class="node-tooltip">LinkedIn</div>
        </div>

        <div class="satellite-node" data-idx="2" style="--node-color: #f43f5e; --node-glow: rgba(244,63,94,0.5);">
            <span>📷</span>
            <div class="node-tooltip">Instagram</div>
        </div>

        <div class="satellite-node" data-idx="3" style="--node-color: #22c55e; --node-glow: rgba(34,197,94,0.5);">
            <span>💬</span>
            <div class="node-tooltip">WhatsApp</div>
        </div>

        <div class="satellite-node" data-idx="4" style="--node-color: #a855f7; --node-glow: rgba(168,85,247,0.5);">
            <span>🔗</span>
            <div class="node-tooltip">Copy Link</div>
        </div>

        <div class="satellite-node" data-idx="5" style="--node-color: #f59e0b; --node-glow: rgba(245,158,11,0.5);">
            <span>✉️</span>
            <div class="node-tooltip">Email Pass</div>
        </div>
    </div>

    <div class="toast-banner" id="toast">Link copied to clipboard!</div>

    <script>
        const stage = document.getElementById('stage');
        const orbBtn = document.getElementById('orb-btn');
        const toast = document.getElementById('toast');
        const nodes = document.querySelectorAll('.satellite-node');

        let isOpen = false;

        orbBtn.addEventListener('click', () => {
            isOpen = !isOpen;
            stage.classList.toggle('open', isOpen);
            orbBtn.classList.toggle('open', isOpen);
            orbBtn.querySelector('span').textContent = isOpen ? '✕' : '✦';
        });

        nodes.forEach(node => {
            node.addEventListener('click', (e) => {
                e.stopPropagation();
                const label = node.querySelector('.node-tooltip').textContent;
                toast.textContent = `✓ ${label} action triggered!`;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        });
    </script>
</body>
</html>
