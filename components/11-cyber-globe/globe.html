<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>11 - Holographic Orbital Command Sphere</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #0b1329 0%, #030712 100%);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Tactical HUD Glass Frame */
    .hud-header {
      position: absolute;
      top: var(--space-6);
      left: var(--space-6);
      right: var(--space-6);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
      pointer-events: auto;
    }

    .hud-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .hud-title {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--text-heading);
    }

    .hud-stats {
      display: flex;
      gap: var(--space-4);
      pointer-events: auto;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      font-size: var(--text-xs);
      color: var(--text-muted);
      backdrop-filter: blur(16px);
    }

    .stat-val {
      font-weight: 700;
      color: var(--accent-base);
    }

    /* Region Selector Toolbar */
    .hud-toolbar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .region-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .region-btn:hover {
      color: var(--text-heading);
    }

    .region-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="hud-header">
      <div class="hud-brand">
        <div class="hud-indicator"></div>
        <span class="hud-title">Orbital Mesh Telemetry</span>
      </div>

      <div class="hud-stats">
        <div class="stat-pill">Nodes <span class="stat-val" id="nodeCount">2,048</span></div>
        <div class="stat-pill">Sync <span class="stat-val">99.8%</span></div>
      </div>
    </div>

    <div id="canvas-container"></div>

    <div class="hud-toolbar" role="toolbar" aria-label="Region filters">
      <button class="region-btn is-active" data-region="global">Global Mesh</button>
      <button class="region-btn" data-region="americas">Americas Cluster</button>
      <button class="region-btn" data-region="emea">EMEA Backbone</button>
      <button class="region-btn" data-region="apac">APAC Node</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
    camera.position.z = 3.6;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.6;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.enableZoom = false;

    // Outer Cyber Grid Sphere
    const radius = 1.4;
    const sphereGeo = new THREE.SphereGeometry(radius, 48, 36);
    const pointMat = new THREE.PointsMaterial({
      color: 0x3b82f6,
      size: 0.016,
      transparent: true,
      opacity: 0.7,
      sizeAttenuation: true
    });
    const globePoints = new THREE.Points(sphereGeo, pointMat);
    scene.add(globePoints);

    // Inner Glowing Core
    const coreGeo = new THREE.SphereGeometry(radius * 0.98, 32, 24);
    const coreMat = new THREE.MeshBasicMaterial({
      color: 0x6366f1,
      transparent: true,
      opacity: 0.08,
      blending: THREE.AdditiveBlending
    });
    scene.add(new THREE.Mesh(coreGeo, coreMat));

    // Orbital Rings
    const ringGeo = new THREE.RingGeometry(radius + 0.15, radius + 0.16, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.25,
      side: THREE.DoubleSide
    });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 3;
    scene.add(ringMesh);

    // Active Node Beacons
    const nodeCount = 120;
    const nodeGeo = new THREE.BufferGeometry();
    const nodePos = new Float32Array(nodeCount * 3);
    for (let i = 0; i < nodeCount; i++) {
      const phi = Math.acos(2 * Math.random() - 1);
      const theta = Math.random() * Math.PI * 2;
      nodePos[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
      nodePos[i * 3 + 1] = radius * Math.cos(phi);
      nodePos[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
    }
    nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePos, 3));
    const nodeMat = new THREE.PointsMaterial({
      color: 0x34d399,
      size: 0.035,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending
    });
    const beaconMesh = new THREE.Points(nodeGeo, nodeMat);
    scene.add(beaconMesh);

    // Animation Loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      controls.update();
      ringMesh.rotation.z = t * 0.1;
      globePoints.rotation.y = t * 0.02;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const W2 = container.clientWidth, H2 = container.clientHeight;
      camera.aspect = W2 / H2;
      camera.updateProjectionMatrix();
      renderer.setSize(W2, H2);
    });

    // Region toolbar filter listener
    const regionBtns = document.querySelectorAll('.region-btn');
    const nodeCountEl = document.getElementById('nodeCount');

    regionBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        regionBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        const counts = { global: '2,048', americas: '840', emea: '620', apac: '588' };
        nodeCountEl.textContent = counts[btn.dataset.region] || '1,000';
      });
    });
  </script>
</body>
</html>
