<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sculpted Resin Progress</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-8);
        }

        .progress-label {
            font-size: var(--text-sm);
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Machined block */
        .progress-block {
            width: 440px;
            height: 60px;
            padding: var(--space-2);
            border-radius: var(--radius-xl);
            background: var(--surface-base);
            border: 1px solid var(--border-subtle);
            /* Outer block depth */
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.5),
                inset 0 1px 1px rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
        }

        /* CNC Milled Channel */
        .progress-channel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: var(--radius-lg);
            background: var(--bg-secondary);
            /* Deep inner shadow for the hollow cavity */
            box-shadow: 
                inset 0 4px 12px rgba(0,0,0,0.8),
                inset 0 1px 3px rgba(0,0,0,0.4),
                0 1px 0 rgba(255,255,255,0.05);
            overflow: hidden;
        }

        /* Resin Fill */
        .progress-resin {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: var(--accent-base);
            
            /* Fluid volumetric glow */
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.4),
                inset 0 -2px 8px rgba(0,0,0,0.4),
                0 0 20px var(--accent-base);
                
            transition: width 0.1s linear;
        }

        /* Internal light reflection on the fluid */
        .progress-resin::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent);
            border-radius: 10px 10px 0 0;
        }

        .progress-percentage {
            font-family: var(--font-mono);
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
        }
        
        .glow-text {
            color: var(--accent-base);
            text-shadow: 0 0 15px var(--accent-base);
            transition: all var(--time-slow) var(--ease-out);
        }

    </style>
</head>
<body>
    <div class="stage">
        <div class="progress-label">System Initialization</div>
        
        <div class="progress-block">
            <div class="progress-channel">
                <div class="progress-resin" id="resin"></div>
            </div>
        </div>

        <div class="progress-percentage" id="percentage">0.0%</div>
    </div>

    <script>
        const resin = document.getElementById('resin');
        const percentage = document.getElementById('percentage');
        
        // Use realistic easing for progress
        let progress = 0;
        let targetProgress = 100;
        let currentVelocity = 0;
        
        function animate() {
            if (progress < targetProgress) {
                // Easing logic simulating variable download/init speed
                const distance = targetProgress - progress;
                // Add some random noise to velocity
                const noise = Math.random() * 0.5;
                currentVelocity = (distance * 0.02) + noise;
                
                progress += currentVelocity;
                
                if (progress > 99.9) {
                    progress = 100;
                }

                resin.style.width = `${progress}%`;
                percentage.textContent = `${progress.toFixed(1)}%`;
                
                if(progress === 100) {
                    percentage.classList.add('glow-text');
                }
                
                requestAnimationFrame(animate);
            }
        }

        setTimeout(() => {
            requestAnimationFrame(animate);
        }, 500);
    </script>
</body>
</html>
