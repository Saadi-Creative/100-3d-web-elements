<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12 - Hydro-Prismatic Fluid Lens</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
    }

    /* Hydro Lens Card Frame */
    .lens-frame {
      position: relative;
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-2xl);
      overflow: hidden;
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-2xl);
      transform-style: preserve-3d;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .lens-frame:hover {
      border-color: var(--border-strong);
      transform: translateY(-4px);
    }

    #canvas-container {
      width: 100%;
      height: 320px;
      cursor: crosshair;
    }

    .lens-label {
      padding: var(--space-4) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-overlay);
    }

    .lens-title {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--text-heading);
    }

    .lens-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .badge-shader {
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Mode Toolbar */
    .lens-toolbar {
      margin-top: var(--space-6);
      display: flex;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .mode-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="lens-frame">
      <div id="canvas-container"></div>
      <div class="lens-label">
        <div>
          <div class="lens-title">Hydro-Prismatic Fluid Lens</div>
          <div class="lens-sub">Viscous GLSL Shader Displacement</div>
        </div>
        <span class="badge-shader">GPU · GLSL</span>
      </div>
    </div>

    <div class="lens-toolbar" role="toolbar" aria-label="Shader fluid modes">
      <button class="mode-btn is-active" data-speed="4.0" data-freq="28.0">Tidal Wave</button>
      <button class="mode-btn" data-speed="1.5" data-freq="14.0">Mercury Flow</button>
      <button class="mode-btn" data-speed="8.0" data-freq="45.0">Ripple Pulse</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth;
    const H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      uniform sampler2D uTexture;
      uniform vec2 uMouse;
      uniform float uTime;
      uniform float uHover;
      uniform float uSpeed;
      uniform float uFreq;
      varying vec2 vUv;

      void main() {
        vec2 uv = vUv;
        vec2 delta = uv - uMouse;
        float dist = length(delta);

        float wave = sin(dist * uFreq - uTime * uSpeed) * (uHover * 0.035);
        float attenuation = smoothstep(0.4, 0.0, dist);
        wave *= attenuation;

        vec2 displacementDir = normalize(delta + vec2(0.0001));
        uv += displacementDir * wave;
        uv = clamp(uv, 0.001, 0.999);

        vec4 color = texture2D(uTexture, uv);
        float aberration = attenuation * uHover * 0.01;

        float r = texture2D(uTexture, uv + vec2(aberration, 0.0)).r;
        float g = color.g;
        float b = texture2D(uTexture, uv + vec2(-aberration, 0.0)).b;

        gl_FragColor = vec4(r, g, b, 1.0);
      }
    `;

    const loader = new THREE.TextureLoader();
    const texture = loader.load(
      'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=680&h=560&fit=crop&auto=format&q=85'
    );
    texture.minFilter = THREE.LinearFilter;

    const uniforms = {
      uTexture: { value: texture },
      uMouse:   { value: new THREE.Vector2(0.5, 0.5) },
      uTime:    { value: 0.0 },
      uHover:   { value: 0.0 },
      uSpeed:   { value: 4.0 },
      uFreq:    { value: 28.0 }
    };

    const geometry = new THREE.PlaneGeometry(2, 2);
    const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
    scene.add(new THREE.Mesh(geometry, material));

    let targetHover = 0, targetMX = 0.5, targetMY = 0.5;
    let currentHover = 0, currentMX = 0.5, currentMY = 0.5;

    container.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      targetMX = (e.clientX - rect.left) / rect.width;
      targetMY = 1.0 - (e.clientY - rect.top) / rect.height;
    });

    container.addEventListener('mouseenter', () => { targetHover = 1.0; });
    container.addEventListener('mouseleave', () => { targetHover = 0.0; });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      uniforms.uTime.value += delta;

      currentMX += (targetMX - currentMX) * 0.08;
      currentMY += (targetMY - currentMY) * 0.08;
      currentHover += (targetHover - currentHover) * 0.06;

      uniforms.uMouse.value.set(currentMX, currentMY);
      uniforms.uHover.value = currentHover;

      renderer.render(scene, camera);
    }
    animate();

    const modeBtns = document.querySelectorAll('.mode-btn');
    modeBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        modeBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        uniforms.uSpeed.value = parseFloat(btn.dataset.speed);
        uniforms.uFreq.value = parseFloat(btn.dataset.freq);
      });
    });
  </script>
</body>
</html>
