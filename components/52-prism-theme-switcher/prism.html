<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Crystal Prism Theme Switcher</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        :root {
            --theme-primary: #38bdf8;
            --theme-glow: rgba(56, 189, 248, 0.3);
            --theme-accent: #818cf8;
            --theme-bg: #070913;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--theme-bg);
            min-height: 100vh;
            overflow: hidden;
            color: white;
            font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, sans-serif);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background 0.5s ease;
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hud-overlay {
            position: absolute;
            top: 24px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--theme-primary);
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-family: var(--font-mono, monospace);
            color: var(--theme-primary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
            box-shadow: 0 0 20px var(--theme-glow);
            transition: all 0.4s ease;
        }

        .hud-title {
            font-size: 22px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }

        /* Interactive Prismatic Palette Selector */
        .prism-palette-bar {
            position: absolute;
            bottom: 32px;
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 14px;
            border-radius: 9999px;
            z-index: 20;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .palette-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 9999px;
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            font-family: var(--font-mono, monospace);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .palette-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--dot-color);
            box-shadow: 0 0 8px var(--dot-color);
        }

        .palette-pill:hover {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.05);
        }

        .palette-pill.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--theme-primary);
            color: #ffffff;
            box-shadow: 0 0 20px var(--theme-glow);
        }

        /* Mock UI Surface Card */
        .mock-surface {
            position: absolute;
            width: 380px;
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            z-index: 10;
            pointer-events: none;
            transform: translateZ(-20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mock-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .mock-title {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
        }

        .mock-btn {
            background: var(--theme-primary);
            color: #04060a;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 8px;
            box-shadow: 0 0 15px var(--theme-glow);
            transition: all 0.4s ease;
        }

        .mock-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            overflow: hidden;
        }

        .mock-fill {
            height: 100%;
            width: 72%;
            background: linear-gradient(90deg, var(--theme-primary), var(--theme-accent));
            border-radius: 9999px;
            transition: all 0.4s ease;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="hud-overlay">
        <div class="hud-badge" id="theme-badge">
            <span>💎</span>
            <span id="theme-name">Cyan Prismatic Spectrum</span>
        </div>
        <div class="hud-title">Drag or click palette to rotate optical dispersion</div>
    </div>

    <div class="mock-surface">
        <div class="mock-head">
            <span class="mock-title">Active Quantum Environment</span>
            <span class="mock-btn">DEPLOY</span>
        </div>
        <div style="font-size: 13px; color: #94a3b8; line-height: 1.5;">
            Color variables synchronized with 3D prism angle of incidence and internal spectral refraction.
        </div>
        <div class="mock-bar">
            <div class="mock-fill"></div>
        </div>
    </div>

    <div class="prism-palette-bar">
        <button class="palette-pill active" data-theme="cyan" data-color="#38bdf8" data-accent="#818cf8" data-bg="#070913" data-label="Cyan Prismatic Spectrum" style="--dot-color: #38bdf8;">
            <span class="palette-dot"></span>
            <span>Cyan</span>
        </button>

        <button class="palette-pill" data-theme="emerald" data-color="#34d399" data-accent="#10b981" data-bg="#04120b" data-label="Emerald Aurora Prism" style="--dot-color: #34d399;">
            <span class="palette-dot"></span>
            <span>Emerald</span>
        </button>

        <button class="palette-pill" data-theme="rose" data-color="#f43f5e" data-accent="#ec4899" data-bg="#14060b" data-label="Rose Crimson Dispersion" style="--dot-color: #f43f5e;">
            <span class="palette-dot"></span>
            <span>Rose</span>
        </button>

        <button class="palette-pill" data-theme="amber" data-color="#fbbf24" data-accent="#f97316" data-bg="#140e04" data-label="Solar Amber Refraction" style="--dot-color: #fbbf24;">
            <span class="palette-dot"></span>
            <span>Amber</span>
        </button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 7);

        // 3D Optical Glass Prism (Triangular Prism Geometry)
        const prismGeo = new THREE.CylinderGeometry(1.6, 1.6, 2.2, 3, 1, false);
        const prismMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transmission: 0.95,
            opacity: 1,
            transparent: true,
            roughness: 0.05,
            ior: 1.65,
            thickness: 1.8,
            specularIntensity: 1.0,
            clearcoat: 1.0,
            attenuationColor: new THREE.Color(0x38bdf8),
            attenuationDistance: 2.0
        });

        const prism = new THREE.Mesh(prismGeo, prismMat);
        prism.rotation.z = Math.PI / 2;
        scene.add(prism);

        // Spectral Rainbow Caustic Ray Beams
        const rayGeo = new THREE.ConeGeometry(2.5, 6, 32, 1, true);
        rayGeo.rotateX(Math.PI / 2);
        const rayMat = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: new THREE.Color(0x38bdf8) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying vec2 vUv;
                void main() {
                    float beam = smoothstep(0.0, 0.5, vUv.y) * (1.0 - vUv.y);
                    gl_FragColor = vec4(uColor, beam * 0.4);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });

        const rayBeam = new THREE.Mesh(rayGeo, rayMat);
        rayBeam.position.set(2.5, 0, 0);
        rayBeam.rotation.y = -Math.PI / 2;
        scene.add(rayBeam);

        // Ambient & Studio Lights
        const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambLight);
        const light1 = new THREE.PointLight(0x38bdf8, 3.0, 15);
        light1.position.set(-4, 3, 4);
        scene.add(light1);

        // Theme Palette Switcher
        const pills = document.querySelectorAll('.palette-pill');
        const themeName = document.getElementById('theme-name');

        function setTheme(btn) {
            pills.forEach(p => p.classList.remove('active'));
            btn.classList.add('active');

            const color = btn.dataset.color;
            const accent = btn.dataset.accent;
            const bg = btn.dataset.bg;
            const label = btn.dataset.label;

            document.documentElement.style.setProperty('--theme-primary', color);
            document.documentElement.style.setProperty('--theme-glow', `${color}44`);
            document.documentElement.style.setProperty('--theme-accent', accent);
            document.documentElement.style.setProperty('--theme-bg', bg);
            themeName.textContent = label;

            const hexColor = new THREE.Color(color);
            prismMat.attenuationColor.set(hexColor);
            rayMat.uniforms.uColor.value.set(hexColor);
            light1.color.set(hexColor);
        }

        pills.forEach(pill => {
            pill.addEventListener('click', () => setTheme(pill));
        });

        // Mouse Drag / Orbit
        let mouseX = 0;
        let mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            prism.rotation.y = time * 0.6 + mouseX * 1.5;
            prism.rotation.x = mouseY * 0.8;

            rayBeam.rotation.z = Math.sin(time * 0.8) * 0.2;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
