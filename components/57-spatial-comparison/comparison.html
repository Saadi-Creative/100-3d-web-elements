<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spatial Comparison Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #030712; min-height: 100vh; font-family: 'Inter', sans-serif; }
        #root { width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 0; }
        
        .preserve-3d {
            transform-style: preserve-3d;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.9), inset 0 1px 1px rgba(255,255,255,0.1);
        }
        
        .glass-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateZ(0) scale(1);
        }
        
        .glass-row.glow-row {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2), inset 0 0 10px rgba(56, 189, 248, 0.1);
            transform: translateZ(40px) scale(1.05);
        }
        
        .glass-row.dimmed {
            opacity: 0.3;
        }

        .row-label { transition: color 0.3s; }
        .row-value { transition: color 0.3s; }
        
        .glow-row .row-label { color: #38bdf8 !important; }
        .glow-row .row-value { color: white !important; }
        
        .card-left {
            transform: rotateY(15deg) scale(1);
            transform-origin: right center;
            margin: 0 2rem;
            animation: initLeft 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }
        .card-right {
            transform: rotateY(-15deg) scale(1);
            transform-origin: left center;
            margin: 0 2rem;
            animation: initRight 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }
        
        @keyframes initLeft {
            from { transform: rotateY(15deg) scale(0.95); }
            to { transform: rotateY(15deg) scale(1); }
        }
        @keyframes initRight {
            from { transform: rotateY(-15deg) scale(0.95); }
            to { transform: rotateY(-15deg) scale(1); }
        }
        
        .connection-beam {
            transition: opacity 0.3s;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root">
        <div class="w-full min-h-screen relative flex flex-col items-center justify-center p-8 py-16 preserve-3d" style="perspective: 1800px">
            <div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,rgba(56,189,248,0.03)_0%,transparent_60%)] pointer-events-none"></div>

            <div class="mb-12 text-center z-10" style="transform: translateZ(-200px)">
                <h1 class="text-5xl font-black mb-4 text-white drop-shadow-2xl tracking-tighter">Silicon Matrix</h1>
                <p class="text-slate-400 font-medium">Hover to physically align and compare specifications.</p>
            </div>

            <div class="flex gap-16 items-center justify-center preserve-3d z-10 w-full max-w-7xl relative">
                <!-- Virtual Connection Beam -->
                <div id="beam" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[200px] h-[2px] bg-gradient-to-r from-transparent via-sky-400 to-transparent blur-[2px] opacity-0 connection-beam pointer-events-none"></div>

                <!-- Left Card -->
                <div class="w-[320px] md:w-[380px] rounded-[24px] p-6 md:p-8 glass-panel preserve-3d flex flex-col relative card-left">
                    <div class="mb-6 pb-4 border-b border-white/5 preserve-3d relative z-10 text-center">
                        <h2 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-200 to-slate-400 drop-shadow-md mb-1">M-Series Ultra</h2>
                        <p class="text-slate-500 font-semibold tracking-[0.2em] text-[10px] md:text-xs uppercase">ARM Ecosystem</p>
                    </div>
                    <div id="left-rows" class="flex flex-col gap-2 preserve-3d flex-grow"></div>
                </div>

                <!-- Right Card -->
                <div class="w-[320px] md:w-[380px] rounded-[24px] p-6 md:p-8 glass-panel preserve-3d flex flex-col relative card-right">
                    <div class="mb-6 pb-4 border-b border-white/5 preserve-3d relative z-10 text-center">
                        <h2 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-200 to-slate-400 drop-shadow-md mb-1">Ryzen Thread</h2>
                        <p class="text-slate-500 font-semibold tracking-[0.2em] text-[10px] md:text-xs uppercase">x86 Desktop</p>
                    </div>
                    <div id="right-rows" class="flex flex-col gap-2 preserve-3d flex-grow"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const comparisonData = [
            { label: "Architecture", left: "ARMv9", right: "x86-64" },
            { label: "Base Clock", left: "3.2 GHz", right: "2.8 GHz" },
            { label: "Boost Clock", left: "4.8 GHz", right: "5.4 GHz" },
            { label: "Core Count", left: "12 Cores", right: "16 Cores" },
            { label: "L3 Cache", left: "48 MB", right: "64 MB" },
            { label: "TDP", left: "65W", right: "125W" }
        ];

        const leftRows = document.getElementById('left-rows');
        const rightRows = document.getElementById('right-rows');
        const beam = document.getElementById('beam');
        
        let allLeftRows = [];
        let allRightRows = [];

        function renderRows() {
            comparisonData.forEach((spec, idx) => {
                const createRow = (value, isLeft) => {
                    const row = document.createElement('div');
                    row.className = 'relative flex items-center p-2.5 md:p-3 rounded-xl cursor-default preserve-3d glass-row';
                    row.innerHTML = `
                        <div class="w-1/3 text-[10px] md:text-xs font-bold uppercase tracking-wider text-slate-500 row-label">
                            ${spec.label}
                        </div>
                        <div class="w-2/3 text-right">
                            <span class="text-sm md:text-md font-bold text-slate-300 row-value">
                                ${value}
                            </span>
                        </div>
                    `;
                    
                    row.addEventListener('mouseenter', () => setHover(idx));
                    row.addEventListener('mouseleave', () => setHover(null));
                    
                    return row;
                };

                const lRow = createRow(spec.left, true);
                const rRow = createRow(spec.right, false);
                
                allLeftRows.push(lRow);
                allRightRows.push(rRow);
                
                leftRows.appendChild(lRow);
                rightRows.appendChild(rRow);
            });
        }

        function setHover(idx) {
            beam.style.opacity = idx !== null ? '0.5' : '0';
            
            allLeftRows.forEach((r, i) => {
                if (i === idx) {
                    r.classList.add('glow-row');
                    r.classList.remove('dimmed');
                } else {
                    r.classList.remove('glow-row');
                    if (idx !== null) r.classList.add('dimmed');
                    else r.classList.remove('dimmed');
                }
            });
            allRightRows.forEach((r, i) => {
                if (i === idx) {
                    r.classList.add('glow-row');
                    r.classList.remove('dimmed');
                } else {
                    r.classList.remove('glow-row');
                    if (idx !== null) r.classList.add('dimmed');
                    else r.classList.remove('dimmed');
                }
            });
        }

        renderRows();
    </script>
</body>
</html>
