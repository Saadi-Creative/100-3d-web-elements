<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16 - Kinetic Particle Typography Matrix</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #030712 100%);
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* HUD Header */
    .hud-header {
      position: absolute;
      top: var(--space-6);
      left: var(--space-6);
      right: var(--space-6);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-title {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--text-heading);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
      pointer-events: auto;
    }

    /* Mode Toolbar */
    .hud-toolbar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .mode-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="hud-header">
      <span class="hud-title">Kinetic Particle Typography Matrix</span>
    </div>

    <div id="canvas-container"></div>

    <div class="hud-toolbar" role="toolbar" aria-label="Particle modes">
      <button class="mode-btn is-active" data-mode="assemble">Assemble Matrix</button>
      <button class="mode-btn" data-mode="orbit">Gravitate Orbit</button>
      <button class="mode-btn" data-mode="disperse">Dispersion Wave</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 100);
    camera.position.z = 4.5;

    // Generate Text Target Coordinates via 2D Canvas
    function generateTextPoints(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = 100;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 400, 100);
      ctx.fillStyle = '#fff';
      ctx.font = '900 64px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 200, 50);

      const data = ctx.getImageData(0, 0, 400, 100).data;
      const points = [];
      const density = 4;
      for (let y = 0; y < 100; y += density) {
        for (let x = 0; x < 400; x += density) {
          if (data[(y * 400 + x) * 4] > 128) {
            points.push(
              ((x / 400) - 0.5) * 6,
              -((y / 100) - 0.5) * 1.8,
              0
            );
          }
        }
      }
      return points;
    }

    const words = ['SPATIAL', 'KINETIC', 'SYSTEM'];
    let wordIdx = 0;
    let targetCoords = generateTextPoints(words[wordIdx]);
    const PARTICLE_COUNT = Math.max(900, targetCoords.length / 3);

    const particleGeo = new THREE.SphereGeometry(0.024, 4, 4);
    const particleMat = new THREE.MeshBasicMaterial({
      color: 0x8b5cf6,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const instancedMesh = new THREE.InstancedMesh(particleGeo, particleMat, PARTICLE_COUNT);
    scene.add(instancedMesh);

    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const targets = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      positions[i * 3]     = (Math.random() - 0.5) * 12;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 6;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 6;

      const tIdx = (i % (targetCoords.length / 3)) * 3;
      targets[i * 3]     = targetCoords[tIdx] || 0;
      targets[i * 3 + 1] = targetCoords[tIdx + 1] || 0;
      targets[i * 3 + 2] = (Math.random() - 0.5) * 0.2;

      velocities[i * 3]     = (Math.random() - 0.5) * 0.05;
      velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.05;
      velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.05;
    }

    const dummy = new THREE.Object3D();
    let currentMode = 'assemble';
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const ix = i * 3, iy = i * 3 + 1, iz = i * 3 + 2;

        if (currentMode === 'assemble') {
          positions[ix] += (targets[ix] - positions[ix]) * 0.06;
          positions[iy] += (targets[iy] - positions[iy]) * 0.06;
          positions[iz] += (targets[iz] - positions[iz]) * 0.06;
        } else if (currentMode === 'orbit') {
          const orbitRadius = 0.4 + (i % 20) * 0.02;
          positions[ix] += (targets[ix] + Math.cos(t * 2 + i) * orbitRadius - positions[ix]) * 0.05;
          positions[iy] += (targets[iy] + Math.sin(t * 2 + i) * orbitRadius - positions[iy]) * 0.05;
        } else if (currentMode === 'disperse') {
          positions[ix] += velocities[ix];
          positions[iy] += velocities[iy];
          positions[iz] += velocities[iz];
        }

        dummy.position.set(positions[ix], positions[iy], positions[iz]);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);
      }
      instancedMesh.instanceMatrix.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const W2 = container.clientWidth, H2 = container.clientHeight;
      camera.aspect = W2 / H2;
      camera.updateProjectionMatrix();
      renderer.setSize(W2, H2);
    });

    const modeBtns = document.querySelectorAll('.mode-btn');
    modeBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        modeBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        currentMode = btn.dataset.mode;
        if (currentMode === 'assemble') {
          wordIdx = (wordIdx + 1) % words.length;
          targetCoords = generateTextPoints(words[wordIdx]);
          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const tIdx = (i % (targetCoords.length / 3)) * 3;
            targets[i * 3]     = targetCoords[tIdx] || 0;
            targets[i * 3 + 1] = targetCoords[tIdx + 1] || 0;
            targets[i * 3 + 2] = 0;
          }
        }
      });
    });
  </script>
</body>
</html>
