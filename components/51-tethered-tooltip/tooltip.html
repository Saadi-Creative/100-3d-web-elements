<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Tethered Elastic Tooltip</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        body {
            background: radial-gradient(circle at center, #101426 0%, #05070e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            perspective: 1200px;
            gap: 40px;
        }

        #tether-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .hud-header {
            text-align: center;
            z-index: 10;
        }

        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-family: var(--font-mono, monospace);
            color: #818cf8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .hud-title {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }

        /* Targets Row */
        .targets-row {
            display: flex;
            gap: 28px;
            z-index: 10;
        }

        .target-node {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 24px;
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        .target-node:hover,
        .target-node.active {
            border-color: var(--node-accent, #818cf8);
            box-shadow: 0 0 30px var(--node-glow, rgba(129, 140, 248, 0.4));
            transform: scale(1.08) translateZ(15px);
        }

        .node-icon {
            font-size: 26px;
        }

        .node-label {
            font-size: 11px;
            font-family: var(--font-mono, monospace);
            color: #94a3b8;
            font-weight: 600;
        }

        /* Physics Tethered Floating Card */
        .tethered-card {
            position: absolute;
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transform-origin: center center;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            transition: opacity 0.25s ease;
        }

        .tethered-card.visible {
            opacity: 1;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .card-tag {
            font-size: 10px;
            font-family: var(--font-mono, monospace);
            padding: 2px 7px;
            border-radius: 9999px;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
        }

        .card-desc {
            font-size: 12.5px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .card-metric {
            margin-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono, monospace);
            font-size: 10px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <canvas id="tether-canvas"></canvas>

    <div class="hud-header">
        <div class="hud-badge">
            <span>🪢</span>
            <span>Verlet Spring Tendon Tether</span>
        </div>
        <div class="hud-title">Hover targets to draw elastic kinetic ligaments</div>
    </div>

    <div class="targets-row">
        <div class="target-node" data-title="Neural Compiler" data-desc="Optimizes tensor graphs into bare-metal WASM assembly with SIMD acceleration." data-metric="Latency: 0.14ms" style="--node-accent: #818cf8; --node-glow: rgba(129, 140, 248, 0.4);">
            <span class="node-icon">🧠</span>
            <span class="node-label">Compiler</span>
        </div>

        <div class="target-node" data-title="Vector Cache L1" data-desc="In-memory HNSW spatial index serving 400k vector embeddings per second." data-metric="Hit Rate: 99.8%" style="--node-accent: #34d399; --node-glow: rgba(52, 211, 153, 0.4);">
            <span class="node-icon">⚡</span>
            <span class="node-label">Cache</span>
        </div>

        <div class="target-node" data-title="Quantum Key Ring" data-desc="Post-quantum cryptographic key encapsulation with continuous entropy seeding." data-metric="Entropy: 100%" style="--node-accent: #f43f5e; --node-glow: rgba(244, 63, 94, 0.4);">
            <span class="node-icon">🛡️</span>
            <span class="node-label">Vault</span>
        </div>

        <div class="target-node" data-title="Spatial Telemetry" data-desc="Multi-region real-time stream aggregation across 340 global edge PoPs." data-metric="Bandwidth: 14 TB/s" style="--node-accent: #fbbf24; --node-glow: rgba(251, 191, 36, 0.4);">
            <span class="node-icon">◈</span>
            <span class="node-label">Mesh</span>
        </div>
    </div>

    <div class="tethered-card" id="card">
        <div class="card-head">
            <span style="font-weight: 700; color: #f8fafc; font-size: 13px;" id="card-title">Module Info</span>
            <span class="card-tag">ACTIVE</span>
        </div>
        <div class="card-desc" id="card-desc">Tether description placeholder.</div>
        <div class="card-metric">
            <span>TELEMETRY</span>
            <span style="color: #38bdf8;" id="card-metric">OK</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tether-canvas');
        const ctx = canvas.getContext('2d');
        const card = document.getElementById('card');
        const cardTitle = document.getElementById('card-title');
        const cardDesc = document.getElementById('card-desc');
        const cardMetric = document.getElementById('card-metric');
        const nodes = document.querySelectorAll('.target-node');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let activeNode = null;
        let cardPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let cardVel = { x: 0, y: 0 };
        let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
        });

        nodes.forEach(node => {
            node.addEventListener('mouseenter', () => {
                activeNode = node;
                node.classList.add('active');
                cardTitle.textContent = node.dataset.title;
                cardDesc.textContent = node.dataset.desc;
                cardMetric.textContent = node.dataset.metric;
                card.classList.add('visible');
            });

            node.addEventListener('mouseleave', () => {
                node.classList.remove('active');
                activeNode = null;
                card.classList.remove('visible');
            });
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (activeNode) {
                const rect = activeNode.getBoundingClientRect();
                const nodeCenter = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };

                // Target position offset above/side cursor
                const targetX = mousePos.x + 30;
                const targetY = mousePos.y - 120;

                // Spring physics towards target
                const k = 0.12;
                const damping = 0.78;

                cardVel.x += (targetX - cardPos.x) * k;
                cardVel.y += (targetY - cardPos.y) * k;
                cardVel.x *= damping;
                cardVel.y *= damping;

                cardPos.x += cardVel.x;
                cardPos.y += cardVel.y;

                // Dynamic 3D tilt based on velocity
                const tiltX = -cardVel.y * 0.8;
                const tiltY = cardVel.x * 0.8;

                card.style.transform = `translate3d(${cardPos.x}px, ${cardPos.y}px, 30px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

                // Draw elastic bezier ligament tendon between node and card
                const cardCenter = {
                    x: cardPos.x + card.offsetWidth / 2,
                    y: cardPos.y + card.offsetHeight / 2
                };

                const midX = (nodeCenter.x + cardCenter.x) / 2 + cardVel.x * 2;
                const midY = (nodeCenter.y + cardCenter.y) / 2 + cardVel.y * 2;

                ctx.beginPath();
                ctx.moveTo(nodeCenter.x, nodeCenter.y);
                ctx.quadraticCurveTo(midX, midY, cardCenter.x, cardCenter.y);
                ctx.strokeStyle = activeNode.style.getPropertyValue('--node-accent') || '#818cf8';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = activeNode.style.getPropertyValue('--node-accent') || '#818cf8';
                ctx.shadowBlur = 12;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
