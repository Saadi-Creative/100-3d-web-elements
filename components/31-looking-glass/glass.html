<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>31 - Optical Looking Glass Telescope</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #020617;
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .hero-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .hero-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: var(--space-2);
    }

    .hero-title {
      font-size: var(--text-4xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
    }

    .hero-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-2);
    }

    .glass-toolbar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .zoom-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .zoom-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div id="canvas-container"></div>

    <div class="hero-center">
      <span class="hero-tag">OPTICAL SCOPE APERTURE</span>
      <h1 class="hero-title">Looking Glass</h1>
      <p class="hero-sub">Camera focal depth traversal with wireframe rings</p>
    </div>

    <div class="glass-toolbar" role="toolbar" aria-label="Aperture focal controls">
      <button class="zoom-btn is-active" data-z="15">Wide Scope</button>
      <button class="zoom-btn" data-z="6">Mid Aperture</button>
      <button class="zoom-btn" data-z="-2">Through Vortex</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
    camera.position.z = 15;

    // Rings vortex
    const ringGroup = new THREE.Group();
    for (let i = 0; i < 20; i++) {
      const geo = new THREE.TorusGeometry(3 + i * 0.3, 0.04, 8, 48);
      const mat = new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? 0x6366f1 : 0x38bdf8,
        wireframe: true,
        transparent: true,
        opacity: 0.35 + (i / 20) * 0.4
      });
      const ring = new THREE.Mesh(geo, mat);
      ring.position.z = -i * 1.5;
      ringGroup.add(ring);
    }
    scene.add(ringGroup);

    let targetZ = 15;
    let mouseX = 0, mouseY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      camera.position.z += (targetZ - camera.position.z) * 0.05;
      camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
      camera.position.y += (mouseY * 2 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, -20);

      ringGroup.rotation.z = t * 0.1;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const W2 = container.clientWidth, H2 = container.clientHeight;
      camera.aspect = W2 / H2;
      camera.updateProjectionMatrix();
      renderer.setSize(W2, H2);
    });

    const zoomBtns = document.querySelectorAll('.zoom-btn');
    zoomBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        zoomBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        targetZ = parseFloat(btn.dataset.z);
      });
    });
  </script>
</body>
</html>
