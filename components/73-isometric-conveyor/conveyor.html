<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Isometric Conveyor Belt Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #0f172a; min-height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; }
        .preserve-3d { transform-style: preserve-3d; perspective: 1800px; }
        
        .conveyor-belt {
            background: repeating-linear-gradient(
                0deg,
                #334155, 
                #334155 20px, 
                #1e293b 20px, 
                #1e293b 40px
            );
            background-size: 100% 80px;
        }

        @keyframes moveBelt {
            0% { background-position: 0px 0px; }
            100% { background-position: 0px 80px; }
        }
        
        .block-element {
            position: absolute;
            width: 80px;
            height: 80px;
            left: calc(50% - 40px);
            transform: translateZ(200px) translateY(0px);
            opacity: 0;
            animation: dropAndMove 3s linear forwards;
        }
        
        @keyframes dropAndMove {
            0% { transform: translateZ(200px) translateY(0px); opacity: 0; }
            15% { transform: translateZ(0px) translateY(82.5px); opacity: 1; }
            80% { transform: translateZ(0px) translateY(440px); opacity: 1; }
            90% { transform: translateZ(0px) translateY(495px); opacity: 1; }
            100% { transform: translateZ(0px) translateY(550px); opacity: 0; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="w-full h-screen relative preserve-3d flex items-center justify-center">
        
        <div class="absolute top-12 left-12 z-20">
            <h1 class="text-4xl font-black text-white mb-4 tracking-tighter">Physical Pipeline.</h1>
            <p class="text-slate-400 max-w-sm font-medium leading-relaxed mb-8">CSS Isometric Planes coupled with linear keyframes creates a fully faked 3D rendering of a conveyor belt, processing DOM objects.</p>
            <button 
                id="upload-btn"
                class="bg-sky-500 text-white px-8 py-4 font-bold rounded-full drop-shadow-[0_0_20px_rgba(56,189,248,0.4)] disabled:opacity-50 transition-transform active:scale-95"
            >
                Initiate Upload Sequence
            </button>
        </div>

        <div class="preserve-3d w-[300px] h-[600px] absolute" style="transform: rotateX(60deg) rotateZ(-45deg); top: 20%;">
            <div id="belt" class="absolute inset-0 conveyor-belt rounded-b-3xl border-x-[12px] border-b-[12px] border-slate-700 shadow-2xl"></div>

            <div class="absolute top-[-20px] left-0 right-0 h-10 bg-[radial-gradient(ellipse_at_center,rgba(56,189,248,0.8)_0%,transparent_100%)] blur-[20px] z-10"></div>

            <div id="blocks-container" class="absolute inset-0 preserve-3d">
                <!-- Blocks spawned here -->
            </div>
        </div>
    </div>
    
    <script>
        const btn = document.getElementById('upload-btn');
        const belt = document.getElementById('belt');
        const container = document.getElementById('blocks-container');
        
        let progress = 0;
        let isUploading = false;
        let intervalId = null;

        btn.addEventListener('click', () => {
            if (isUploading || progress === 100) return;
            
            progress = 0;
            isUploading = true;
            btn.textContent = `Uploading ${progress}%`;
            btn.disabled = true;
            belt.style.animation = 'moveBelt 1s linear infinite';
            
            intervalId = setInterval(() => {
                spawnBlock();
                progress = Math.min(progress + 5, 100);
                btn.textContent = progress === 100 ? "Processing Complete" : `Uploading ${progress}%`;
                
                if(progress >= 100) {
                    isUploading = false;
                    clearInterval(intervalId);
                    setTimeout(() => {
                        belt.style.animation = 'none';
                    }, 3000); // wait for last block to finish
                }
            }, 400);
        });

        function spawnBlock() {
            const block = document.createElement('div');
            block.className = 'block-element preserve-3d';
            block.innerHTML = `
                <div class="absolute inset-0 bg-sky-400 border border-sky-300 flex items-center justify-center font-bold text-sky-900 drop-shadow-[0_0_15px_rgba(56,189,248,0.8)]">PKG</div>
                <div class="absolute inset-0 bg-sky-600 border border-sky-500 origin-bottom" style="transform: rotateX(-90deg) translateZ(80px); height: 20px; top: calc(100% - 20px);"></div>
                <div class="absolute inset-0 bg-sky-500 border border-sky-400 origin-right" style="transform: rotateY(90deg) translateZ(80px); width: 20px; left: calc(100% - 20px);"></div>
            `;
            
            container.appendChild(block);
            
            // Remove after animation completes
            setTimeout(() => {
                if(container.contains(block)) {
                    container.removeChild(block);
                }
            }, 3000);
        }
    </script>
</body>
</html>
