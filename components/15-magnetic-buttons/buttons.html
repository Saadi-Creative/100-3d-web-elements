<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>15 - Electromagnetic Flux Actuators</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      gap: var(--space-8);
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #020617 80%);
      perspective: 1000px;
    }

    .demo-header {
      text-align: center;
    }

    .demo-title {
      font-size: var(--text-2xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
    }

    .demo-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      margin-top: var(--space-2);
    }

    /* Magnetic Force Zone Wrapper */
    .mag-zone {
      position: relative;
      padding: var(--space-6);
      display: inline-flex;
      transform-style: preserve-3d;
    }

    /* 3D Magnetic Actuator Button */
    .mag-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-8);
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: var(--surface-card);
      color: var(--text-heading);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: 700;
      letter-spacing: var(--tracking-wide);
      cursor: pointer;
      outline: none;
      transform-style: preserve-3d;
      box-shadow: var(--shadow-xl), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
      will-change: transform;
    }

    .mag-btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: rgba(99, 102, 241, 0.4);
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
    }

    .mag-btn-emerald {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: rgba(16, 185, 129, 0.4);
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35);
    }

    .mag-btn-amber {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: rgba(245, 158, 11, 0.4);
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.35);
    }

    .mag-btn:focus-visible {
      border-color: #ffffff;
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Shockwave Ripple Ring */
    .mag-ripple {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      pointer-events: none;
      animation: rippleExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes rippleExpand {
      0% {
        width: 0px;
        height: 0px;
        opacity: 1;
        transform: translate(-50%, -50%) scale(0);
      }
      100% {
        width: 180px;
        height: 180px;
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      <h1 class="demo-title">Electromagnetic Flux Actuators</h1>
      <p class="demo-sub">3D Magnetic Spatial Pull & Force Vector Response</p>
    </div>

    <div class="btn-row">
      <div class="mag-zone" data-pull="35">
        <button class="mag-btn mag-btn-primary" id="btn1">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
          <span>Primary Flux</span>
        </button>
      </div>

      <div class="mag-zone" data-pull="40">
        <button class="mag-btn mag-btn-emerald" id="btn2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          <span>Emerald Vector</span>
        </button>
      </div>

      <div class="mag-zone" data-pull="45">
        <button class="mag-btn mag-btn-amber" id="btn3">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span>Amber Ignition</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const zones = document.querySelectorAll('.mag-zone');

    function lerp(start, end, factor) {
      return start + (end - start) * factor;
    }

    zones.forEach((zone) => {
      const btn = zone.querySelector('.mag-btn');
      const pullPower = parseFloat(zone.dataset.pull) || 35;

      let currentX = 0, currentY = 0, currentRotX = 0, currentRotY = 0, currentZ = 0;
      let targetX = 0, targetY = 0, targetRotX = 0, targetRotY = 0, targetZ = 0;
      let animId = null;

      function updatePhysics() {
        currentX = lerp(currentX, targetX, 0.12);
        currentY = lerp(currentY, targetY, 0.12);
        currentRotX = lerp(currentRotX, targetRotX, 0.12);
        currentRotY = lerp(currentRotY, targetRotY, 0.12);
        currentZ = lerp(currentZ, targetZ, 0.12);

        btn.style.transform = `
          translate3d(${currentX}px, ${currentY}px, ${currentZ}px)
          rotateX(${currentRotX}deg)
          rotateY(${currentRotY}deg)
        `;

        if (
          Math.abs(targetX - currentX) > 0.1 ||
          Math.abs(targetY - currentY) > 0.1 ||
          Math.abs(targetZ - currentZ) > 0.1
        ) {
          animId = requestAnimationFrame(updatePhysics);
        } else {
          animId = null;
        }
      }

      function requestAnim() {
        if (!animId) animId = requestAnimationFrame(updatePhysics);
      }

      zone.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const deltaX = e.clientX - centerX;
        const deltaY = e.clientY - centerY;

        targetX = deltaX * (pullPower / rect.width);
        targetY = deltaY * (pullPower / rect.height);
        targetRotX = -(deltaY / (rect.height / 2)) * 14;
        targetRotY = (deltaX / (rect.width / 2)) * 14;
        targetZ = 15;

        requestAnim();
      });

      zone.addEventListener('mouseleave', () => {
        targetX = 0;
        targetY = 0;
        targetRotX = 0;
        targetRotY = 0;
        targetZ = 0;
        requestAnim();
      });

      btn.addEventListener('mousedown', (e) => {
        targetZ = 4;
        requestAnim();

        // Shockwave ripple
        const ripple = document.createElement('div');
        ripple.className = 'mag-ripple';
        ripple.style.left = `${e.clientX - btn.getBoundingClientRect().left}px`;
        ripple.style.top = `${e.clientY - btn.getBoundingClientRect().top}px`;
        btn.appendChild(ripple);

        ripple.addEventListener('animationend', () => ripple.remove());
      });

      btn.addEventListener('mouseup', () => {
        targetZ = 15;
        requestAnim();
      });
    });
  </script>
</body>
</html>
