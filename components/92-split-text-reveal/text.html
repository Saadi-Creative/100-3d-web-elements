<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Text Stagger Reveal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; background: #fafaf9; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .tall-container { min-height: 200vh; }
        .word-wrapper { display: inline-flex; overflow: hidden; vertical-align: bottom; }
        
        .perspective-text { perspective: 1200px; transform-style: preserve-3d; }
        
        .word-node {
            display: inline-block;
            transform-origin: bottom;
            transform: translateY(120%) rotateX(-40deg) scale(0.9);
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease;
        }

        .split-text-container.revealed .word-node {
            transform: translateY(0%) rotateX(0deg) scale(1);
            opacity: 1;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root">
        <div class="w-full tall-container flex flex-col items-center">
            
            <div class="w-full h-[60vh] flex flex-col items-center justify-end pb-32 bg-slate-100">
                <h2 class="text-3xl font-black text-slate-800 tracking-tighter uppercase mb-4">Start Scaling.</h2>
                <div class="text-slate-500 font-bold uppercase tracking-widest text-sm flex gap-4 animate-bounce">
                    <span>Scroll Down Base</span> 
                    <span>↓</span>
                </div>
            </div>

            <div class="py-40 px-8 max-w-5xl mx-auto text-center">
                <div class="text-7xl md:text-[110px] font-black tracking-tighter text-slate-900 leading-[0.85]">
                    <div class="split-text-container flex flex-wrap gap-x-4 gap-y-2 justify-center perspective-text" data-text="The definitive industry standard for premium kinetic typography."></div>
                </div>
            </div>
            
            <div class="py-20 px-8 max-w-3xl mx-auto text-center">
                <div class="text-3xl font-bold tracking-tight text-slate-500 leading-tight">
                    <div class="split-text-container flex flex-wrap gap-x-2 gap-y-1 justify-center perspective-text" data-text="Vanilla JS systematically cycles through an array of DOM text nodes wrapped tightly inside overflow-hidden masks. Each word is mathematically yanked to the 0px baseline via a CSS cubic-bezier translation."></div>
                </div>
            </div>

            <div class="w-full flex justify-center pb-40 relative">
                <button id="trigger-btn" class="opacity-0 translate-y-8 px-8 py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-xl hover:scale-105 transition-all duration-700 ease-out">
                    Orchestrate Load
                </button>
            </div>

        </div>
    </div>

    <script>
        // Setup text splitters
        document.querySelectorAll('.split-text-container').forEach(container => {
            const text = container.getAttribute('data-text');
            const words = text.split(" ");
            
            words.forEach((word, index) => {
                const delay = 0.1 + (index * 0.08); // stagger
                const html = `
                    <div class="word-wrapper pb-2">
                        <span class="word-node whitespace-pre-wrap" style="transition-delay: ${delay}s">${word}</span>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        });

        // Intersection Observer for scroll triggers
        const observer = new IntersectionObserver(
            (entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('revealed');
                        observer.unobserve(entry.target);
                    }
                });
            },
            { threshold: 0.5 }
        );

        document.querySelectorAll('.split-text-container').forEach(el => observer.observe(el));

        // Button Reveal
        const btnObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    entry.target.classList.remove('opacity-0', 'translate-y-8');
                    btnObserver.unobserve(entry.target);
                }
            })
        }, { threshold: 1 });
        btnObserver.observe(document.getElementById('trigger-btn'));
    </script>
</body>
</html>
