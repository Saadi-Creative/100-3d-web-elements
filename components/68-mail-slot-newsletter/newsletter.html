<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Spatial Mail Slot Newsletter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; overflow: hidden; }
        .preserve-3d { transform-style: preserve-3d; perspective: 1000px; }
        .mail-slot {
            box-shadow: inset 0 15px 25px rgba(0,0,0,0.8), inset 0 2px 2px rgba(0,0,0,0.9), 0 2px 0 rgba(255,255,255,0.05);
            background: #020617;
        }
        
        .form-container {
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s;
            transform: rotateX(0deg) scale(1) translate3d(0,0,20px);
        }
        
        .form-container.folding {
            transform: rotateX(-80deg) scale(0.6) translate3d(0, 10px, -20px);
        }
        
        .form-container.dropped {
            transform: rotateX(-80deg) scale(0.4) translate3d(0, 80px, -100px);
            opacity: 0;
            transition-timing-function: ease-in;
        }
        
        .envelope-flap {
            transform-origin: top;
            transform: rotateX(-180deg);
            opacity: 0;
            transition: transform 0.4s ease-out, opacity 0.4s;
            backface-visibility: hidden;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }
        
        .form-container.folding .envelope-flap, .form-container.dropped .envelope-flap {
            transform: rotateX(0deg);
            opacity: 1;
        }
        
        .success-badge {
            transform: translateY(-50px) rotateX(90deg) translateZ(-100px);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
        }
        
        .success-badge.show {
            transform: translateY(0) rotateX(0deg) translateZ(20px);
            opacity: 1;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="w-full h-screen flex flex-col items-center justify-center p-8 preserve-3d">
        <div class="text-center mb-16 relative z-10">
            <h1 class="text-4xl font-black text-slate-100 mb-4 tracking-tighter drop-shadow-lg">Stay in the loop.</h1>
            <p class="text-slate-400 font-medium max-w-sm">Enter your email below. Watch it physically fold into an envelope and drop straight into the central void.</p>
        </div>

        <div class="relative w-full max-w-md h-24 preserve-3d flex items-center justify-center">
            
            <div class="absolute inset-0 mail-slot rounded-2xl border border-white/5 border-t-black flex items-center justify-center overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-b from-black via-black/80 to-transparent pointer-events-none"></div>
            </div>

            <div id="form-wrapper" class="absolute inset-0 flex items-center justify-center px-2 preserve-3d h-full form-container">
                <form id="newsletter-form" class="w-full h-16 bg-white rounded-xl shadow-[0_10px_20px_rgba(0,0,0,0.5)] border border-slate-200 flex items-center px-2 relative preserve-3d">
                    <div class="absolute top-0 left-0 w-full h-1/2 bg-slate-100 border-b border-slate-300 pointer-events-none envelope-flap"></div>

                    <input id="email-input" type="email" placeholder="Enter your email address" required class="w-full h-full bg-transparent px-4 text-slate-800 font-semibold focus:outline-none disabled:opacity-50" />
                    <button id="submit-btn" type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-lg font-bold transition-colors active:scale-95 disabled:scale-100 disabled:opacity-50 h-[calc(100%-12px)] shadow-[0_4px_10px_rgba(79,70,229,0.3)]">
                        Subscribe
                    </button>
                </form>
            </div>

            <div id="success-badge" class="absolute w-full h-16 bg-emerald-500 rounded-xl shadow-[0_0_30px_rgba(52,211,153,0.5)] border border-emerald-400 flex items-center justify-center success-badge pointer-events-none">
                <span class="text-white font-black text-xl tracking-wider uppercase">Subscribed!</span>
                <svg class="w-6 h-6 ml-2 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>

        </div>
    </div>
    
    <script>
        const form = document.getElementById('newsletter-form');
        const formWrapper = document.getElementById('form-wrapper');
        const emailInput = document.getElementById('email-input');
        const submitBtn = document.getElementById('submit-btn');
        const successBadge = document.getElementById('success-badge');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if(!emailInput.value) return;

            emailInput.disabled = true;
            submitBtn.disabled = true;
            
            formWrapper.classList.add('folding');
            
            setTimeout(() => {
                formWrapper.classList.remove('folding');
                formWrapper.classList.add('dropped');
                
                setTimeout(() => {
                    successBadge.classList.add('show');
                    
                    setTimeout(() => {
                        successBadge.classList.remove('show');
                        
                        setTimeout(() => {
                            formWrapper.classList.remove('dropped');
                            emailInput.value = '';
                            emailInput.disabled = false;
                            submitBtn.disabled = false;
                        }, 600);
                        
                    }, 3000);
                    
                }, 500);
                
            }, 600);
        });
    </script>
</body>
</html>
