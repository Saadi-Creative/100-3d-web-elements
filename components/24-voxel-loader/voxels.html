<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24 - Isometric Voxel Assembly Matrix</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: relative;
      width: 340px;
      height: 340px;
    }

    canvas {
      display: block;
    }

    /* Telemetry Progress Bar */
    .telemetry-card {
      margin-top: var(--space-6);
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-lg);
    }

    .telemetry-status {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      color: var(--accent-base);
    }

    .progress-bar-track {
      width: 140px;
      height: 4px;
      border-radius: var(--radius-full);
      background: var(--surface-overlay);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      border-radius: var(--radius-full);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div id="canvas-container">
      <canvas id="c"></canvas>
    </div>

    <div class="telemetry-card">
      <span class="telemetry-status" id="phaseStatus">Assembling Voxel Matrix</span>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('c');
    const SIZE = 340;
    canvas.width = canvas.height = SIZE;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(SIZE, SIZE);

    const scene = new THREE.Scene();
    const ISO = SIZE / 12;
    const camera = new THREE.OrthographicCamera(-ISO, ISO, ISO, -ISO, 0.1, 1000);
    camera.position.set(20, 20, 20);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dl1 = new THREE.DirectionalLight(0x6366f1, 1.5);
    dl1.position.set(5, 8, 5);
    scene.add(dl1);

    const GRID = 4;
    const STEP = 2.2;
    const HALF = ((GRID - 1) * STEP) / 2;

    const targetPositions = [];
    for (let x = 0; x < GRID; x++)
      for (let y = 0; y < GRID; y++)
        for (let z = 0; z < GRID; z++)
          targetPositions.push(new THREE.Vector3(x * STEP - HALF, y * STEP - HALF, z * STEP - HALF));

    const COUNT = targetPositions.length;
    const PALETTE = [0x6366f1, 0x8b5cf6, 0x38bdf8, 0x34d399, 0xf59e0b];

    const boxGeo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
    const mat = new THREE.MeshStandardMaterial({ roughness: 0.2, metalness: 0.4 });
    const instMesh = new THREE.InstancedMesh(boxGeo, mat, COUNT);
    scene.add(instMesh);

    const dummy = new THREE.Object3D();
    const curPos = targetPositions.map(() => ({ x: (Math.random() - 0.5) * 30, y: (Math.random() - 0.5) * 30, z: (Math.random() - 0.5) * 30 }));
    const colorArr = new THREE.Color();

    for (let i = 0; i < COUNT; i++) {
      colorArr.setHex(PALETTE[i % PALETTE.length]);
      instMesh.setColorAt(i, colorArr);
    }
    instMesh.instanceColor.needsUpdate = true;

    const PHASE_TIMES = [2.2, 0.8, 2.0, 0.5];
    let phaseIdx = 0;
    let phaseTimer = 0;
    const phaseNames = ['Assembling Matrix', 'Voxel Cube Formed', 'Exploding Particles', 'Void Reset'];
    const phaseStatus = document.getElementById('phaseStatus');
    const progressFill = document.getElementById('progressFill');

    function lerp(a, b, t) { return a + (b - a) * t; }
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      phaseTimer += dt;

      const dur = PHASE_TIMES[phaseIdx];
      const prog = Math.min(phaseTimer / dur, 1.0);

      phaseStatus.textContent = phaseNames[phaseIdx];
      progressFill.style.width = `${prog * 100}%`;

      if (phaseTimer >= dur) {
        phaseTimer = 0;
        phaseIdx = (phaseIdx + 1) % 4;
      }

      instMesh.rotation.y += 0.005;

      for (let i = 0; i < COUNT; i++) {
        const tp = targetPositions[i];
        if (phaseIdx === 0) {
          curPos[i].x = lerp(curPos[i].x, tp.x, 0.08);
          curPos[i].y = lerp(curPos[i].y, tp.y, 0.08);
          curPos[i].z = lerp(curPos[i].z, tp.z, 0.08);
        } else if (phaseIdx === 2) {
          curPos[i].x += (Math.random() - 0.5) * 0.4;
          curPos[i].y += (Math.random() - 0.5) * 0.4;
          curPos[i].z += (Math.random() - 0.5) * 0.4;
        }

        dummy.position.set(curPos[i].x, curPos[i].y, curPos[i].z);
        dummy.updateMatrix();
        instMesh.setMatrixAt(i, dummy.matrix);
      }
      instMesh.instanceMatrix.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
