<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Isometric Layered Feature Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; overflow: hidden;}
        .preserve-3d { transform-style: preserve-3d; }
        
        .stack-container {
            perspective: 2000px;
        }
        
        .stack {
            width: 320px;
            height: 400px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: rotateX(60deg) rotateZ(-45deg) scale(0.9);
        }
        
        .stack.hovered {
            transform: rotateX(55deg) rotateZ(-40deg) scale(1);
        }
        
        .layer {
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            transform: translateZ(var(--z-resting));
        }
        
        .stack.hovered .layer {
            transform: translateZ(var(--z-exploded));
        }
        
        .stack.hovered.has-hovered-layer .layer {
            opacity: 0.3;
        }
        
        .stack.hovered.has-hovered-layer .layer.is-hovered {
            opacity: 1;
            transform: translateZ(calc(var(--z-exploded) + 20px));
        }
        
        .layer-shadow {
            transition: opacity 0.4s, filter 0.4s;
            opacity: 0.4;
            filter: blur(5px);
            transform: translateZ(-20px);
        }
        
        .stack.hovered .layer-shadow {
            opacity: 0.15;
            filter: blur(20px);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="w-full flex items-center justify-center p-8 preserve-3d relative stack-container">
        
        <div class="absolute top-12 left-12 max-w-sm">
            <h1 class="text-4xl font-black text-slate-800 mb-4 tracking-tight">Full Stack Architecture.</h1>
            <p class="text-slate-500 font-medium">Hover over the spatial stack to explode the architecture into its individual isometric planes. Select a layer to isolate it.</p>
        </div>

        <div id="stack" class="relative stack preserve-3d pointer-events-auto">
            <!-- Layers generated by JS -->
        </div>
        
    </div>

    <script>
        const layersData = [
            { id: 1, name: "Database", type: "PostgreSQL", color: "from-blue-500 to-cyan-400", icon: " 🗄️ " },
            { id: 2, name: "API Layer", type: "GraphQL", color: "from-pink-500 to-rose-400", icon: " ⚡ " },
            { id: 3, name: "Logic Core", type: "Node.js", color: "from-emerald-500 to-teal-400", icon: " ⚙️ " },
            { id: 4, name: "Frontend", type: "React UI", color: "from-violet-500 to-purple-400", icon: " 💻 " }
        ];

        const stack = document.getElementById('stack');
        
        layersData.forEach((layer, i) => {
            const el = document.createElement('div');
            el.className = 'absolute inset-0 rounded-[32px] preserve-3d cursor-pointer layer pointer-events-none';
            
            const restingZ = i * 2;
            const explodedZ = i * 80;
            
            el.style.setProperty('--z-resting', `${restingZ}px`);
            el.style.setProperty('--z-exploded', `${explodedZ}px`);
            el.style.transitionDelay = `${i * 0.05}s`;
            
            el.innerHTML = `
                <!-- Shadow -->
                <div class="absolute inset-0 bg-black rounded-[32px] pointer-events-none layer-shadow"></div>
                
                <!-- Card -->
                <div class="w-full h-full bg-gradient-to-br ${layer.color} opacity-90 backdrop-blur-md rounded-[32px] border border-white/30 shadow-[inset_0_0_20px_rgba(255,255,255,0.4)] flex flex-col justify-between p-8 text-white preserve-3d overflow-hidden">
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,white_1px,transparent_1px)]" style="background-size: 16px 16px;"></div>
                    
                    <div class="flex justify-between items-start relative z-10 preserve-3d">
                        <div class="text-4xl">${layer.icon}</div>
                        <div class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider backdrop-blur-sm shadow-sm border border-white/20">
                            Layer 0${i+1}
                        </div>
                    </div>
                    
                    <div class="relative z-10 preserve-3d">
                        <p class="text-white/80 font-semibold mb-1 uppercase tracking-widest text-sm">${layer.name}</p>
                        <h2 class="text-3xl font-black tracking-tight">${layer.type}</h2>
                    </div>
                </div>
            `;
            
            // Re-enable pointer events on hover of the stack
            el.addEventListener('mouseenter', () => {
                stack.classList.add('has-hovered-layer');
                el.classList.add('is-hovered');
            });
            el.addEventListener('mouseleave', () => {
                stack.classList.remove('has-hovered-layer');
                el.classList.remove('is-hovered');
            });
            
            stack.appendChild(el);
        });
        
        stack.addEventListener('mouseenter', () => {
            stack.classList.add('hovered');
            // reset transition delays for hover out
            Array.from(stack.children).forEach(el => el.style.pointerEvents = 'auto');
        });
        
        stack.addEventListener('mouseleave', () => {
            stack.classList.remove('hovered');
            stack.classList.remove('has-hovered-layer');
            Array.from(stack.children).forEach((el, i) => {
                el.classList.remove('is-hovered');
                el.style.pointerEvents = 'none';
            });
        });
    </script>
</body>
</html>
