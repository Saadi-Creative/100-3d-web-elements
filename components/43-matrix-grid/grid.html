<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll-Driven Matrix Transformation Grid</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #04060a;
            min-height: 100vh;
            overflow: hidden;
            color: white;
            font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, sans-serif);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hud-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hud-title {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }

        .hud-sub {
            font-size: 12px;
            font-family: var(--font-mono, monospace);
            color: #38bdf8;
        }

        .transformation-modes {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            padding: 6px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-family: var(--font-mono, monospace);
            padding: 8px 16px;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #38bdf8;
            color: #04060a;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .mode-btn:hover:not(.active) {
            color: #ffffff;
        }

        .matrix-math-box {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-radius: 12px;
            font-family: var(--font-mono, monospace);
            font-size: 10px;
            color: #64748b;
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .math-row {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="hud-overlay">
        <div class="hud-left">
            <div class="hud-title">Affine Matrix Tensor Transformation</div>
            <div class="hud-sub" id="mode-desc">Mode: [0] Cubic Lattice · Neutral State</div>
        </div>
    </div>

    <div class="transformation-modes">
        <button class="mode-btn active" data-mode="0">1. Neutral Cube</button>
        <button class="mode-btn" data-mode="1">2. Shear Vector</button>
        <button class="mode-btn" data-mode="2">3. Spherical Bloom</button>
        <button class="mode-btn" data-mode="3">4. Vortex Twist</button>
    </div>

    <div class="matrix-math-box">
        <div>AFFINE TENSOR (4×4):</div>
        <div class="math-row" id="m0">[ 1.00,  0.00,  0.00,  0.00 ]</div>
        <div class="math-row" id="m1">[ 0.00,  1.00,  0.00,  0.00 ]</div>
        <div class="math-row" id="m2">[ 0.00,  0.00,  1.00,  0.00 ]</div>
        <div class="math-row" id="m3">[ 0.00,  0.00,  0.00,  1.00 ]</div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 8);
        camera.lookAt(0, 0, 0);

        // 3D Instanced Matrix Grid of Glowing Micro-Nodes
        const GRID_DIM = 7; // 7x7x7 = 343 nodes
        const NODE_COUNT = GRID_DIM * GRID_DIM * GRID_DIM;
        const SPACING = 0.55;

        const boxGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
        const boxMat = new THREE.MeshStandardMaterial({
            color: 0x38bdf8,
            roughness: 0.2,
            metalness: 0.8,
            emissive: 0x0284c7,
            emissiveIntensity: 0.4
        });

        const instancedMesh = new THREE.InstancedMesh(boxGeo, boxMat, NODE_COUNT);
        scene.add(instancedMesh);

        // Ambient & Directional Lighting
        const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.0);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Wireframe Axis Helpers
        const gridHelper = new THREE.GridHelper(8, 16, 0x1e293b, 0x0f172a);
        gridHelper.position.y = -2.2;
        scene.add(gridHelper);

        // Base Initial Coordinates
        const basePos = [];
        const currentPos = [];
        const targetPos = [];

        let idx = 0;
        const offset = ((GRID_DIM - 1) * SPACING) / 2;

        for (let x = 0; x < GRID_DIM; x++) {
            for (let y = 0; y < GRID_DIM; y++) {
                for (let z = 0; z < GRID_DIM; z++) {
                    const bx = x * SPACING - offset;
                    const by = y * SPACING - offset;
                    const bz = z * SPACING - offset;

                    basePos.push(new THREE.Vector3(bx, by, bz));
                    currentPos.push(new THREE.Vector3(bx, by, bz));
                    targetPos.push(new THREE.Vector3(bx, by, bz));
                    idx++;
                }
            }
        }

        let activeMode = 0;
        const modeDesc = document.getElementById('mode-desc');
        const modeButtons = document.querySelectorAll('.mode-btn');

        const modeLabels = [
            'Mode: [0] Cubic Lattice · Neutral State',
            'Mode: [1] Shear Vectoring · Linear Shear Transform',
            'Mode: [2] Spherical Bloom · Radial Wave Expansion',
            'Mode: [3] Vortex Twist · High Velocity Tensor Rotation'
        ];

        function applyTransformation(mode) {
            activeMode = mode;
            modeDesc.textContent = modeLabels[mode];
            modeButtons.forEach(btn => btn.classList.toggle('active', parseInt(btn.dataset.mode) === mode));

            for (let i = 0; i < NODE_COUNT; i++) {
                const b = basePos[i];
                if (mode === 0) {
                    // Neutral Cube
                    targetPos[i].copy(b);
                } else if (mode === 1) {
                    // Shear Vector
                    targetPos[i].set(
                        b.x + b.y * 0.7,
                        b.y,
                        b.z + b.y * 0.4
                    );
                } else if (mode === 2) {
                    // Spherical Bloom
                    const len = b.length();
                    const dir = b.clone().normalize();
                    targetPos[i].copy(dir.multiplyScalar(len * 1.6 + 0.3));
                } else if (mode === 3) {
                    // Vortex Twist
                    const angle = b.y * 1.5;
                    const cosA = Math.cos(angle);
                    const sinA = Math.sin(angle);
                    targetPos[i].set(
                        b.x * cosA - b.z * sinA,
                        b.y * 1.2,
                        b.x * sinA + b.z * cosA
                    );
                }
            }
        }

        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                applyTransformation(parseInt(btn.dataset.mode));
            });
        });

        // Mouse Orbit
        let mouseX = 0;
        let mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        const dummy = new THREE.Object3D();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Camera subtle orbit
            camera.position.x = 6 * Math.cos(time * 0.2 + mouseX * 0.5);
            camera.position.z = 8 * Math.sin(time * 0.2 + mouseX * 0.5);
            camera.position.y = 4 - mouseY * 2;
            camera.lookAt(0, 0, 0);

            // Interpolate node positions
            for (let i = 0; i < NODE_COUNT; i++) {
                currentPos[i].lerp(targetPos[i], 0.08);

                dummy.position.copy(currentPos[i]);
                dummy.rotation.x = time * 0.5 + i * 0.01;
                dummy.rotation.y = time * 0.3 + i * 0.01;
                dummy.updateMatrix();

                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            instancedMesh.instanceMatrix.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
