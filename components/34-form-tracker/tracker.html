<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>34 - Spatial Step Telemetry Form Tracker</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%);
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Floating Stepper Card */
    .stepper-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
      border-radius: var(--radius-2xl);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-2xl);
      backdrop-filter: blur(20px);
    }

    /* Node Tracker Row */
    .tracker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      margin-bottom: var(--space-8);
    }

    .tracker-line {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      height: 2px;
      background: var(--surface-overlay);
      z-index: 0;
    }

    .tracker-line-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #34d399);
      transition: width 0.4s ease;
    }

    .step-node {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      cursor: pointer;
    }

    .node-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-overlay);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .step-node.is-active .node-icon {
      background: var(--accent-base);
      border-color: var(--accent-base);
      color: #ffffff;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .step-node.is-complete .node-icon {
      background: #34d399;
      border-color: #34d399;
      color: #ffffff;
    }

    .node-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .step-node.is-active .node-label {
      color: var(--text-heading);
    }

    /* Form Fields */
    .form-pane {
      display: none;
      flex-direction: column;
      gap: var(--space-4);
    }

    .form-pane.is-active {
      display: flex;
    }

    .field-label {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .field-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-subtle);
      color: var(--text-heading);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-input:focus {
      border-color: var(--accent-base);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Button Controls */
    .btn-row {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-6);
    }

    .btn-action {
      flex: 1;
      padding: var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-base), #4f46e5);
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-secondary {
      background: var(--surface-overlay);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div id="canvas-container"></div>

    <div class="stepper-card">
      <div class="tracker-row">
        <div class="tracker-line">
          <div class="tracker-line-fill" id="lineFill"></div>
        </div>

        <div class="step-node is-active" data-step="0">
          <div class="node-icon">1</div>
          <span class="node-label">Account</span>
        </div>

        <div class="step-node" data-step="1">
          <div class="node-icon">2</div>
          <span class="node-label">Shipping</span>
        </div>

        <div class="step-node" data-step="2">
          <div class="node-icon">3</div>
          <span class="node-label">Payment</span>
        </div>
      </div>

      <!-- Step 0: Account -->
      <div class="form-pane is-active" id="pane0">
        <div>
          <label class="field-label" for="acc-name">Full Name</label>
          <input class="field-input" id="acc-name" type="text" placeholder="Alex Morgan" />
        </div>
        <div>
          <label class="field-label" for="acc-email">Email Address</label>
          <input class="field-input" id="acc-email" type="email" placeholder="alex@domain.com" />
        </div>
      </div>

      <!-- Step 1: Shipping -->
      <div class="form-pane" id="pane1">
        <div>
          <label class="field-label" for="ship-addr">Street Address</label>
          <input class="field-input" id="ship-addr" type="text" placeholder="742 Evergreen Terrace" />
        </div>
        <div>
          <label class="field-label" for="ship-city">City / State</label>
          <input class="field-input" id="ship-city" type="text" placeholder="San Francisco, CA" />
        </div>
      </div>

      <!-- Step 2: Payment -->
      <div class="form-pane" id="pane2">
        <div>
          <label class="field-label" for="pay-card">Card Number</label>
          <input class="field-input" id="pay-card" type="text" placeholder="•••• •••• •••• 4242" />
        </div>
        <div>
          <label class="field-label" for="pay-exp">Expiry / CVC</label>
          <input class="field-input" id="pay-exp" type="text" placeholder="12/28 · 888" />
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-action btn-secondary" id="btnPrev" style="display: none;">Back</button>
        <button class="btn-action btn-primary" id="btnNext">Continue →</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
    camera.position.z = 8;

    const rings = [1.8, 2.8, 3.8].map((radius, i) => {
      const geo = new THREE.TorusGeometry(radius, 0.02, 8, 64);
      const mat = new THREE.MeshBasicMaterial({
        color: i === 0 ? 0x6366f1 : i === 1 ? 0x34d399 : 0xf59e0b,
        transparent: true,
        opacity: 0.25
      });
      const ring = new THREE.Mesh(geo, mat);
      ring.rotation.x = Math.PI / 2.5 + i * 0.2;
      scene.add(ring);
      return ring;
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      rings.forEach((r, i) => {
        r.rotation.z = t * (0.1 + i * 0.05);
      });
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const W2 = container.clientWidth, H2 = container.clientHeight;
      camera.aspect = W2 / H2;
      camera.updateProjectionMatrix();
      renderer.setSize(W2, H2);
    });

    // Step Transition UI Logic
    let curStep = 0;
    const nodes = document.querySelectorAll('.step-node');
    const panes = document.querySelectorAll('.form-pane');
    const fill = document.getElementById('lineFill');
    const btnNext = document.getElementById('btnNext');
    const btnPrev = document.getElementById('btnPrev');

    function updateStep(step) {
      curStep = step;
      fill.style.width = `${(curStep / 2) * 100}%`;

      nodes.forEach((n, i) => {
        n.classList.toggle('is-active', i === curStep);
        n.classList.toggle('is-complete', i < curStep);
      });

      panes.forEach((p, i) => p.classList.toggle('is-active', i === curStep));
      btnPrev.style.display = curStep > 0 ? 'block' : 'none';
      btnNext.textContent = curStep === 2 ? 'Complete Order ✓' : 'Continue →';
    }

    btnNext.addEventListener('click', () => {
      if (curStep < 2) updateStep(curStep + 1);
      else alert('Order processed successfully!');
    });

    btnPrev.addEventListener('click', () => {
      if (curStep > 0) updateStep(curStep - 1);
    });

    nodes.forEach((n) => {
      n.addEventListener('click', () => {
        const target = parseInt(n.dataset.step, 10);
        if (target <= curStep) updateStep(target);
      });
    });
  </script>
</body>
</html>
