<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>21 - Procedural Aurora Solar Wind Nebula</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #020617;
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .hero-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .hero-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--accent-base);
      margin-bottom: var(--space-3);
    }

    .hero-title {
      font-size: var(--text-4xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
    }

    .hero-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-3);
    }

    /* Aurora Theme Toolbar */
    .aurora-toolbar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .theme-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div id="canvas-container"></div>

    <div class="hero-center">
      <div class="hero-tag">GLSL PROCEDURAL NEBULA</div>
      <h1 class="hero-title">Aurora Solar Wind</h1>
      <p class="hero-sub">Multi-octave fractional Brownian motion fluid dynamics</p>
    </div>

    <div class="aurora-toolbar" role="toolbar" aria-label="Aurora palette controls">
      <button class="theme-btn is-active" data-theme="violet">Obsidian Violet</button>
      <button class="theme-btn" data-theme="cyan">Cyber Cyan</button>
      <button class="theme-btn" data-theme="emerald">Emerald Solar</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const fragmentShader = `
      precision highp float;
      uniform float uTime;
      uniform vec2 uResolution;
      uniform vec2 uMouse;
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      varying vec2 vUv;

      vec2 random2(vec2 st){
        st = vec2( dot(st, vec2(127.1, 311.7)), dot(st, vec2(269.5, 183.3)) );
        return -1.0 + 2.0 * fract(sin(st) * 4375.854);
      }

      float noise(vec2 st) {
        vec2 i = floor(st);
        vec2 f = fract(st);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix( mix( dot( random2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0) ),
                         dot( random2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0) ), u.x),
                    mix( dot( random2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0) ),
                         dot( random2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0) ), u.x), u.y);
      }

      float fbm(vec2 st) {
        float value = 0.0;
        float amplitude = 0.5;
        mat2 rot = mat2(0.87, 0.47, -0.47, 0.87);
        for (int i = 0; i < 3; ++i) {
          value += amplitude * noise(st);
          st = rot * st * 2.0;
          amplitude *= 0.5;
        }
        return value;
      }

      void main() {
        vec2 st = vUv;
        float aspect = uResolution.x / uResolution.y;
        st.x *= aspect;

        vec2 mouse = uMouse;
        mouse.x *= aspect;
        vec2 delta = st - mouse;
        float dist = length(delta);
        float swirl = exp(-dist * 3.0);
        st += normalize(delta + vec2(0.0001)) * swirl * 0.1 * sin(uTime * 2.0);

        vec2 q = vec2(fbm(st + 0.02 * uTime), fbm(st + vec2(1.0)));
        vec2 r = vec2(fbm(st + q + vec2(1.7, 9.2) + 0.15 * uTime), fbm(st + q + vec2(8.3, 2.8) + 0.1 * uTime));

        float f = fbm(st + r) * 0.5 + 0.5;
        vec3 color = mix(vec3(0.02, 0.04, 0.1), uColorA, clamp(f * 1.4, 0.0, 1.0));
        color = mix(color, uColorB, clamp(length(q), 0.0, 1.0));

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(W, H) },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) },
      uColorA: { value: new THREE.Color('#6366f1') },
      uColorB: { value: new THREE.Color('#a855f7') }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
      fragmentShader,
      uniforms
    });

    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

    let mx = 0.5, my = 0.5;
    window.addEventListener('mousemove', (e) => {
      mx = e.clientX / window.innerWidth;
      my = 1.0 - (e.clientY / window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      uniforms.uTime.value = clock.getElapsedTime();
      uniforms.uMouse.value.lerp(new THREE.Vector2(mx, my), 0.05);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const W2 = container.clientWidth, H2 = container.clientHeight;
      renderer.setSize(W2, H2);
      uniforms.uResolution.value.set(W2, H2);
    });

    const themeBtns = document.querySelectorAll('.theme-btn');
    themeBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        themeBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        const mode = btn.dataset.theme;
        if (mode === 'violet') {
          uniforms.uColorA.value.set('#6366f1');
          uniforms.uColorB.value.set('#a855f7');
        } else if (mode === 'cyan') {
          uniforms.uColorA.value.set('#06b6d4');
          uniforms.uColorB.value.set('#3b82f6');
        } else if (mode === 'emerald') {
          uniforms.uColorA.value.set('#10b981');
          uniforms.uColorB.value.set('#eab308');
        }
      });
    });
  </script>
</body>
</html>
