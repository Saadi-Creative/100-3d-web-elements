<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Gravity Physics Multi-Select Tags</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        body {
            background: radial-gradient(circle at center, #101426 0%, #05070d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 32px 20px;
            overflow: hidden;
            user-select: none;
            perspective: 1000px;
        }

        .header-hud {
            text-align: center;
            z-index: 20;
        }

        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-family: var(--font-mono, monospace);
            color: #38bdf8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .hud-title {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }

        /* Physics Sandbox Stage */
        .physics-stage {
            position: relative;
            width: 100%;
            max-width: 680px;
            height: 380px;
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            overflow: hidden;
            transform-style: preserve-3d;
        }

        #beams-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Physics Tag Pill */
        .physics-tag {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            z-index: 5;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.1s linear;
            will-change: transform;
        }

        .physics-tag:hover {
            border-color: var(--tag-color, #38bdf8);
            box-shadow: 0 0 20px var(--tag-glow, rgba(56, 189, 248, 0.4));
        }

        .physics-tag.selected {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.9), rgba(15, 23, 42, 0.95));
            border-color: var(--tag-color, #38bdf8);
            color: #ffffff;
            box-shadow: 
                0 0 25px var(--tag-glow, rgba(56, 189, 248, 0.6)),
                inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .tag-icon {
            font-size: 15px;
        }

        /* Selection Tray Footer */
        .selection-tray {
            width: 100%;
            max-width: 680px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(18, 24, 38, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            z-index: 20;
        }

        .tray-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tray-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #f1f5f9;
            font-size: 11px;
            font-family: var(--font-mono, monospace);
        }

        .tray-chip .remove-btn {
            cursor: pointer;
            color: #94a3b8;
            font-weight: 700;
        }

        .tray-chip .remove-btn:hover {
            color: #ef4444;
        }

        .tray-count {
            font-family: var(--font-mono, monospace);
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="header-hud">
        <div class="hud-badge">
            <span>✨</span>
            <span>Zero-G Kinetic Tag Mesh</span>
        </div>
        <div class="hud-title">Click tags to bind neural entanglement threads</div>
    </div>

    <div class="physics-stage" id="stage">
        <canvas id="beams-canvas"></canvas>
    </div>

    <div class="selection-tray">
        <div class="tray-chips" id="tray-chips">
            <span style="font-size: 12px; color: #64748b; font-family: var(--font-mono, monospace);">Select tags from orbit above...</span>
        </div>
        <div class="tray-count" id="tray-count">0 SELECTED</div>
    </div>

    <script>
        const TAG_DATA = [
            { id: 'react', label: 'React 19', icon: '⚛️', color: '#38bdf8', glow: 'rgba(56,189,248,0.5)' },
            { id: 'three', label: 'Three.js WebGL', icon: '🔺', color: '#06b6d4', glow: 'rgba(6,182,212,0.5)' },
            { id: 'wasm', label: 'Rust WASM', icon: '🦀', color: '#f97316', glow: 'rgba(249,115,22,0.5)' },
            { id: 'tailwind', label: 'OKLCH CSS', icon: '🎨', color: '#a855f7', glow: 'rgba(168,85,247,0.5)' },
            { id: 'motion', label: 'Kinetic Physics', icon: '⚡', color: '#fbbf24', glow: 'rgba(251,191,36,0.5)' },
            { id: 'typescript', label: 'TypeScript 5', icon: '📘', color: '#60a5fa', glow: 'rgba(96,165,250,0.5)' },
            { id: 'graphql', label: 'GraphQL Mesh', icon: '◈', color: '#ec4899', glow: 'rgba(236,72,153,0.5)' },
            { id: 'redis', label: 'Redis L1 Cache', icon: '⚡', color: '#ef4444', glow: 'rgba(239,68,68,0.5)' },
            { id: 'security', label: 'Zero-Trust IAM', icon: '🛡️', color: '#10b981', glow: 'rgba(16,185,129,0.5)' },
        ];

        const stage = document.getElementById('stage');
        const canvas = document.getElementById('beams-canvas');
        const ctx = canvas.getContext('2d');
        const trayChips = document.getElementById('tray-chips');
        const trayCount = document.getElementById('tray-count');

        let stageWidth = stage.clientWidth;
        let stageHeight = stage.clientHeight;

        function resizeCanvas() {
            stageWidth = stage.clientWidth;
            stageHeight = stage.clientHeight;
            canvas.width = stageWidth;
            canvas.height = stageHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const selectedSet = new Set(['react', 'three']);
        const bodies = [];

        // Spawn Tag Physics Bodies
        TAG_DATA.forEach((tag, idx) => {
            const el = document.createElement('div');
            el.className = `physics-tag ${selectedSet.has(tag.id) ? 'selected' : ''}`;
            el.style.setProperty('--tag-color', tag.color);
            el.style.setProperty('--tag-glow', tag.glow);
            el.innerHTML = `<span class="tag-icon">${tag.icon}</span><span>${tag.label}</span>`;
            stage.appendChild(el);

            const body = {
                id: tag.id,
                tag: tag,
                el: el,
                x: 60 + Math.random() * (stageWidth - 180),
                y: 40 + Math.random() * (stageHeight - 120),
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                w: 120,
                h: 38,
            };

            el.addEventListener('click', () => {
                if (selectedSet.has(tag.id)) {
                    selectedSet.delete(tag.id);
                    el.classList.remove('selected');
                } else {
                    selectedSet.add(tag.id);
                    el.classList.add('selected');
                }
                updateTray();
            });

            bodies.push(body);
        });

        function updateTray() {
            trayChips.innerHTML = '';
            if (selectedSet.size === 0) {
                trayChips.innerHTML = `<span style="font-size: 12px; color: #64748b; font-family: var(--font-mono, monospace);">Select tags from orbit above...</span>`;
                trayCount.textContent = '0 SELECTED';
                return;
            }

            selectedSet.forEach(id => {
                const item = TAG_DATA.find(t => t.id === id);
                if (!item) return;
                const chip = document.createElement('div');
                chip.className = 'tray-chip';
                chip.innerHTML = `<span>${item.icon} ${item.label}</span><span class="remove-btn">×</span>`;
                chip.querySelector('.remove-btn').addEventListener('click', () => {
                    selectedSet.delete(id);
                    const b = bodies.find(b => b.id === id);
                    if (b) b.el.classList.remove('selected');
                    updateTray();
                });
                trayChips.appendChild(chip);
            });

            trayCount.textContent = `${selectedSet.size} SELECTED`;
        }

        updateTray();

        // Mouse gravity influence
        let mouseX = -1000;
        let mouseY = -1000;
        stage.addEventListener('mousemove', (e) => {
            const rect = stage.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        stage.addEventListener('mouseleave', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        // Physics Simulation Loop
        function stepPhysics() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw laser connection beams between selected tags
            const selectedBodies = bodies.filter(b => selectedSet.has(b.id));
            if (selectedBodies.length > 1) {
                for (let i = 0; i < selectedBodies.length; i++) {
                    for (let j = i + 1; j < selectedBodies.length; j++) {
                        const b1 = selectedBodies[i];
                        const b2 = selectedBodies[j];
                        ctx.beginPath();
                        ctx.moveTo(b1.x + b1.w / 2, b1.y + b1.h / 2);
                        ctx.lineTo(b2.x + b2.w / 2, b2.y + b2.h / 2);
                        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([4, 4]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
            }

            bodies.forEach(b => {
                // Bounds measurement
                b.w = b.el.offsetWidth || 120;
                b.h = b.el.offsetHeight || 38;

                // Mouse attraction/repulsion
                const dx = mouseX - (b.x + b.w / 2);
                const dy = mouseY - (b.y + b.h / 2);
                const dist = Math.hypot(dx, dy);

                if (dist < 140 && dist > 10) {
                    b.vx -= (dx / dist) * 0.15;
                    b.vy -= (dy / dist) * 0.15;
                }

                // Drag friction
                b.vx *= 0.99;
                b.vy *= 0.99;

                // Slight ambient drift
                b.vx += (Math.random() - 0.5) * 0.05;
                b.vy += (Math.random() - 0.5) * 0.05;

                b.x += b.vx;
                b.y += b.vy;

                // Wall bounce
                if (b.x < 10) { b.x = 10; b.vx = Math.abs(b.vx) * 0.8; }
                if (b.x + b.w > stageWidth - 10) { b.x = stageWidth - b.w - 10; b.vx = -Math.abs(b.vx) * 0.8; }
                if (b.y < 10) { b.y = 10; b.vy = Math.abs(b.vy) * 0.8; }
                if (b.y + b.h > stageHeight - 10) { b.y = stageHeight - b.h - 10; b.vy = -Math.abs(b.vy) * 0.8; }

                b.el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
            });

            requestAnimationFrame(stepPhysics);
        }

        stepPhysics();
    </script>
</body>
</html>
