<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iridescent Fluid Mesh Gradient</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #000; min-height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; }
        .will-change-transform { will-change: transform; }
        
        .noise-overlay {
            position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0.4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        @keyframes orb1 {
            0%, 100% { transform: translate(0%, 0%) scale(1); }
            50% { transform: translate(20%, 15%) scale(1.4); }
            100% { transform: translate(-5%, 5%) scale(0.9); }
        }
        @keyframes orb2 {
            0%, 100% { transform: translate(0%, 0%) scale(0.8); }
            50% { transform: translate(-30%, 25%) scale(1.2); }
            100% { transform: translate(10%, -10%) scale(1); }
        }
        @keyframes orb3 {
            0%, 100% { transform: translate(0%, 0%) scale(1.2); }
            50% { transform: translate(30%, -20%) scale(0.8); }
            100% { transform: translate(-20%, 15%) scale(1.3); }
        }
        @keyframes orb4 {
            0%, 100% { transform: translate(0%, 0%) scale(0.9); }
            50% { transform: translate(-25%, -30%) scale(1.5); }
            100% { transform: translate(15%, -5%) scale(1.1); }
        }

        .orb-1 { animation: orb1 18s ease-in-out infinite alternate; }
        .orb-2 { animation: orb2 22s ease-in-out infinite alternate; animation-delay: 2s; }
        .orb-3 { animation: orb3 25s ease-in-out infinite alternate; animation-delay: 4s; }
        .orb-4 { animation: orb4 20s ease-in-out infinite alternate; animation-delay: 1s; }

        /* Entrance Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleFade {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .anim-title { animation: slideUpFade 1s ease-out forwards; opacity: 0; }
        .anim-text { animation: slideUpFade 1s ease-out forwards; animation-delay: 0.2s; opacity: 0; }
        .anim-btn { animation: scaleFade 0.8s ease-out forwards; animation-delay: 0.4s; opacity: 0; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root">
        <div class="w-full h-screen relative bg-slate-950 overflow-hidden">
            
            <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
                <!-- Deep Purple Base Orb -->
                <div class="orb-1 absolute rounded-full mix-blend-screen blur-[120px] will-change-transform bg-purple-600/70" style="width: 40vw; height: 40vw; left: -10%; top: -10%;"></div>
                
                <!-- Midnight Blue Orb -->
                <div class="orb-2 absolute rounded-full mix-blend-screen blur-[120px] will-change-transform bg-indigo-600/80" style="width: 40vw; height: 40vw; left: 60%; top: -20%;"></div>

                <!-- Liquid Gold / Amber Orb -->
                <div class="orb-3 absolute rounded-full mix-blend-screen blur-[120px] will-change-transform bg-amber-500/50" style="width: 40vw; height: 40vw; left: 20%; top: 60%;"></div>

                <!-- Rose / Magenta Orb -->
                <div class="orb-4 absolute rounded-full mix-blend-screen blur-[120px] will-change-transform bg-rose-600/60" style="width: 40vw; height: 40vw; left: 70%; top: 70%;"></div>
            </div>

            <div class="noise-overlay"></div>

            <div class="relative z-20 w-full h-full flex flex-col items-center justify-center text-center px-4">
                <h1 class="anim-title text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white to-white/50 tracking-tighter mb-6">
                    Liquid Silk.
                </h1>
                <p class="anim-text text-slate-300 font-medium text-lg max-w-xl mx-auto leading-relaxed">
                    A pure CSS powered ambient background. Heavy SVG/CSS blurs mix absolute positioned layers mathematically, generating an infinitely shifting, hardware-accelerated iridescent mesh.
                </p>
                
                <button class="anim-btn mt-10 px-8 py-4 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 text-white font-bold rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.2)] transition-colors">
                    Enter the Atmosphere
                </button>
            </div>

        </div>
    </div>
</body>
</html>
