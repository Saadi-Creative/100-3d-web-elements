<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30 - Liquid Topological Fluid Sphere</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .hero-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .hero-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--accent-base);
      margin-bottom: var(--space-2);
    }

    .hero-title {
      font-size: var(--text-3xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
    }

    .hero-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-2);
    }

    .blob-toolbar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .color-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .color-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div id="canvas-container"></div>

    <div class="hero-center">
      <span class="hero-tag">TOPOLOGICAL FLUID SPHERE</span>
      <h1 class="hero-title">Morphing Blob</h1>
      <p class="hero-sub">GLSL vertex distortion with mouse tracking</p>
    </div>

    <div class="blob-toolbar" role="toolbar" aria-label="Blob material color presets">
      <button class="color-btn is-active" data-color="#6366f1">Obsidian Violet</button>
      <button class="color-btn" data-color="#10b981">Emerald Glass</button>
      <button class="color-btn" data-color="#38bdf8">Cyber Blue</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
    camera.position.z = 7;

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dl1 = new THREE.DirectionalLight(0xc084fc, 2);
    dl1.position.set(10, 10, 5);
    scene.add(dl1);

    const dl2 = new THREE.DirectionalLight(0x38bdf8, 2);
    dl2.position.set(-10, -10, -5);
    scene.add(dl2);

    const geo = new THREE.SphereGeometry(1.8, 64, 64);
    const posAttribute = geo.attributes.position;
    const initialPositions = posAttribute.array.slice();

    const mat = new THREE.MeshPhysicalMaterial({
      color: 0x6366f1,
      roughness: 0.1,
      metalness: 0.8,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    });

    const blobMesh = new THREE.Mesh(geo, mat);
    scene.add(blobMesh);

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Vertex displacement loop
      const pos = posAttribute.array;
      for (let i = 0; i < pos.length; i += 3) {
        const vx = initialPositions[i];
        const vy = initialPositions[i + 1];
        const vz = initialPositions[i + 2];

        const noise = Math.sin(vx * 2 + t * 2) * Math.cos(vy * 2 + t * 2) * 0.25;
        pos[i]     = vx + (vx / 1.8) * noise;
        pos[i + 1] = vy + (vy / 1.8) * noise;
        pos[i + 2] = vz + (vz / 1.8) * noise;
      }
      posAttribute.needsUpdate = true;
      geo.computeVertexNormals();

      blobMesh.rotation.y += (mouseX * 0.5 - blobMesh.rotation.y) * 0.05;
      blobMesh.rotation.x += (-mouseY * 0.5 - blobMesh.rotation.x) * 0.05;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const W2 = container.clientWidth, H2 = container.clientHeight;
      camera.aspect = W2 / H2;
      camera.updateProjectionMatrix();
      renderer.setSize(W2, H2);
    });

    const colorBtns = document.querySelectorAll('.color-btn');
    colorBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        colorBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        mat.color.set(btn.dataset.color);
      });
    });
  </script>
</body>
</html>
