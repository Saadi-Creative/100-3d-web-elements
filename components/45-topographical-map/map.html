<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topographical Drop-Zone LiDAR Map</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020610;
            min-height: 100vh;
            overflow: hidden;
            color: white;
            font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, sans-serif);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hud-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-family: var(--font-mono, monospace);
            color: #60a5fa;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .hud-title {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }

        .controls-bar {
            position: absolute;
            bottom: 24px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .btn-tac {
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
            padding: 10px 18px;
            border-radius: 8px;
            font-family: var(--font-mono, monospace);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-tac:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .telemetry-box {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 14px 18px;
            backdrop-filter: blur(12px);
            font-family: var(--font-mono, monospace);
            font-size: 11px;
            color: #94a3b8;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tac-val {
            color: #60a5fa;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="hud-overlay">
        <div class="hud-badge">
            <span>📡</span>
            <span>Orbital LiDAR Reconnaissance</span>
        </div>
        <div class="hud-title">Topographical Relief &amp; Drop-Zone Beacon</div>
    </div>

    <div class="controls-bar">
        <button class="btn-tac" id="drop-btn">
            <span>📍</span> Drop Recon Beacon
        </button>
        <button class="btn-tac" id="wire-btn">
            <span>⬡</span> Toggle Wireframe
        </button>
        <button class="btn-tac" id="scan-btn">
            <span>✨</span> Pulse LiDAR Beam
        </button>
    </div>

    <div class="telemetry-box">
        <div>COORDINATES: <span class="tac-val">34°02′N 118°14′W</span></div>
        <div>ELEVATION PEAK: <span class="tac-val" id="elev-val">2,480m</span></div>
        <div>PROBE STATUS: <span class="tac-val" id="probe-status">LOCKED &amp; SYNCED</span></div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 6, 9);
        camera.lookAt(0, 0, 0);

        // Procedural Topographical Terrain Plane
        const SEGMENTS = 90;
        const terrainGeo = new THREE.PlaneGeometry(10, 10, SEGMENTS, SEGMENTS);
        terrainGeo.rotateX(-Math.PI / 2);

        // Elevation displacement with Perlin-style sinusoidal compounding
        const pos = terrainGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const z = pos.getZ(i);
            const y = Math.sin(x * 0.8) * Math.cos(z * 0.8) * 0.9 +
                      Math.sin(x * 1.8 + z * 1.2) * 0.35 +
                      Math.sin(x * 3.5) * 0.12;
            pos.setY(i, y);
        }
        terrainGeo.computeVertexNormals();

        // Custom Shader Material for Topographical Contour Lines
        const terrainMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uPulse: { value: 0 },
                uWire: { value: 0.0 }
            },
            vertexShader: `
                varying vec3 vPos;
                varying vec3 vNormal;
                void main() {
                    vPos = position;
                    vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform float uPulse;
                uniform float uWire;
                varying vec3 vPos;
                varying vec3 vNormal;

                void main() {
                    // Elevation color ramp (deep blue to bright cyan/white peaks)
                    float h = (vPos.y + 1.2) / 2.4;
                    vec3 colLow = vec3(0.02, 0.12, 0.28);
                    vec3 colMid = vec3(0.12, 0.45, 0.85);
                    vec3 colHigh = vec3(0.35, 0.85, 1.0);

                    vec3 baseCol = mix(colLow, colMid, smoothstep(0.0, 0.5, h));
                    baseCol = mix(baseCol, colHigh, smoothstep(0.5, 1.0, h));

                    // Topographical Contour Lines (every 0.2 units)
                    float contour = mod(vPos.y * 10.0, 1.0);
                    float line = smoothstep(0.0, 0.08, contour) * (1.0 - smoothstep(0.12, 0.2, contour));
                    baseCol += vec3(0.3, 0.8, 1.0) * line * 0.7;

                    // LiDAR Pulse Wave
                    float dist = length(vPos.xz);
                    float wave = sin(dist * 2.0 - uTime * 3.0) * 0.5 + 0.5;
                    baseCol += vec3(0.2, 0.7, 1.0) * wave * 0.15;

                    if (uPulse > 0.0) {
                        float pulseRing = smoothstep(0.0, 0.5, 1.0 - abs(dist - uPulse * 5.0));
                        baseCol += vec3(1.0, 0.3, 0.6) * pulseRing * 1.5;
                    }

                    gl_FragColor = vec4(baseCol, 0.95);
                }
            `,
            transparent: true
        });

        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        scene.add(terrain);

        // Tactical Beacon Marker Probe
        const beaconGroup = new THREE.Group();
        const beaconPinGeo = new THREE.ConeGeometry(0.15, 0.6, 16);
        beaconPinGeo.rotateX(Math.PI);
        const beaconPinMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
        const beaconPin = new THREE.Mesh(beaconPinGeo, beaconPinMat);
        beaconPin.position.y = 0.3;
        beaconGroup.add(beaconPin);

        // Beacon Light Beam
        const beamGeo = new THREE.CylinderGeometry(0.02, 0.3, 4, 16, 1, true);
        const beamMat = new THREE.MeshBasicMaterial({
            color: 0xf43f5e,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide
        });
        const beam = new THREE.Mesh(beamGeo, beamMat);
        beam.position.y = 2.3;
        beaconGroup.add(beam);

        beaconGroup.position.set(0.8, 1.1, -0.6);
        scene.add(beaconGroup);

        // Interaction Buttons
        let isWire = false;
        document.getElementById('wire-btn').addEventListener('click', () => {
            isWire = !isWire;
            terrainMat.wireframe = isWire;
        });

        let pulseProgress = 0;
        document.getElementById('scan-btn').addEventListener('click', () => {
            pulseProgress = 0.01;
        });

        const dropBtn = document.getElementById('drop-btn');
        const elevVal = document.getElementById('elev-val');
        dropBtn.addEventListener('click', () => {
            const rx = (Math.random() - 0.5) * 6;
            const rz = (Math.random() - 0.5) * 6;
            const ry = Math.sin(rx * 0.8) * Math.cos(rz * 0.8) * 0.9 +
                       Math.sin(rx * 1.8 + rz * 1.2) * 0.35 +
                       Math.sin(rx * 3.5) * 0.12;
            beaconGroup.position.set(rx, ry + 0.3, rz);
            elevVal.textContent = `${Math.floor(1800 + (ry + 1.2) * 800)}m`;
        });

        // Mouse Orbit
        let mouseX = 0;
        let mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            terrainMat.uniforms.uTime.value = time;

            if (pulseProgress > 0) {
                pulseProgress += delta * 0.8;
                if (pulseProgress > 1.2) pulseProgress = 0;
                terrainMat.uniforms.uPulse.value = pulseProgress;
            }

            // Camera subtle orbit
            camera.position.x = 8 * Math.sin(time * 0.15 + mouseX * 0.6);
            camera.position.z = 8 * Math.cos(time * 0.15 + mouseX * 0.6);
            camera.position.y = 5.5 - mouseY * 2.0;
            camera.lookAt(0, 0, 0);

            // Animate Beacon Beam Pulse
            beam.material.opacity = 0.3 + Math.sin(time * 6.0) * 0.2;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
