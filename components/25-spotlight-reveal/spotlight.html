<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>25 - Volumetric Optical Searchlight Cone</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #020617;
      font-family: var(--font-sans);
      cursor: none;
    }

    .spotlight-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Masked Typography Layer */
    .text-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      text-align: center;
      -webkit-mask-image: radial-gradient(
        circle var(--spot-size, 160px) at var(--spot-x, 50%) var(--spot-y, 50%),
        black 0%,
        black 60%,
        transparent 100%
      );
      mask-image: radial-gradient(
        circle var(--spot-size, 160px) at var(--spot-x, 50%) var(--spot-y, 50%),
        black 0%,
        black 60%,
        transparent 100%
      );
    }

    .spot-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--accent-base);
      margin-bottom: var(--space-3);
    }

    .spot-title {
      font-size: var(--text-4xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
    }

    .spot-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-3);
      max-width: 400px;
    }

    /* Volumetric Beam Overlay */
    .beam-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle var(--spot-size, 160px) at var(--spot-x, 50%) var(--spot-y, 50%),
        rgba(99, 102, 241, 0.12) 0%,
        transparent 70%
      );
    }

    .cursor-dot {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 0 10px #ffffff;
    }

    /* Toolbar */
    .spot-toolbar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .size-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .size-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="cursor-dot" id="cursorDot"></div>

    <div class="spotlight-stage" id="stage">
      <div class="text-layer" id="textLayer">
        <span class="spot-tag">VOLUMETRIC OPTICAL CONE</span>
        <h1 class="spot-title">Revealed in Darkness</h1>
        <p class="spot-sub">High-precision CSS radial mask searchlight beam</p>
      </div>

      <div class="beam-layer" id="beamLayer"></div>
    </div>

    <div class="spot-toolbar" role="toolbar" aria-label="Spotlight aperture controls">
      <button class="size-btn is-active" data-size="160">Focused Cone</button>
      <button class="size-btn" data-size="260">Wide Beam</button>
      <button class="size-btn" data-size="400">Ambient Flood</button>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const textLayer = document.getElementById('textLayer');
    const beamLayer = document.getElementById('beamLayer');
    const cursorDot = document.getElementById('cursorDot');

    let spotX = 50, spotY = 50, targetX = 50, targetY = 50;
    let spotSize = 160, targetSize = 160;

    function lerp(a, b, t) { return a + (b - a) * t; }

    stage.addEventListener('mousemove', (e) => {
      const rect = stage.getBoundingClientRect();
      targetX = ((e.clientX - rect.left) / rect.width) * 100;
      targetY = ((e.clientY - rect.top) / rect.height) * 100;

      cursorDot.style.left = `${e.clientX}px`;
      cursorDot.style.top = `${e.clientY}px`;
    });

    function animate() {
      requestAnimationFrame(animate);
      spotX = lerp(spotX, targetX, 0.12);
      spotY = lerp(spotY, targetY, 0.12);
      spotSize = lerp(spotSize, targetSize, 0.12);

      const pos = `${spotX.toFixed(2)}% ${spotY.toFixed(2)}%`;
      const sizeStr = `${spotSize.toFixed(1)}px`;

      const maskStr = `radial-gradient(circle ${sizeStr} at ${pos}, black 0%, black 60%, transparent 100%)`;
      textLayer.style.webkitMaskImage = maskStr;
      textLayer.style.maskImage = maskStr;

      beamLayer.style.background = `radial-gradient(circle ${sizeStr} at ${pos}, rgba(99, 102, 241, 0.15) 0%, transparent 70%)`;
    }
    animate();

    const sizeBtns = document.querySelectorAll('.size-btn');
    sizeBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        sizeBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        targetSize = parseFloat(btn.dataset.size);
      });
    });
  </script>
</body>
</html>
