<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>19 - Spatial Crystalline Snow Canopy</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #0c1427 0%, #030712 100%);
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Spatial Overlay Header */
    .hero-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .hero-title {
      font-size: var(--text-3xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .hero-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      margin-top: var(--space-2);
    }

    /* Density Controls Toolbar */
    .snow-toolbar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .density-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .density-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="hero-center">
      <h1 class="hero-title">Winter Mute</h1>
      <p class="hero-sub">Atmospheric Crystalline Particles</p>
    </div>

    <div id="canvas-container"></div>

    <div class="snow-toolbar" role="toolbar" aria-label="Snow intensity settings">
      <button class="density-btn is-active" data-speed="1.0" data-wind="0.5">Gentle Flurry</button>
      <button class="density-btn" data-speed="2.2" data-wind="1.5">Alpine Drift</button>
      <button class="density-btn" data-speed="4.0" data-wind="3.0">Blizzard Storm</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
    camera.position.z = 15;

    // 2,500 Snow Flakes Instance
    const COUNT = 2500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(COUNT * 3);
    const velocities = new Float32Array(COUNT * 3);

    for (let i = 0; i < COUNT; i++) {
      positions[i * 3]     = (Math.random() - 0.5) * 40;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 40;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 40;

      velocities[i * 3]     = (Math.random() - 0.5) * 0.2;
      velocities[i * 3 + 1] = 0.5 + Math.random() * 1.2;
      velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.12,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    const snowPoints = new THREE.Points(geometry, material);
    scene.add(snowPoints);

    let speedFactor = 1.0;
    let windFactor = 0.5;
    const clock = new THREE.Clock();

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) - 0.5;
      mouseY = (e.clientY / window.innerHeight) - 0.5;
    });

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      const posArr = geometry.attributes.position.array;
      for (let i = 0; i < COUNT; i++) {
        const i3 = i * 3;
        posArr[i3 + 1] -= velocities[i3 + 1] * dt * 4 * speedFactor;
        posArr[i3]     += Math.sin(clock.getElapsedTime() + i) * dt * windFactor;

        if (posArr[i3 + 1] < -20) {
          posArr[i3 + 1] = 20;
          posArr[i3] = (Math.random() - 0.5) * 40;
        }
      }
      geometry.attributes.position.needsUpdate = true;

      // Parallax camera sway
      camera.position.x += (mouseX * 4 - camera.position.x) * 0.05;
      camera.position.y += (-mouseY * 4 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const W2 = container.clientWidth, H2 = container.clientHeight;
      camera.aspect = W2 / H2;
      camera.updateProjectionMatrix();
      renderer.setSize(W2, H2);
    });

    const densityBtns = document.querySelectorAll('.density-btn');
    densityBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        densityBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        speedFactor = parseFloat(btn.dataset.speed);
        windFactor = parseFloat(btn.dataset.wind);
      });
    });
  </script>
</body>
</html>
