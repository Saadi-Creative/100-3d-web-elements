<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Embossed Bas-Relief Multi-Select Tags</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #080c18 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            perspective: 1200px;
            gap: 32px;
            padding: 24px;
        }

        .tag-matrix-hud {
            text-align: center;
        }

        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-family: var(--font-mono, monospace);
            color: #38bdf8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .hud-title {
            font-size: 22px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }

        /* 3D Embossed Board Container */
        .tag-board {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            max-width: 580px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
        }

        /* 3D Tactile Tag Pill */
        .embossed-tag {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 14px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 
                0 8px 16px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: translate3d(0, 0, 10px);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.2s ease,
                        border-color 0.2s ease,
                        color 0.2s ease;
            transform-style: preserve-3d;
        }

        .embossed-tag:hover {
            color: #f1f5f9;
            border-color: rgba(56, 189, 248, 0.4);
            transform: translate3d(0, -2px, 16px);
            box-shadow: 
                0 12px 24px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* Active Pressed Embossed State */
        .embossed-tag.selected {
            background: linear-gradient(145deg, #0284c7, #0369a1);
            border-color: #38bdf8;
            color: #ffffff;
            transform: translate3d(0, 2px, 2px);
            box-shadow: 
                0 2px 6px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(56, 189, 248, 0.5),
                inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .tag-check {
            font-size: 12px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .embossed-tag.selected .tag-check {
            opacity: 1;
            transform: scale(1);
        }

        /* Status Footer */
        .tag-status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono, monospace);
            font-size: 11px;
            color: #64748b;
        }

        .active-pill {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 3px 10px;
            border-radius: 9999px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="tag-matrix-hud">
        <div class="hud-badge">
            <span>🏷️</span>
            <span>Bas-Relief Ceramic Tactile Tags</span>
        </div>
        <div class="hud-title">Select tech stack parameters to filter telemetry</div>
    </div>

    <div class="tag-board" id="board">
        <!-- Tags rendered dynamically -->
    </div>

    <div class="tag-status-bar">
        <span>ACTIVE FILTERS:</span>
        <span class="active-pill" id="counter-pill">2 SELECTED</span>
    </div>

    <script>
        const TAGS = [
            { id: 'react', label: 'React 19', icon: '⚛️' },
            { id: 'webgl', label: 'Three.js WebGL', icon: '🔺' },
            { id: 'wasm', label: 'Rust WASM', icon: '🦀' },
            { id: 'css3d', label: 'CSS 3D Engine', icon: '💎' },
            { id: 'spatial', label: 'Spatial Shaders', icon: '✨' },
            { id: 'physics', label: 'Verlet Springs', icon: '⚡' },
            { id: 'redis', label: 'Redis L1 Cache', icon: '🚀' },
            { id: 'quantum', label: 'Zero-Trust IAM', icon: '🛡️' },
            { id: 'grpc', label: 'gRPC Event Bus', icon: '◈' },
        ];

        const board = document.getElementById('board');
        const counterPill = document.getElementById('counter-pill');
        const selected = new Set(['react', 'webgl']);

        function renderTags() {
            board.innerHTML = '';
            TAGS.forEach(tag => {
                const isSelected = selected.has(tag.id);
                const btn = document.createElement('div');
                btn.className = `embossed-tag ${isSelected ? 'selected' : ''}`;
                btn.innerHTML = `
                    <span>${tag.icon}</span>
                    <span>${tag.label}</span>
                    <span class="tag-check">✓</span>
                `;

                btn.addEventListener('click', () => {
                    if (selected.has(tag.id)) {
                        selected.delete(tag.id);
                    } else {
                        selected.add(tag.id);
                    }
                    renderTags();
                    counterPill.textContent = `${selected.size} SELECTED`;
                });

                board.appendChild(btn);
            });
        }

        renderTags();

        // 3D Parallax Tilt
        document.addEventListener('mousemove', (e) => {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const tiltX = -(e.clientY - cy) * 0.02;
            const tiltY = (e.clientX - cx) * 0.02;
            board.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
        });
    </script>
</body>
</html>
