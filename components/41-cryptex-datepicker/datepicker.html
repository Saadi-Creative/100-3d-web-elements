<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural 3D Cryptex Date Picker</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        body {
            background: radial-gradient(circle at center, #141724 0%, #06080e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            perspective: 1200px;
        }

        .cryptex-hud {
            position: absolute;
            top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono, monospace);
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .hud-badge {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            padding: 4px 10px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cryptex-chassis {
            position: relative;
            width: 420px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 50%, #090d16 100%);
            border: 2px solid rgba(251, 191, 36, 0.3);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 35px rgba(251, 191, 36, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            transform-style: preserve-3d;
        }

        /* Cryptex Side Caps */
        .cryptex-cap {
            position: absolute;
            top: 50%;
            width: 18px;
            height: 140px;
            margin-top: -70px;
            background: linear-gradient(90deg, #d97706, #78350f);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 0 15px rgba(217, 119, 6, 0.3);
            border-radius: 4px;
        }

        .cryptex-cap.left { left: -14px; }
        .cryptex-cap.right { right: -14px; }

        /* Cryptex Optical Lens Guide */
        .cryptex-lens {
            position: absolute;
            top: 50%;
            left: 20px;
            right: 20px;
            height: 48px;
            margin-top: -24px;
            border-radius: 12px;
            border: 2px solid #fbbf24;
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.08), rgba(251, 191, 36, 0.15), rgba(251, 191, 36, 0.08));
            box-shadow: 
                0 0 25px rgba(251, 191, 36, 0.3),
                inset 0 0 15px rgba(251, 191, 36, 0.2);
            pointer-events: none;
            z-index: 20;
        }

        /* Drum Ring Container */
        .rings-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            height: 180px;
            position: relative;
            transform-style: preserve-3d;
        }

        .drum-column {
            position: relative;
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 800px;
            cursor: ns-resize;
        }

        .drum-label {
            position: absolute;
            top: -22px;
            font-size: 10px;
            font-family: var(--font-mono, monospace);
            color: #d97706;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .drum-cylinder {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .drum-notch {
            position: absolute;
            left: 6px;
            right: 6px;
            height: 44px;
            top: calc(50% - 22px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono, monospace);
            font-size: 16px;
            font-weight: 700;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(251, 191, 36, 0.15);
            border-radius: 8px;
            backface-visibility: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }

        .drum-notch.active {
            color: #fbbf24;
            font-size: 19px;
            border-color: #fbbf24;
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.3), rgba(15, 23, 42, 0.95));
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
        }

        /* Result Decrypted Date Footer */
        .cryptex-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
            font-family: var(--font-mono, monospace);
        }

        .decrypted-value {
            font-size: 14px;
            color: #fbbf24;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
            transition: all 0.2s ease;
        }

        .btn-confirm:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
        }
    </style>
</head>
<body>

    <div class="cryptex-hud">
        <div class="hud-badge">
            <span>🔒</span>
            <span>Cryptographic Ratchet Mechanism</span>
        </div>
    </div>

    <div class="cryptex-chassis">
        <div class="cryptex-cap left"></div>
        <div class="cryptex-cap right"></div>
        <div class="cryptex-lens"></div>

        <div class="rings-row">
            <!-- Day Ring -->
            <div class="drum-column" id="col-day">
                <span class="drum-label">Day</span>
                <div class="drum-cylinder" id="drum-day"></div>
            </div>

            <!-- Month Ring -->
            <div class="drum-column" id="col-month">
                <span class="drum-label">Month</span>
                <div class="drum-cylinder" id="drum-month"></div>
            </div>

            <!-- Year Ring -->
            <div class="drum-column" id="col-year">
                <span class="drum-label">Year</span>
                <div class="drum-cylinder" id="drum-year"></div>
            </div>
        </div>

        <div class="cryptex-footer">
            <div class="decrypted-value">
                <span>🔐 KEY:</span>
                <span id="date-readout">24 SEP 2026</span>
            </div>
            <button class="btn-confirm" id="confirm-btn">UNLOCK VAULT</button>
        </div>
    </div>

    <script>
        const DAYS = Array.from({ length: 31 }, (_, i) => String(i + 1).padStart(2, '0'));
        const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        const YEARS = ['2024', '2025', '2026', '2027', '2028', '2029', '2030', '2031'];

        let selectedDay = 23; // 24
        let selectedMonth = 8; // SEP
        let selectedYear = 2; // 2026

        const RADIUS = 80;

        function buildCylinder(containerId, items, activeIdx, onSelect) {
            const container = document.getElementById(containerId);
            const count = items.length;
            const angleStep = 360 / count;

            items.forEach((val, idx) => {
                const angle = idx * angleStep;
                const notch = document.createElement('div');
                notch.className = `drum-notch ${idx === activeIdx ? 'active' : ''}`;
                notch.style.transform = `rotateX(${angle}deg) translateZ(${RADIUS}px)`;
                notch.textContent = val;
                notch.addEventListener('click', () => {
                    onSelect(idx);
                });
                container.appendChild(notch);
            });

            function updateRotation(idx) {
                const rot = -idx * angleStep;
                container.style.transform = `rotateX(${rot}deg)`;
                const notches = container.querySelectorAll('.drum-notch');
                notches.forEach((n, i) => n.classList.toggle('active', i === idx));
            }

            updateRotation(activeIdx);

            // Drag / Wheel interaction
            const col = container.parentElement;
            let startY = 0;
            let currentIdx = activeIdx;

            col.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY > 0) {
                    currentIdx = (currentIdx + 1) % count;
                } else {
                    currentIdx = (currentIdx - 1 + count) % count;
                }
                updateRotation(currentIdx);
                onSelect(currentIdx);
            }, { passive: false });

            return { updateRotation };
        }

        const dateReadout = document.getElementById('date-readout');

        function updateReadout() {
            dateReadout.textContent = `${DAYS[selectedDay]} ${MONTHS[selectedMonth]} ${YEARS[selectedYear]}`;
        }

        const dayCtrl = buildCylinder('drum-day', DAYS, selectedDay, (idx) => {
            selectedDay = idx;
            updateReadout();
        });

        const monthCtrl = buildCylinder('drum-month', MONTHS, selectedMonth, (idx) => {
            selectedMonth = idx;
            updateReadout();
        });

        const yearCtrl = buildCylinder('drum-year', YEARS, selectedYear, (idx) => {
            selectedYear = idx;
            updateReadout();
        });

        document.getElementById('confirm-btn').addEventListener('click', () => {
            dateReadout.style.color = '#34d399';
            dateReadout.textContent = `DECRYPTED: ${DAYS[selectedDay]}-${MONTHS[selectedMonth]}-${YEARS[selectedYear]}`;
            setTimeout(() => {
                dateReadout.style.color = '#fbbf24';
                updateReadout();
            }, 1800);
        });
    </script>
</body>
</html>
