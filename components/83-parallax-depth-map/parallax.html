<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Parallax Depth Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0;
            background: #020617; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            overflow-y: auto;
            min-height: 100%;
        }
        .will-change-transform { will-change: transform; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root">
        <div class="w-full relative">
            
            <!-- CRITICAL SCROLL DRIVER -->
            <div class="w-full relative h-[400vh] pointer-events-none z-0 invisible"></div>

            <!-- BACKGROUND LAYER (Deep Depth) -->
            <div id="bg-layer" class="fixed top-0 left-0 w-full h-screen z-0 pointer-events-none flex items-center justify-center opacity-40 mix-blend-screen will-change-transform">
                <div class="absolute top-[20vh] left-[10vw] w-[80vw] h-[80vh] bg-indigo-900/40 rounded-full blur-[120px]"></div>
                <div class="absolute top-[60vh] right-[10vw] w-[60vw] h-[60vh] bg-fuchsia-900/30 rounded-full blur-[100px]"></div>
                <div class="absolute top-[120vh] left-[20vw] w-[90vw] h-[80vh] bg-teal-900/30 rounded-full blur-[140px]"></div>
            </div>

            <!-- MIDGROUND LAYER (Standard Reading Plane) -->
            <div id="mid-layer" class="fixed top-0 left-0 w-full z-10 flex flex-col items-center justify-start pt-32 px-4 will-change-transform">
                <div class="mb-20 animate-bounce text-slate-500 font-bold tracking-widest uppercase">Scroll Down Continuously</div>

                <h1 class="text-6xl md:text-[120px] font-black tracking-tighter text-white leading-none mb-12 text-center drop-shadow-2xl">
                    Parallax Core.
                </h1>
                <p class="text-xl text-slate-400 font-medium text-center max-w-2xl mb-48 leading-relaxed">
                    True hardware-accelerated depth mapping. The background blurs drift sluggishly mimicking distance. The midground (this text) translates linearly. The foreground widgets aggressively overshoot the camera lens.
                </p>

                <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl"></div>
                
                <div class="mt-64 pb-32 font-bold text-slate-600 tracking-widest text-3xl uppercase">End of Content Map</div>
            </div>

            <!-- FOREGROUND LAYER (Intense Depth, Floating very close) -->
            <div id="fg-layer" class="fixed top-0 left-0 w-full h-[400vh] z-20 pointer-events-none flex flex-col items-center justify-start overflow-hidden will-change-transform">
                <div class="w-[150px] h-[150px] bg-gradient-to-tr from-fuchsia-500 to-rose-500 rounded-3xl absolute top-[60vh] left-[10vw] shadow-[0_40px_80px_rgba(244,63,94,0.4)] border border-white/20 transform rotate-12 backdrop-blur-md opacity-90 blur-sm"></div>
                
                <div class="w-[300px] h-[300px] bg-gradient-to-tl from-teal-400 to-emerald-500 rounded-full absolute top-[180vh] right-[-5vw] shadow-[0_40px_100px_rgba(16,185,129,0.3)] border border-white/20 transform -translate-y-[10vh] opacity-80 blur-md"></div>
                
                <div class="w-[200px] h-[100px] bg-sky-500 rounded-[40px] shadow-2xl border-t border-sky-400 absolute top-[280vh] left-[20vw] opacity-90 blur-sm flex justify-center items-center text-sky-200 font-bold text-xl tracking-widest">
                    [ Z: +200 ]
                </div>
            </div>

        </div>
    </div>

    <script>
        // Generate Cards
        const cardsContainer = document.getElementById('cards-container');
        for (let idx = 1; idx <= 6; idx++) {
            const html = `
                <div class="h-64 bg-slate-900/90 backdrop-blur-2xl rounded-[32px] border border-slate-700/60 shadow-2xl p-10 hover:bg-slate-800 transition-colors pointer-events-auto">
                    <h2 class="text-2xl font-black tracking-tight text-white mb-4">Reading Block 0${idx}</h2>
                    <div class="w-full h-4 bg-slate-800 rounded mb-3"></div>
                    <div class="w-3/4 h-4 bg-slate-800 rounded mb-3"></div>
                    <div class="w-1/2 h-4 bg-slate-800 rounded"></div>
                </div>
            `;
            cardsContainer.insertAdjacentHTML('beforeend', html);
        }

        const bgLayer = document.getElementById('bg-layer');
        const midLayer = document.getElementById('mid-layer');
        const fgLayer = document.getElementById('fg-layer');

        let targetY = 0;
        let currentY = 0;

        function render() {
            targetY = window.scrollY;
            currentY += (targetY - currentY) * 0.08; // Lerp damper

            // Math identical to Framer Motion transforms
            const bgY = -(currentY * 0.15);
            const midY = -currentY;
            const fgY = -(currentY * 1.6);

            bgLayer.style.transform = `translateY(${bgY}px)`;
            midLayer.style.transform = `translateY(${midY}px)`;
            fgLayer.style.transform = `translateY(${fgY}px)`;

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
