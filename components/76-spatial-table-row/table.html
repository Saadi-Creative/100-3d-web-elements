<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Spreadsheet Edit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { margin:0; background:#f8fafc; min-height:100vh; font-family:'Inter',sans-serif; overflow-x:hidden; }
        .preserve-3d { transform-style:preserve-3d; perspective:1200px; }
        
        .table-row {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s, opacity 0.4s, padding 0.4s, border-radius 0.4s, box-shadow 0.4s;
            transform: translateZ(0) scale(1);
        }
        
        /* State when NO row is active */
        .table-container:not(.has-active) .table-row:hover {
            background-color: #f8fafc;
        }

        /* State when a row is active */
        .table-container.has-active .table-row.dimmed {
            transform: translateZ(-50px) scale(0.96);
            filter: blur(3px);
            opacity: 0.4;
            pointer-events: none;
        }
        
        .table-container.has-active .table-row.active {
            transform: translateZ(50px) scale(1.05);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-color: transparent;
            z-index: 10;
            padding: 1.5rem;
            background: white;
            cursor: default;
        }
        
        .edit-fields {
            display: none;
        }
        .display-fields {
            display: block;
        }
        .table-row.active .edit-fields {
            display: block;
        }
        .table-row.active .display-fields {
            display: none;
        }
        
        .action-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s, margin-top 0.4s;
            margin-top: 0;
        }
        
        .table-row.active .action-panel {
            max-height: 100px;
            opacity: 1;
            margin-top: 1.5rem;
        }
        
        .backdrop-blocker {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .table-container.has-active .backdrop-blocker {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
<div id="root">
    <div class="w-full min-h-screen py-24 px-8 flex justify-center preserve-3d">
        <div class="w-full max-w-5xl relative z-10">
            
            <div class="mb-12 pointer-events-none">
                <h1 class="text-4xl font-black text-slate-800 tracking-tighter mb-2">Spatial Spreadsheet Workspace</h1>
                <p class="text-slate-500 font-medium">Click any row below. Instead of triggering a jarring modal popup breaking visual context, the rest of the table seamlessly recedes backward into the Z-axis while the targeted row physically morphs into an elevated input workspace.</p>
            </div>

            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden relative preserve-3d">
                
                <div class="flex px-6 py-4 bg-slate-50 border-b border-slate-200">
                    <div class="w-10 mr-4"></div>
                    <div class="grid grid-cols-4 w-full gap-4">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Name</span>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Role</span>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Email</span>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest text-right">Status</span>
                    </div>
                </div>

                <div id="table-container" class="table-container flex flex-col preserve-3d bg-slate-100/50 p-2 gap-1 rounded-b-2xl min-h-[400px]">
                    <div id="backdrop" class="backdrop-blocker absolute inset-0 z-[5] cursor-pointer"></div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    const USERS = [
        { id:1, name:'Eleanor Pena', role:'Lead Security', status:'Active', email:'eleanor@spatial.io', avatar:'EP' },
        { id:2, name:'Jacob Jones', role:'System Admin', status:'Offline', email:'jacob@spatial.io', avatar:'JJ' },
        { id:3, name:'Courtney Henry', role:'Product Manager', status:'Active', email:'courtney@spatial.io', avatar:'CH' },
        { id:4, name:'Ralph Edwards', role:'UX Designer', status:'Busy', email:'ralph@spatial.io', avatar:'RE' },
        { id:5, name:'Arlene McCoy', role:'Data Engineer', status:'Active', email:'arlene@spatial.io', avatar:'AM' },
    ];

    const container = document.getElementById('table-container');
    const backdrop = document.getElementById('backdrop');
    let activeId = null;

    function renderTable() {
        // Clear all except backdrop
        Array.from(container.children).forEach(child => {
            if (child !== backdrop) container.removeChild(child);
        });

        USERS.forEach(user => {
            const row = document.createElement('div');
            row.className = `table-row w-full flex flex-col bg-white border-b border-slate-200 p-4 cursor-pointer relative z-0`;
            row.dataset.id = user.id;
            
            const statusClass = user.status === 'Active' ? 'bg-emerald-100 text-emerald-700' : user.status === 'Offline' ? 'bg-slate-100 text-slate-600' : 'bg-amber-100 text-amber-700';

            row.innerHTML = `
                <div class="flex items-center w-full gap-4 pointer-events-none">
                    <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center flex-shrink-0 border border-indigo-200">
                        ${user.avatar}
                    </div>

                    <div class="grid grid-cols-4 w-full gap-4 items-center">
                        <div class="flex flex-col">
                            <span class="edit-fields text-[10px] uppercase font-bold text-slate-400 mb-1">Full Name</span>
                            <input type="text" value="${user.name}" class="edit-fields pointer-events-auto w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
                            <span class="display-fields text-sm font-semibold text-slate-800">${user.name}</span>
                        </div>

                        <div class="flex flex-col">
                            <span class="edit-fields text-[10px] uppercase font-bold text-slate-400 mb-1">Assigned Role</span>
                            <select class="edit-fields pointer-events-auto w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-none focus:border-indigo-500">
                                <option>${user.role}</option>
                                <option>Guest</option>
                                <option>Administrator</option>
                            </select>
                            <span class="display-fields text-sm text-slate-500 font-medium">${user.role}</span>
                        </div>

                        <div class="flex flex-col">
                            <span class="edit-fields text-[10px] uppercase font-bold text-slate-400 mb-1">Email Address</span>
                            <input type="email" value="${user.email}" class="edit-fields pointer-events-auto w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-none focus:border-indigo-500" />
                            <span class="display-fields text-sm text-slate-500">${user.email}</span>
                        </div>

                        <div class="flex justify-end items-center gap-4">
                            <span class="display-fields text-xs font-bold px-2.5 py-1 rounded-full ${statusClass}">
                                ${user.status}
                            </span>
                        </div>
                    </div>
                </div>

                <div class="action-panel flex justify-end gap-3 pt-6 border-t border-slate-100">
                    <button class="btn-cancel px-4 py-2 text-sm font-semibold text-slate-500 hover:text-slate-800 transition-colors">
                        Cancel
                    </button>
                    <button class="btn-save px-6 py-2 text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-md transition-all active:scale-95">
                        Save Changes
                    </button>
                </div>
            `;

            row.addEventListener('click', (e) => {
                if (activeId === user.id) return; // already active
                if (e.target.closest('input') || e.target.closest('select') || e.target.closest('button')) return; // let form elms work
                
                activateRow(user.id);
            });

            const cancelBtn = row.querySelector('.btn-cancel');
            const saveBtn = row.querySelector('.btn-save');

            cancelBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deactivateRow();
            });

            saveBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deactivateRow();
            });

            container.appendChild(row);
        });
    }

    function activateRow(id) {
        activeId = id;
        container.classList.add('has-active');
        const rows = document.querySelectorAll('.table-row');
        rows.forEach(r => {
            if (parseInt(r.dataset.id) === id) {
                r.classList.add('active');
                r.classList.remove('dimmed');
            } else {
                r.classList.add('dimmed');
                r.classList.remove('active');
            }
        });
    }

    function deactivateRow() {
        activeId = null;
        container.classList.remove('has-active');
        const rows = document.querySelectorAll('.table-row');
        rows.forEach(r => {
            r.classList.remove('active', 'dimmed');
        });
    }

    backdrop.addEventListener('click', deactivateRow);

    renderTable();
</script>
</body>
</html>
