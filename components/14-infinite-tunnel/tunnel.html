<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>14 - Hyperspace Velocity Warp Corridor</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #020617;
      font-family: var(--font-sans);
    }

    #tunnel-canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Spatial Telemetry HUD */
    .warp-hud {
      position: absolute;
      top: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      text-align: center;
    }

    .warp-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--accent-base);
      margin-bottom: var(--space-2);
    }

    .warp-title {
      font-size: var(--text-2xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
    }

    .warp-speed-badge {
      margin-top: var(--space-3);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-muted);
      backdrop-filter: blur(16px);
      pointer-events: auto;
    }

    .speed-val {
      color: var(--accent-base);
      font-weight: 700;
    }

    /* Speed Mode Toolbar */
    .warp-toolbar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .speed-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .speed-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="warp-hud">
      <span class="warp-tag">PROCEDURAL CORRIDOR</span>
      <h1 class="warp-title">Hyperspace Velocity Warp</h1>
      <div class="warp-speed-badge">Current Velocity: <span class="speed-val" id="speedReadout">1.0 MACH</span></div>
    </div>

    <div id="tunnel-canvas"></div>

    <div class="warp-toolbar" role="toolbar" aria-label="Warp speed settings">
      <button class="speed-btn is-active" data-speed="1.0" data-mach="1.0 MACH">Sub-Light Cruise</button>
      <button class="speed-btn" data-speed="2.5" data-mach="4.5 MACH">Warp Velocity</button>
      <button class="speed-btn" data-speed="5.0" data-mach="9.9 MACH">Hyperspace Boost</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('tunnel-canvas');
    const W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(80, W / H, 0.1, 200);
    camera.position.z = 0;
    camera.lookAt(0, 0, -10);

    // Procedural Neon Grid Canvas Texture
    function createGridTexture() {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = '#6366f1';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#6366f1';
      ctx.shadowBlur = 8;

      const cols = 8, rows = 12;
      for (let i = 0; i <= cols; i++) {
        const x = (i / cols) * size;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, size);
        ctx.stroke();
      }
      for (let j = 0; j <= rows; j++) {
        const y = (j / rows) * size;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(size, y);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 10);
      return tex;
    }

    const gridTexture = createGridTexture();
    const cylGeo = new THREE.CylinderGeometry(4, 4, 60, 32, 1, true);
    const cylMat = new THREE.MeshBasicMaterial({
      map: gridTexture,
      side: THREE.BackSide,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const cylinder = new THREE.Mesh(cylGeo, cylMat);
    cylinder.rotation.x = Math.PI / 2;
    scene.add(cylinder);

    let speedMultiplier = 1.0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      gridTexture.offset.y = t * 0.15 * speedMultiplier;
      cylinder.rotation.z = t * 0.05;

      camera.fov = 80 + speedMultiplier * 4;
      camera.updateProjectionMatrix();

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const W2 = container.clientWidth, H2 = container.clientHeight;
      camera.aspect = W2 / H2;
      camera.updateProjectionMatrix();
      renderer.setSize(W2, H2);
    });

    // Speed Selector Buttons
    const speedBtns = document.querySelectorAll('.speed-btn');
    const speedReadout = document.getElementById('speedReadout');

    speedBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        speedBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        speedMultiplier = parseFloat(btn.dataset.speed);
        speedReadout.textContent = btn.dataset.mach;
      });
    });
  </script>
</body>
</html>
