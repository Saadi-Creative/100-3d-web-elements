<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mechanical Switch Checkbox</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        body {
            background: radial-gradient(circle at center, #121524 0%, #060810 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            perspective: 1000px;
            gap: 32px;
        }

        .switch-board {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(18, 24, 38, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 36px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            cursor: pointer;
        }

        .switch-meta {
            display: flex;
            flex-direction: column;
        }

        .switch-title {
            font-size: 15px;
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: -0.01em;
        }

        .switch-sub {
            font-size: 11px;
            font-family: var(--font-mono, monospace);
            color: #64748b;
        }

        /* 3D Mechanical Keycap Housing */
        .mech-chassis {
            position: relative;
            width: 72px;
            height: 42px;
            border-radius: 12px;
            background: #0f172a;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                inset 0 4px 8px rgba(0, 0, 0, 0.8),
                0 4px 10px rgba(0, 0, 0, 0.4);
            transform-style: preserve-3d;
            padding: 3px;
        }

        /* The Spring-Loaded Keycap Actuator */
        .mech-cap {
            position: relative;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(145deg, #334155, #1e293b);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 6px 12px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transform: translate3d(0, 0, 8px);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.25s ease,
                        box-shadow 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Mechanical Stem Indicator Diode */
        .stem-diode {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #475569;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
            transition: all 0.25s ease;
        }

        /* Active / Checked State */
        .switch-row.checked .mech-cap {
            transform: translate3d(32px, 0, 4px);
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-color: var(--accent-color, #38bdf8);
            box-shadow: 
                0 2px 6px rgba(0, 0, 0, 0.8),
                0 0 15px var(--accent-glow, rgba(56, 189, 248, 0.4));
        }

        .switch-row.checked .stem-diode {
            background: var(--accent-color, #38bdf8);
            box-shadow: 0 0 10px var(--accent-color, #38bdf8);
        }

        /* Colorways */
        .switch-row[data-color="cyan"] { --accent-color: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.5); }
        .switch-row[data-color="emerald"] { --accent-color: #34d399; --accent-glow: rgba(52, 211, 153, 0.5); }
        .switch-row[data-color="amber"] { --accent-color: #fbbf24; --accent-glow: rgba(251, 191, 36, 0.5); }
        .switch-row[data-color="rose"] { --accent-color: #f43f5e; --accent-glow: rgba(244, 63, 94, 0.5); }

        /* Actuation sound & click press */
        .switch-row:active .mech-cap {
            transform: translate3d(var(--press-x, 0px), 0, 0px);
        }
    </style>
</head>
<body>

    <div class="switch-board">
        <div class="switch-row checked" data-color="cyan">
            <div class="switch-meta">
                <div class="switch-title">Hardware Acceleration (GPU)</div>
                <div class="switch-sub">Direct3D 12 · WebGPU Tier 1</div>
            </div>
            <div class="mech-chassis">
                <div class="mech-cap">
                    <div class="stem-diode"></div>
                </div>
            </div>
        </div>

        <div class="switch-row checked" data-color="emerald">
            <div class="switch-meta">
                <div class="switch-title">Zero-Latency Event Bus</div>
                <div class="switch-sub">gRPC Socket Sub-Millisecond Stream</div>
            </div>
            <div class="mech-chassis">
                <div class="mech-cap">
                    <div class="stem-diode"></div>
                </div>
            </div>
        </div>

        <div class="switch-row" data-color="amber">
            <div class="switch-meta">
                <div class="switch-title">Autonomous Healing Daemon</div>
                <div class="switch-sub">Auto-recovers dropped worker pods</div>
            </div>
            <div class="mech-chassis">
                <div class="mech-cap">
                    <div class="stem-diode"></div>
                </div>
            </div>
        </div>

        <div class="switch-row checked" data-color="rose">
            <div class="switch-meta">
                <div class="switch-title">Quantum Threat Shield</div>
                <div class="switch-sub">Kyber-1024 Lattice Encryption</div>
            </div>
            <div class="mech-chassis">
                <div class="mech-cap">
                    <div class="stem-diode"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Synthesize Mechanical Cherry Click Audio using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playMechanicalClick(pitch = 1.0) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800 * pitch, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        const rows = document.querySelectorAll('.switch-row');
        rows.forEach(row => {
            row.addEventListener('click', () => {
                const isChecked = row.classList.toggle('checked');
                row.style.setProperty('--press-x', isChecked ? '32px' : '0px');
                playMechanicalClick(isChecked ? 1.2 : 0.8);
            });
        });
    </script>
</body>
</html>
