<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10 - Prismatic Optical Crystal Hero</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      overflow: hidden;
      perspective: 1200px;
    }

    /* Background Ambient Gradients */
    .ambient-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.15) 0%, transparent 60%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.8s ease;
    }

    /* 3D Crystal Stage */
    .crystal-stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      z-index: 1;
    }

    /* Prism Nodes */
    .prism-node {
      position: absolute;
      border-radius: var(--radius-2xl);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      transform-style: preserve-3d;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
      cursor: pointer;
    }

    .prism-node:hover {
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 30px 60px rgba(99, 102, 241, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .prism-main {
      width: 220px;
      height: 220px;
      transform: translateZ(60px) rotateX(15deg) rotateY(-15deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      text-align: center;
    }

    .prism-secondary-left {
      width: 140px;
      height: 140px;
      top: 40px;
      left: 20px;
      transform: translateZ(20px) rotateX(-10deg) rotateY(20deg);
    }

    .prism-secondary-right {
      width: 130px;
      height: 130px;
      bottom: 40px;
      right: 30px;
      transform: translateZ(40px) rotateX(20deg) rotateY(10deg);
    }

    /* Prism Content */
    .prism-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-heading);
      margin-bottom: var(--space-3);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .prism-title {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
    }

    .prism-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-2);
    }

    /* Floating Geometry Wireframes */
    .crystal-facets {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.15), transparent 70%);
    }

    /* Control Toolbar */
    .controls-bar {
      position: relative;
      z-index: 2;
      margin-top: var(--space-6);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .control-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      color: var(--text-heading);
      background: rgba(255, 255, 255, 0.05);
    }

    .control-btn.is-active {
      background: var(--surface-overlay);
      border-color: var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container" id="stageContainer">
    <div class="ambient-glow" id="ambientGlow"></div>

    <div class="crystal-stage" id="crystalStage">
      <!-- Secondary Floating Prism (Left) -->
      <div class="prism-node prism-secondary-left" id="nodeLeft">
        <div class="crystal-facets"></div>
      </div>

      <!-- Main Central Prism Node -->
      <div class="prism-node prism-main" id="nodeMain">
        <div class="crystal-facets"></div>
        <span class="prism-badge">PRISMATIC 2.5D</span>
        <h1 class="prism-title">Crystalline Optical Optics</h1>
        <p class="prism-sub">Refractive multi-layer glass matrix</p>
      </div>

      <!-- Secondary Floating Prism (Right) -->
      <div class="prism-node prism-secondary-right" id="nodeRight">
        <div class="crystal-facets"></div>
      </div>
    </div>

    <!-- Mode Selector Controls -->
    <div class="controls-bar" role="toolbar" aria-label="Prism lighting controls">
      <button class="control-btn is-active" data-theme="violet">Violet Aurora</button>
      <button class="control-btn" data-theme="cyan">Cyber Cyan</button>
      <button class="control-btn" data-theme="emerald">Emerald Spark</button>
    </div>
  </div>

  <script>
    const crystalStage = document.getElementById('crystalStage');
    const nodeMain = document.getElementById('nodeMain');
    const nodeLeft = document.getElementById('nodeLeft');
    const nodeRight = document.getElementById('nodeRight');
    const ambientGlow = document.getElementById('ambientGlow');
    const controlBtns = document.querySelectorAll('.control-btn');

    // Smooth Mouse Tilt & Parallax
    window.addEventListener('mousemove', (e) => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      const rotX = ((e.clientY - centerY) / centerY) * -16;
      const rotY = ((e.clientX - centerX) / centerX) * 16;

      nodeMain.style.transform = `translateZ(60px) rotateX(${15 + rotX * 0.8}deg) rotateY(${-15 + rotY * 0.8}deg)`;
      nodeLeft.style.transform = `translateZ(20px) rotateX(${-10 + rotX * 0.5}deg) rotateY(${20 + rotY * 0.5}deg) translateX(${rotY * 0.5}px)`;
      nodeRight.style.transform = `translateZ(40px) rotateX(${20 + rotX * 0.6}deg) rotateY(${10 + rotY * 0.6}deg) translateY(${rotX * 0.5}px)`;
    });

    // Theme preset switcher
    const themes = {
      violet: {
        glow: 'radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.25) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.2) 0%, transparent 50%)',
        accent: '#6366f1'
      },
      cyan: {
        glow: 'radial-gradient(circle at 30% 30%, rgba(6, 182, 212, 0.3) 0%, transparent 50%), radial-gradient(circle at 70% 70%, rgba(59, 130, 246, 0.25) 0%, transparent 50%)',
        accent: '#06b6d4'
      },
      emerald: {
        glow: 'radial-gradient(circle at 30% 40%, rgba(16, 185, 129, 0.3) 0%, transparent 50%), radial-gradient(circle at 70% 60%, rgba(234, 179, 8, 0.2) 0%, transparent 50%)',
        accent: '#10b981'
      }
    };

    controlBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        controlBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        const themeKey = btn.dataset.theme;
        const config = themes[themeKey];
        ambientGlow.style.background = config.glow;
        document.documentElement.style.setProperty('--accent-base', config.accent);
      });
    });
  </script>
</body>
</html>
