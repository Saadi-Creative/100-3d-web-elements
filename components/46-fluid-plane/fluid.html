<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hydrodynamic Fluid Wave Plane</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #01040a;
            min-height: 100vh;
            overflow: hidden;
            color: white;
            font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, sans-serif);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hud-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-family: var(--font-mono, monospace);
            color: #38bdf8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .hud-title {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }

        .controls-bar {
            position: absolute;
            bottom: 24px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .btn-fluid {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #bae6fd;
            padding: 10px 18px;
            border-radius: 8px;
            font-family: var(--font-mono, monospace);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-fluid:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .telemetry-box {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 14px 18px;
            backdrop-filter: blur(12px);
            font-family: var(--font-mono, monospace);
            font-size: 11px;
            color: #94a3b8;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .val-cyan {
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="hud-overlay">
        <div class="hud-badge">
            <span>🌊</span>
            <span>GLSL Gerstner Hydrodynamics</span>
        </div>
        <div class="hud-title">60 FPS Hardware Fluid Plane</div>
    </div>

    <div class="controls-bar">
        <button class="btn-fluid" id="surge-btn">
            <span>⚡</span> Surge Tidal Wave
        </button>
        <button class="btn-fluid" id="calm-btn">
            <span>🪞</span> Glass Surface
        </button>
        <button class="btn-fluid" id="wire-btn">
            <span>⬡</span> Wireframe Mesh
        </button>
    </div>

    <div class="telemetry-box">
        <div>WAVE AMPLITUDE: <span class="val-cyan" id="amp-val">0.65m</span></div>
        <div>VERTEX COUNT: <span class="val-cyan">16,384</span></div>
        <div>VISCOSITY: <span class="val-cyan">0.001 Pa·s (H₂O)</span></div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 0, 0);

        // High-density fluid plane geometry
        const SEGMENTS = 128;
        const fluidGeo = new THREE.PlaneGeometry(12, 12, SEGMENTS, SEGMENTS);
        fluidGeo.rotateX(-Math.PI / 2);

        // Gerstner Fluid Wave Shader Material
        const fluidMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uAmplitude: { value: 0.65 },
                uMouse: { value: new THREE.Vector2(0, 0) }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uAmplitude;
                uniform vec2 uMouse;
                varying vec3 vPos;
                varying vec3 vNormal;

                // Gerstner Wave Formula
                vec3 gerstnerWave(vec3 p, vec2 dir, float steepness, float wavelength, float time) {
                    float k = 2.0 * 3.14159265 / wavelength;
                    float c = sqrt(9.8 / k);
                    vec2 d = normalize(dir);
                    float f = k * (dot(d, p.xz) - c * time);
                    float a = steepness / k * uAmplitude;

                    return vec3(
                        d.x * (a * cos(f)),
                        a * sin(f),
                        d.y * (a * cos(f))
                    );
                }

                void main() {
                    vec3 p = position;

                    // Mouse ripple displacement
                    float mouseDist = length(p.xz - uMouse * 4.0);
                    float ripple = sin(mouseDist * 4.0 - uTime * 6.0) * exp(-mouseDist * 0.8) * 0.3 * uAmplitude;

                    // Compound 3 Gerstner waves
                    vec3 w1 = gerstnerWave(p, vec2(1.0, 0.6), 0.3, 3.2, uTime * 1.2);
                    vec3 w2 = gerstnerWave(p, vec2(-0.7, 0.8), 0.25, 2.1, uTime * 1.5);
                    vec3 w3 = gerstnerWave(p, vec2(0.3, -1.0), 0.15, 1.4, uTime * 2.0);

                    p += w1 + w2 + w3;
                    p.y += ripple;

                    vPos = p;
                    vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec3 vPos;
                varying vec3 vNormal;

                void main() {
                    // Height-based oceanic color grading
                    float h = (vPos.y + 0.5);
                    vec3 deepBlue = vec3(0.01, 0.05, 0.15);
                    vec3 cyanGlow = vec3(0.04, 0.45, 0.85);
                    vec3 crestWhite = vec3(0.7, 0.95, 1.0);

                    vec3 color = mix(deepBlue, cyanGlow, smoothstep(-0.3, 0.4, h));
                    color = mix(color, crestWhite, smoothstep(0.4, 0.8, h));

                    // Caustic Fresnel highlights
                    float fresnel = pow(1.0 - max(dot(vNormal, vec3(0.0, 1.0, 0.0)), 0.0), 2.5);
                    color += vec3(0.2, 0.6, 1.0) * fresnel * 0.6;

                    gl_FragColor = vec4(color, 0.92);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });

        const fluidMesh = new THREE.Mesh(fluidGeo, fluidMat);
        scene.add(fluidMesh);

        // Controls
        let targetAmplitude = 0.65;
        const ampVal = document.getElementById('amp-val');

        document.getElementById('surge-btn').addEventListener('click', () => {
            targetAmplitude = 1.4;
            setTimeout(() => { targetAmplitude = 0.65; }, 1800);
        });

        document.getElementById('calm-btn').addEventListener('click', () => {
            targetAmplitude = targetAmplitude === 0.05 ? 0.65 : 0.05;
        });

        let isWire = false;
        document.getElementById('wire-btn').addEventListener('click', () => {
            isWire = !isWire;
            fluidMat.wireframe = isWire;
        });

        // Mouse coordinates for wave excitation
        let mouseX = 0;
        let mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            fluidMat.uniforms.uMouse.value.set(mouseX, -mouseY);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            fluidMat.uniforms.uTime.value = time;
            fluidMat.uniforms.uAmplitude.value += (targetAmplitude - fluidMat.uniforms.uAmplitude.value) * 0.05;
            ampVal.textContent = `${fluidMat.uniforms.uAmplitude.value.toFixed(2)}m`;

            // Camera subtle orbit
            camera.position.x = 8 * Math.sin(time * 0.1 + mouseX * 0.4);
            camera.position.z = 8 * Math.cos(time * 0.1 + mouseX * 0.4);
            camera.position.y = 5.0 - mouseY * 1.5;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
