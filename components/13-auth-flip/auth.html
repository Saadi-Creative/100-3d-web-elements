<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>13 - Dual-Chamber Holographic Auth Vault</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      perspective: 1200px;
      overflow: hidden;
      user-select: none;
    }

    /* Ambient Background Orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
    }

    .orb-1 { width: 320px; height: 320px; background: #6366f1; top: -60px; left: -80px; }
    .orb-2 { width: 280px; height: 280px; background: #10b981; bottom: -60px; right: -80px; }

    /* 3D Vault Flipper */
    .vault-flipper {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 440px;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .vault-flipper.is-flipped {
      transform: rotateY(180deg);
    }

    .vault-face {
      position: absolute;
      inset: 0;
      padding: var(--space-8);
      border-radius: var(--radius-2xl);
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-2xl), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .vault-face-back {
      transform: rotateY(180deg);
    }

    .vault-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .vault-badge {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-overlay);
      color: var(--accent-base);
      border: 1px solid var(--border-subtle);
    }

    .vault-badge svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .vault-title {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text-heading);
    }

    .vault-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-4);
    }

    .form-label {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .form-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      color: var(--text-heading);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--accent-base);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .submit-btn {
      width: 100%;
      padding: var(--space-3);
      margin-top: var(--space-4);
      border-radius: var(--radius-md);
      border: none;
      background: linear-gradient(135deg, var(--accent-base), #4f46e5);
      color: #ffffff;
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .flip-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .flip-toggle-btn {
      background: none;
      border: none;
      color: var(--accent-base);
      font-weight: 600;
      cursor: pointer;
      font-size: var(--text-xs);
    }

    .flip-toggle-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="vault-flipper" id="flipper">
      <!-- FRONT: SIGN IN -->
      <div class="vault-face vault-face-front">
        <div>
          <div class="vault-header">
            <div class="vault-badge">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <div>
              <h2 class="vault-title">Welcome Back</h2>
              <p class="vault-sub">Authenticate securely</p>
            </div>
          </div>

          <form onsubmit="event.preventDefault(); alert('Signed in!');">
            <div class="form-group">
              <label class="form-label" for="signin-email">Email Address</label>
              <input class="form-input" id="signin-email" type="email" placeholder="user@domain.com" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="signin-pass">Access Security Key</label>
              <input class="form-input" id="signin-pass" type="password" placeholder="••••••••" required />
            </div>

            <button class="submit-btn" type="submit">Unlock Vault</button>
          </form>
        </div>

        <div class="flip-footer">
          <span>Need access?</span>
          <button class="flip-toggle-btn" id="btnToRegister">Create account →</button>
        </div>
      </div>

      <!-- BACK: CREATE ACCOUNT -->
      <div class="vault-face vault-face-back">
        <div>
          <div class="vault-header">
            <div class="vault-badge" style="color: #10b981;">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            </div>
            <div>
              <h2 class="vault-title">Register Identity</h2>
              <p class="vault-sub">Join cryptographic mesh</p>
            </div>
          </div>

          <form onsubmit="event.preventDefault(); alert('Account registered!');">
            <div class="form-group">
              <label class="form-label" for="reg-name">Full Name</label>
              <input class="form-input" id="reg-name" type="text" placeholder="Alex Thorne" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-email">Email Address</label>
              <input class="form-input" id="reg-email" type="email" placeholder="alex@domain.com" required />
            </div>

            <button class="submit-btn" type="submit" style="background: linear-gradient(135deg, #10b981, #059669);">Initialize Identity</button>
          </form>
        </div>

        <div class="flip-footer">
          <span>Registered identity?</span>
          <button class="flip-toggle-btn" id="btnToSignin" style="color: #10b981;">Sign in →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const flipper = document.getElementById('flipper');
    document.getElementById('btnToRegister').addEventListener('click', () => {
      flipper.classList.add('is-flipped');
    });
    document.getElementById('btnToSignin').addEventListener('click', () => {
      flipper.classList.remove('is-flipped');
    });
  </script>
</body>
</html>
