<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Ribbon Unfurl Dropdown</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 30%, #131726 0%, #06080e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px;
            overflow: hidden;
            user-select: none;
            perspective: 1200px;
        }

        .dropdown-container {
            position: relative;
            width: 320px;
            transform-style: preserve-3d;
        }

        /* Trigger Button */
        .dropdown-trigger {
            width: 100%;
            height: 52px;
            background: rgba(22, 29, 46, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #f8fafc;
            cursor: pointer;
            box-shadow: 
                0 15px 30px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
            z-index: 20;
            position: relative;
        }

        .dropdown-trigger:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(56, 189, 248, 0.2);
        }

        .dropdown-trigger.open {
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }

        .trigger-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .trigger-icon {
            font-size: 18px;
        }

        .trigger-label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .trigger-chevron {
            font-size: 11px;
            color: #94a3b8;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dropdown-trigger.open .trigger-chevron {
            transform: rotate(180deg);
            color: #38bdf8;
        }

        /* 3D Ribbon Accordion Cascade */
        .ribbon-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            transform-style: preserve-3d;
            pointer-events: none;
            z-index: 10;
        }

        .ribbon-menu.open {
            pointer-events: auto;
        }

        .ribbon-item {
            position: relative;
            background: rgba(18, 24, 38, 0.95);
            backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transform-origin: top center;
            transform: rotateX(-90deg) translateZ(0);
            opacity: 0;
            transition: 
                transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.35s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .ribbon-item:last-child {
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Staggered cascading opening */
        .ribbon-menu.open .ribbon-item:nth-child(1) { transform: rotateX(0deg); opacity: 1; transition-delay: 0.02s; }
        .ribbon-menu.open .ribbon-item:nth-child(2) { transform: rotateX(0deg); opacity: 1; transition-delay: 0.06s; }
        .ribbon-menu.open .ribbon-item:nth-child(3) { transform: rotateX(0deg); opacity: 1; transition-delay: 0.10s; }
        .ribbon-menu.open .ribbon-item:nth-child(4) { transform: rotateX(0deg); opacity: 1; transition-delay: 0.14s; }
        .ribbon-menu.open .ribbon-item:nth-child(5) { transform: rotateX(0deg); opacity: 1; transition-delay: 0.18s; }
        .ribbon-menu.open .ribbon-item:nth-child(6) { transform: rotateX(0deg); opacity: 1; transition-delay: 0.22s; }

        /* Item Hover & Active */
        .ribbon-item:hover {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.15), rgba(18, 24, 38, 0.98));
            border-left-color: #38bdf8;
            transform: rotateX(0deg) translateZ(12px) scale(1.02);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
            z-index: 5;
        }

        .item-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .item-title {
            font-size: 13.5px;
            font-weight: 500;
            color: #f1f5f9;
        }

        .item-desc {
            font-size: 10px;
            color: #64748b;
            font-family: var(--font-mono, monospace);
        }

        .item-check {
            color: #38bdf8;
            font-size: 14px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }

        .ribbon-item.selected .item-check {
            opacity: 1;
            transform: scale(1);
        }

        /* Status Preview Card */
        .status-display {
            margin-top: 240px;
            text-align: center;
            font-family: var(--font-mono, monospace);
            font-size: 11px;
            color: #64748b;
        }

        .selected-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 9999px;
            color: #38bdf8;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="dropdown-container">
        <div class="dropdown-trigger" id="trigger">
            <div class="trigger-left">
                <span class="trigger-icon" id="current-icon">⚛️</span>
                <span class="trigger-label" id="current-label">React Engine</span>
            </div>
            <span class="trigger-chevron">▼</span>
        </div>

        <div class="ribbon-menu" id="menu">
            <div class="ribbon-item selected" data-value="react" data-label="React Engine" data-icon="⚛️">
                <div class="item-content">
                    <div class="item-icon-box">⚛️</div>
                    <div>
                        <div class="item-title">React Engine</div>
                        <div class="item-desc">Component Graph &amp; Hooks</div>
                    </div>
                </div>
                <div class="item-check">✓</div>
            </div>

            <div class="ribbon-item" data-value="vue" data-label="Vue Reactive" data-icon="💚">
                <div class="item-content">
                    <div class="item-icon-box">💚</div>
                    <div>
                        <div class="item-title">Vue Reactive</div>
                        <div class="item-desc">Proxy-Driven Signals</div>
                    </div>
                </div>
                <div class="item-check">✓</div>
            </div>

            <div class="ribbon-item" data-value="svelte" data-label="Svelte Compiler" data-icon="🔥">
                <div class="item-content">
                    <div class="item-icon-box">🔥</div>
                    <div>
                        <div class="item-title">Svelte Compiler</div>
                        <div class="item-desc">Zero-Runtime Machinery</div>
                    </div>
                </div>
                <div class="item-check">✓</div>
            </div>

            <div class="ribbon-item" data-value="rust" data-label="Rust WASM" data-icon="🦀">
                <div class="item-content">
                    <div class="item-icon-box">🦀</div>
                    <div>
                        <div class="item-title">Rust WASM</div>
                        <div class="item-desc">Bare-Metal Memory Speed</div>
                    </div>
                </div>
                <div class="item-check">✓</div>
            </div>

            <div class="ribbon-item" data-value="three" data-label="Three.js WebGL" data-icon="🧊">
                <div class="item-content">
                    <div class="item-icon-box">🧊</div>
                    <div>
                        <div class="item-title">Three.js WebGL</div>
                        <div class="item-desc">Hardware Spatial Shaders</div>
                    </div>
                </div>
                <div class="item-check">✓</div>
            </div>
        </div>
    </div>

    <div class="status-display">
        <div>CURRENT ENVIRONMENT RUNTIME</div>
        <div class="selected-pill" id="status-pill">
            <span>●</span> <span id="status-text">React Engine v19.0</span>
        </div>
    </div>

    <script>
        const trigger = document.getElementById('trigger');
        const menu = document.getElementById('menu');
        const currentIcon = document.getElementById('current-icon');
        const currentLabel = document.getElementById('current-label');
        const statusText = document.getElementById('status-text');
        const items = document.querySelectorAll('.ribbon-item');

        let isOpen = false;

        function toggleDropdown(state) {
            isOpen = typeof state === 'boolean' ? state : !isOpen;
            trigger.classList.toggle('open', isOpen);
            menu.classList.toggle('open', isOpen);
        }

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        items.forEach((item) => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                items.forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');

                const label = item.getAttribute('data-label');
                const icon = item.getAttribute('data-icon');

                currentLabel.textContent = label;
                currentIcon.textContent = icon;
                statusText.textContent = `${label} Active`;

                toggleDropdown(false);
            });
        });

        // Close on outside click
        document.addEventListener('click', (e) => {
            if (!trigger.contains(e.target) && !menu.contains(e.target)) {
                toggleDropdown(false);
            }
        });
    </script>
</body>
</html>
