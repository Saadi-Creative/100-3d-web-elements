<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Holographic Testimonial Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; overflow: hidden; }
        .preserve-3d { transform-style: preserve-3d; }
        
        .foil-glare {
            background: linear-gradient(
                125deg, 
                transparent 0%, 
                rgba(255,255,255,0.05) 30%, 
                rgba(255,100,200,0.3) 40%, 
                rgba(100,200,255,0.4) 50%, 
                rgba(255,255,100,0.3) 60%, 
                rgba(255,255,255,0.05) 70%, 
                transparent 100%
            );
            background-size: 200% 200%;
            mix-blend-mode: color-dodge;
            transition: opacity 0.3s;
        }
        
        #card {
            transition: transform 0.1s ease-out, scale 0.3s ease-out;
            transform: rotateX(0deg) rotateY(0deg) scale(1);
        }
        
        #card:hover {
            scale: 1.05;
        }
        
        #card:hover .foil-glare {
            opacity: 1;
        }
        
        #floor-shadow {
            transition: transform 0.1s ease-out;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="w-full h-full flex flex-col items-center justify-center p-8 preserve-3d" style="perspective: 1500px">
        <h2 class="text-3xl font-black text-slate-100 mb-12 tracking-tighter">Wall of Love</h2>
        
        <div id="card" class="relative w-[340px] h-[480px] rounded-3xl preserve-3d cursor-crosshair">
            
            <div id="floor-shadow" class="absolute -inset-4 bg-indigo-500/30 rounded-full blur-[40px] pointer-events-none" style="transform: translate3d(0px, 0px, -100px)"></div>

            <div class="absolute inset-0 bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl border border-slate-600/50 shadow-xl overflow-hidden pointer-events-none">
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(129,140,248,0.2),transparent_50%)]"></div>
            </div>

            <div id="foil" class="absolute inset-0 rounded-3xl foil-glare opacity-0 pointer-events-none mix-blend-color-dodge z-30" style="background-position: 50% 50%;"></div>

            <div class="absolute inset-0 rounded-3xl preserve-3d p-8 flex flex-col pointer-events-none">
                <div class="flex gap-1 mb-8" style="transform: translateZ(20px)">
                    <svg class="w-5 h-5 text-amber-400 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                    <svg class="w-5 h-5 text-amber-400 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                    <svg class="w-5 h-5 text-amber-400 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                    <svg class="w-5 h-5 text-amber-400 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                    <svg class="w-5 h-5 text-amber-400 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                </div>

                <p class="text-xl font-semibold text-slate-100 leading-snug drop-shadow-lg mb-auto preserve-3d" style="transform: translateZ(30px)">
                    "The spatial depth logic in this template completely transformed our conversion rates. It literally jumps off the screen. Unbelievable performance."
                </p>

                <div class="mt-8 pt-6 border-t border-white/10 preserve-3d flex items-center justify-between" style="transform: translateZ(10px)">
                    <div>
                        <h4 class="font-bold text-white text-lg drop-shadow">Sarah Jenkins</h4>
                        <p class="text-sky-400 text-sm font-medium">VP Engineering, Vercel</p>
                    </div>
                </div>
            </div>

            <div class="absolute -right-8 bottom-12 w-48 h-48 drop-shadow-[0_20px_20px_rgba(0,0,0,0.8)] pointer-events-none" style="transform: translateZ(80px)">
                <img src="https://illustrations.popsy.co/amber/freelancer.svg" class="w-full h-full object-contain filter hue-rotate-15" alt="3D character" />
            </div>

        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const foil = document.getElementById('foil');
        const shadow = document.getElementById('floor-shadow');

        let currentRotateX = 0;
        let currentRotateY = 0;
        let currentX = 0.5;
        let currentY = 0.5;

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            currentX = (e.clientX - rect.left) / rect.width;
            currentY = (e.clientY - rect.top) / rect.height;

            const rx = (currentY - 0.5) * -60; 
            const ry = (currentX - 0.5) * 60;
            
            card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
            foil.style.backgroundPosition = `${currentX * 100}% ${currentY * 100}%`;
            
            const sx = (currentX - 0.5) * -60;
            const sy = (currentY - 0.5) * -60;
            shadow.style.transform = `translate3d(${sx}px, ${sy}px, -100px)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            foil.style.backgroundPosition = `50% 50%`;
            shadow.style.transform = `translate3d(0px, 0px, -100px)`;
        });
    </script>
</body>
</html>
