<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>33 - 3D Conversion Pipeline Funnel</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%);
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .pipeline-hud {
      position: absolute;
      top: var(--space-6);
      left: var(--space-6);
      right: var(--space-6);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .hud-title {
      font-size: var(--text-xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
    }

    .hud-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cvr-badge {
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-xl);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      text-align: right;
      backdrop-filter: blur(16px);
      pointer-events: auto;
    }

    .cvr-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .cvr-val {
      font-size: var(--text-xl);
      font-weight: 800;
      color: var(--accent-base);
    }

    /* Stage Key Legend */
    .stage-legend {
      position: absolute;
      bottom: var(--space-6);
      left: var(--space-6);
      z-index: 10;
      display: flex;
      gap: var(--space-4);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="pipeline-hud">
      <div>
        <h1 class="hud-title">Conversion Pipeline</h1>
        <p class="hud-sub">Q4 2025 · Realtime Funnel Telemetry</p>
      </div>

      <div class="cvr-badge">
        <div class="cvr-label">Overall CVR</div>
        <div class="cvr-val">1.9%</div>
      </div>
    </div>

    <div id="canvas-container"></div>

    <div class="stage-legend">
      <div class="legend-item"><span class="legend-dot" style="background: #6366f1;"></span> Visitors (100%)</div>
      <div class="legend-item"><span class="legend-dot" style="background: #34d399;"></span> Signups (25%)</div>
      <div class="legend-item"><span class="legend-dot" style="background: #f59e0b;"></span> Active (7.5%)</div>
      <div class="legend-item"><span class="legend-dot" style="background: #ec4899;"></span> Paid (1.9%)</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
    camera.position.set(4, 4, 8);
    camera.lookAt(0, 1.5, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dl = new THREE.DirectionalLight(0x6366f1, 2);
    dl.position.set(5, 10, 5);
    scene.add(dl);

    const stages = [
      { height: 4.0, color: 0x6366f1, x: -3.0 },
      { height: 2.8, color: 0x34d399, x: -1.0 },
      { height: 1.6, color: 0xf59e0b, x: 1.0 },
      { height: 0.8, color: 0xec4899, x: 3.0 }
    ];

    const bars = stages.map((st) => {
      const geo = new THREE.BoxGeometry(1.2, st.height, 1.2);
      const mat = new THREE.MeshStandardMaterial({
        color: st.color,
        roughness: 0.2,
        metalness: 0.5,
        transparent: true,
        opacity: 0.9
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(st.x, st.height / 2, 0);
      scene.add(mesh);
      return mesh;
    });

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      camera.position.x += (4 + mouseX * 2 - camera.position.x) * 0.05;
      camera.position.y += (4 + mouseY * 2 - camera.position.y) * 0.05;
      camera.lookAt(0, 1.5, 0);

      bars.forEach((b, i) => {
        b.position.y = (stages[i].height / 2) + Math.sin(t * 2 + i) * 0.08;
      });

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const W2 = container.clientWidth, H2 = container.clientHeight;
      camera.aspect = W2 / H2;
      camera.updateProjectionMatrix();
      renderer.setSize(W2, H2);
    });
  </script>
</body>
</html>
