<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Shell Hex-Tunnel</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #010803;
            min-height: 100vh;
            overflow: hidden;
            color: #4ade80;
            font-family: var(--font-mono, monospace);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .terminal-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(1, 20, 8, 0.8);
            border: 1px solid rgba(74, 222, 128, 0.4);
            border-radius: 12px;
            padding: 16px 20px;
            backdrop-filter: blur(12px);
            z-index: 10;
            max-width: 440px;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.15);
            pointer-events: none;
        }

        .term-header {
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(74, 222, 128, 0.2);
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-size: 11px;
            color: #86efac;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .term-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .term-line {
            font-size: 12px;
            line-height: 1.6;
            color: #bbf7d0;
        }

        .term-highlight {
            color: #4ade80;
            font-weight: 700;
        }

        /* Controls Bottom Bar */
        .controls-bar {
            position: absolute;
            bottom: 24px;
            display: flex;
            gap: 12px;
            z-index: 20;
        }

        .btn-term {
            background: rgba(2, 44, 18, 0.9);
            border: 1px solid #22c55e;
            color: #4ade80;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: var(--font-mono, monospace);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-term:hover {
            background: #22c55e;
            color: #010803;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.6);
            transform: translateY(-2px);
        }

        .telemetry-right {
            position: absolute;
            bottom: 24px;
            right: 24px;
            font-family: var(--font-mono, monospace);
            font-size: 10px;
            color: #16a34a;
            z-index: 10;
            pointer-events: none;
            text-align: right;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="terminal-overlay">
        <div class="term-header">
            <span class="term-dot"></span>
            <span>Reverse Encrypted Vector · Session #0x9F4A</span>
        </div>
        <div class="term-line">> <span class="term-highlight">INITIATE_BREACH:</span> mTLS Proxy Cleared</div>
        <div class="term-line">> Route: [IPv6/Hex] 2001:db8:85a3::8a2e:370:7334</div>
        <div class="term-line">> Exfiltration Tunnel: <span class="term-highlight">ESTABLISHED (10 Gbps)</span></div>
        <div class="term-line">> Tap [WARP EXFILTRATION] to ignite hyper-speed FOV stretch</div>
    </div>

    <div class="controls-bar">
        <button class="btn-term" id="warp-btn">
            <span>⚡</span> WARP EXFILTRATION
        </button>
        <button class="btn-term" id="pulse-btn">
            <span>📡</span> FIREWALL PROBE
        </button>
    </div>

    <div class="telemetry-right">
        <div>PACKET FLUX: 1.48 TB/S</div>
        <div id="depth-readout">TUNNEL DEPTH: 1,420m</div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010803, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 0);

        // Procedural Hexagonal Wireframe Ring Corridor
        const RING_COUNT = 60;
        const RING_SPACING = 1.2;
        const rings = [];

        const hexGeo = new THREE.CylinderGeometry(2.5, 2.5, 0.1, 6, 1, true);
        const hexEdges = new THREE.EdgesGeometry(hexGeo);

        for (let i = 0; i < RING_COUNT; i++) {
            const mat = new THREE.LineBasicMaterial({
                color: i % 4 === 0 ? 0x4ade80 : 0x15803d,
                transparent: true,
                opacity: 0.8
            });
            const mesh = new THREE.LineSegments(hexEdges, mat);
            mesh.position.z = -i * RING_SPACING;
            mesh.rotation.x = Math.PI / 2;
            mesh.rotation.z = (i * 0.1);
            scene.add(mesh);
            rings.push(mesh);
        }

        // Particle Stream Corridor
        const PARTICLE_COUNT = 1500;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const theta = Math.random() * Math.PI * 2;
            const r = 0.5 + Math.random() * 2.0;
            pPos[i * 3] = Math.cos(theta) * r;
            pPos[i * 3 + 1] = Math.sin(theta) * r;
            pPos[i * 3 + 2] = -Math.random() * (RING_COUNT * RING_SPACING);
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({
            color: 0x86efac,
            size: 0.04,
            transparent: true,
            opacity: 0.7
        });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        let speed = 8.0;
        let targetSpeed = 8.0;
        let isWarping = false;

        document.getElementById('warp-btn').addEventListener('click', () => {
            isWarping = !isWarping;
            targetSpeed = isWarping ? 32.0 : 8.0;
            camera.fov = isWarping ? 85 : 60;
            camera.updateProjectionMatrix();
        });

        document.getElementById('pulse-btn').addEventListener('click', () => {
            rings.forEach(r => {
                r.material.color.setHex(0xffffff);
                setTimeout(() => r.material.color.setHex(0x4ade80), 300);
            });
        });

        // Mouse Steering
        let mouseX = 0;
        let mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        let totalDistance = 0;
        const depthReadout = document.getElementById('depth-readout');
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            speed += (targetSpeed - speed) * 0.05;
            totalDistance += speed * delta * 10;
            depthReadout.textContent = `TUNNEL DEPTH: ${Math.floor(totalDistance)}m`;

            // Camera subtle lag steer
            camera.position.x += (mouseX * 0.6 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.6 - camera.position.y) * 0.05;
            camera.rotation.z += 0.005;

            // Move rings toward camera and cycle to back
            const maxZ = RING_COUNT * RING_SPACING;
            rings.forEach(r => {
                r.position.z += speed * delta;
                if (r.position.z > 2.0) {
                    r.position.z -= maxZ;
                }
            });

            // Move particles
            const pArray = pGeo.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                pArray[i * 3 + 2] += speed * delta * 1.5;
                if (pArray[i * 3 + 2] > 2.0) {
                    pArray[i * 3 + 2] -= maxZ;
                }
            }
            pGeo.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
