<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>09 - Precision Chrono Showcase</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-8);
      perspective: 1200px;
    }

    /* Spatial Vault Card */
    .vault-card {
      position: relative;
      width: 100%;
      max-width: 380px;
      padding: var(--space-8);
      border-radius: var(--radius-2xl);
      background: linear-gradient(160deg, #182232, #0b111e);
      border: 1px solid var(--border-subtle);
      box-shadow:
        0 30px 60px -12px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      cursor: pointer;
      user-select: none;
    }

    /* Interactive Specular Glare */
    .vault-glare {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-2xl);
      background: radial-gradient(
        600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.08) 0%,
        transparent 60%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* Brand Header */
    .vault-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      transform: translateZ(20px);
    }

    .brand-title {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--accent-base);
    }

    .edition-tag {
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: var(--surface-overlay);
      color: var(--text-subtle);
      border: 1px solid var(--border-subtle);
    }

    /* Levitating Artifact Display */
    .artifact-stage {
      position: relative;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: var(--space-4) 0;
      transform-style: preserve-3d;
    }

    .artifact-shadow {
      position: absolute;
      bottom: 10px;
      width: 140px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      filter: blur(10px);
      transform: translateZ(0px) scale(var(--shadow-scale, 1));
      transition: transform 0.2s ease;
    }

    .artifact-graphic {
      width: 190px;
      height: 190px;
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.7));
      transform: translateZ(45px) rotate(var(--watch-rot, 0deg));
      transition: transform 0.2s ease-out, filter 0.3s ease;
      will-change: transform;
    }

    /* Product Info Section */
    .vault-info {
      transform: translateZ(25px);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .product-title {
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
    }

    .product-desc {
      font-size: var(--text-xs);
      color: var(--text-muted);
      line-height: var(--leading-relaxed);
    }

    /* Spec Grid */
    .spec-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-subtle);
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .spec-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: var(--tracking-wider);
      color: var(--text-subtle);
    }

    .spec-val {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-heading);
    }

    /* Color Variant Selector */
    .variant-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      transform: translateZ(30px);
      margin-top: var(--space-2);
    }

    .variant-chip {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .variant-chip.is-selected {
      border-color: #ffffff;
      transform: scale(1.2);
    }

    /* Footer CTA */
    .vault-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-6);
      transform: translateZ(30px);
    }

    .price-tag {
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--text-heading);
    }

    .price-currency {
      font-size: var(--text-xs);
      color: var(--accent-base);
      margin-right: 2px;
    }

    .buy-btn {
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--accent-base), #4f46e5);
      border: none;
      color: #ffffff;
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .buy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .buy-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="vault-card" id="vaultCard">
      <div class="vault-glare"></div>

      <div class="vault-header">
        <span class="brand-title">AERODYN · HOROLOGY</span>
        <span class="edition-tag">LIMITED 04/50</span>
      </div>

      <div class="artifact-stage">
        <div class="artifact-shadow" id="shadow"></div>
        <img
          class="artifact-graphic"
          id="artifactGraphic"
          src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop&auto=format&q=80"
          alt="Chronograph Timepiece"
          crossorigin="anonymous"
        />
      </div>

      <div class="vault-info">
        <h2 class="product-title">Chrono-Sprint Mark IV</h2>
        <p class="product-desc">Aerospace titanium enclosure with high-frequency mechanical tourbillon movement.</p>

        <div class="variant-row" role="radiogroup" aria-label="Select color finish">
          <button class="variant-chip is-selected" style="background: #3b82f6;" data-color="#3b82f6" aria-label="Electric Blue"></button>
          <button class="variant-chip" style="background: #eab308;" data-color="#eab308" aria-label="Imperial Gold"></button>
          <button class="variant-chip" style="background: #10b981;" data-color="#10b981" aria-label="Emerald Green"></button>
        </div>

        <div class="spec-grid">
          <div class="spec-item">
            <span class="spec-label">Caliber</span>
            <span class="spec-val">Cal. 900</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Depth</span>
            <span class="spec-val">300 M</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Power</span>
            <span class="spec-val">72 HRS</span>
          </div>
        </div>
      </div>

      <div class="vault-footer">
        <div class="price-tag"><span class="price-currency">$</span>14,800</div>
        <button class="buy-btn" id="buyBtn">Reserve Edition</button>
      </div>
    </div>
  </div>

  <script>
    const vaultCard = document.getElementById('vaultCard');
    const artifactGraphic = document.getElementById('artifactGraphic');
    const shadow = document.getElementById('shadow');
    const variantChips = document.querySelectorAll('.variant-chip');

    // 3D Mouse Parallax Tracking
    vaultCard.addEventListener('mousemove', (e) => {
      const rect = vaultCard.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotX = ((y - centerY) / centerY) * -12;
      const rotY = ((x - centerX) / centerX) * 12;

      vaultCard.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(-6px)`;
      vaultCard.style.setProperty('--mouse-x', `${(x / rect.width) * 100}%`);
      vaultCard.style.setProperty('--mouse-y', `${(y / rect.height) * 100}%`);

      artifactGraphic.style.transform = `translateZ(55px) translateX(${(x - centerX) * 0.08}px) translateY(${(y - centerY) * 0.08}px)`;
      shadow.style.transform = `translateZ(0px) scale(${1 + Math.abs(rotX) * 0.02})`;
    });

    vaultCard.addEventListener('mouseleave', () => {
      vaultCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
      artifactGraphic.style.transform = 'translateZ(45px) translateX(0px) translateY(0px)';
      shadow.style.transform = 'translateZ(0px) scale(1)';
    });

    // Variant Selection
    variantChips.forEach((chip) => {
      chip.addEventListener('click', () => {
        variantChips.forEach((c) => c.classList.remove('is-selected'));
        chip.classList.add('is-selected');

        const newAccent = chip.dataset.color;
        document.documentElement.style.setProperty('--accent-base', newAccent);
      });
    });

    document.getElementById('buyBtn').addEventListener('click', () => {
      alert('Reservation registered for Aerodyn Chrono-Sprint Mark IV.');
    });
  </script>
</body>
</html>
