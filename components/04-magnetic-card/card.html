<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Holographic Card</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        .stage {
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* The magnetic field container */
        .magnetic-area {
            padding: var(--space-12);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Card Frame */
        .card {
            position: relative;
            width: 340px;
            height: 220px;
            border-radius: var(--radius-xl);
            transform-style: preserve-3d;
            /* Glassy Material */
            background: linear-gradient(135deg, 
                oklch(95% 0.01 var(--hue-base) / 0.1), 
                oklch(95% 0.01 var(--hue-base) / 0.02)
            );
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.4),
                inset 0 1px 1px rgba(255,255,255,0.1);
            
            /* Spring physics for magnetic pull and return */
            transition: transform var(--time-base) var(--ease-out),
                        box-shadow var(--time-base) var(--ease-out);
            cursor: grab;
        }
        
        .card:active {
            cursor: grabbing;
        }

        /* Interactive glare overlay */
        .card-glare {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(
                800px circle at var(--mx, 50%) var(--my, 50%), 
                rgba(255,255,255,0.15) 0%, 
                transparent 40%
            );
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--time-base) var(--ease-out);
            mix-blend-mode: overlay;
        }

        .magnetic-area:hover .card-glare {
            opacity: 1;
        }

        /* Parallax layers */
        .card-layer {
            position: absolute;
            inset: 0;
            padding: var(--space-6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Depth Layer 1: Background geometric foil */
        .layer-bg {
            transform: translateZ(10px);
        }
        
        .geometric-foil {
            position: absolute;
            right: -20px;
            bottom: -40px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg at 50% 50%,
                var(--accent-base) 0deg,
                var(--info) 90deg,
                var(--accent-active) 180deg,
                var(--info) 270deg,
                var(--accent-base) 360deg
            );
            filter: blur(40px);
            opacity: 0.3;
        }

        /* Depth Layer 2: Chip and Brand */
        .layer-mid {
            transform: translateZ(30px);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .chip {
            width: 44px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--text-tertiary), var(--text-muted));
            border: 1px solid var(--border-subtle);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            /* Engraved lines */
            background-image: 
                linear-gradient(rgba(0,0,0,0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.2) 1px, transparent 1px);
            background-size: 14px 10px;
        }

        .brand {
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: 0.2em;
            color: var(--text-primary);
        }

        /* Depth Layer 3: Typography */
        .layer-front {
            transform: translateZ(50px);
            justify-content: flex-end;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        .card-number {
            font-size: var(--text-xl);
            font-family: var(--font-mono);
            letter-spacing: 0.1em;
            color: var(--text-primary);
            margin-bottom: var(--space-4);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: var(--text-xs);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

    </style>
</head>
<body>
    <div class="stage">
        <!-- The magnetic area captures mouse movement before touching the card -->
        <div class="magnetic-area" id="magneticArea">
            <div class="card" id="card">
                <div class="card-glare" id="glare"></div>
                
                <div class="card-layer layer-bg">
                    <div class="geometric-foil"></div>
                </div>
                
                <div class="card-layer layer-mid">
                    <div class="chip"></div>
                    <div class="brand">NEXUS</div>
                </div>

                <div class="card-layer layer-front">
                    <div class="card-number">4532  ••••  ••••  8901</div>
                    <div class="card-footer">
                        <span>Holo Pass</span>
                        <span>09/28</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const area = document.getElementById('magneticArea');
        const card = document.getElementById('card');
        const glare = document.getElementById('glare');
        
        // Physical bounds and constraints
        const MAX_TILT = 20; // degrees
        const PULL_STRENGTH = 15; // px translation

        function updateMagneticField(e) {
            const rect = area.getBoundingClientRect();
            const cardRect = card.getBoundingClientRect();
            
            // Mouse position relative to the tracking area
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Normalized coordinates (-1 to 1)
            const normX = (x / rect.width) * 2 - 1;
            const normY = (y / rect.height) * 2 - 1;
            
            // Calculate tilt (inversed for natural feel)
            const tiltX = normY * -MAX_TILT;
            const tiltY = normX * MAX_TILT;
            
            // Calculate magnetic pull translation
            const pullX = normX * PULL_STRENGTH;
            const pullY = normY * PULL_STRENGTH;

            // Apply transform dynamically with 0 transition for instant tracking
            card.style.transition = 'none';
            card.style.transform = `translate3d(${pullX}px, ${pullY}px, 20px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
            
            // Update Glare overlay based on mouse position over the card
            // We map the mouse position to the card's local space
            const glareX = e.clientX - cardRect.left;
            const glareY = e.clientY - cardRect.top;
            glare.style.setProperty('--mx', `${glareX}px`);
            glare.style.setProperty('--my', `${glareY}px`);
        }

        function resetMagneticField() {
            // Restore CSS transition for smooth spring back
            card.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            card.style.transform = `translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg)`;
        }

        area.addEventListener('mousemove', updateMagneticField);
        area.addEventListener('mouseleave', resetMagneticField);
        
        // Interaction on press
        card.addEventListener('mousedown', () => {
            card.style.transition = 'transform 0.2s var(--ease-out)';
            // Push card in physically
            const currentTransform = card.style.transform;
            card.style.transform = currentTransform.replace('20px', '-20px').replace(/scale\([^\)]*\)/, '') + ' scale(0.95)';
        });
        
        window.addEventListener('mouseup', () => {
            card.style.transition = 'transform 0.4s var(--ease-spring)';
            const currentTransform = card.style.transform;
            card.style.transform = currentTransform.replace('-20px', '20px').replace('scale(0.95)', '');
        });
    </script>
</body>
</html>
