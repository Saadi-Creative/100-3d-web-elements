<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Broken Link 404</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #030712; min-height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100%; height: 100vh; cursor: crosshair; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="absolute top-10 w-full text-center z-10 pointer-events-none">
        <h1 class="text-xl font-bold text-slate-500 uppercase tracking-[0.5em]">Connection Severed</h1>
    </div>
    
    <div id="canvas-container"></div>
    
    <div class="absolute bottom-10 w-full text-center z-10 pointer-events-none">
        <p class="text-slate-600 font-medium">Move your mouse to try and align the broken link.</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        const container = document.getElementById('canvas-container');
        let mouseX = 0;
        let mouseY = 0;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#030712');
        scene.fog = new THREE.Fog('#030712', 10, 30);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 12;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight('#38bdf8', 1.5);
        dirLight1.position.set(10, 10, 5);
        dirLight1.castShadow = true;
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight('#f43f5e', 2);
        dirLight2.position.set(-10, -5, -5);
        scene.add(dirLight2);

        // Floor for shadow
        const planeGeometry = new THREE.PlaneGeometry(100, 100);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.4 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -5;
        plane.receiveShadow = true;
        scene.add(plane);

        const pieces = [];

        // Load font and create pieces
        const loader = new FontLoader();
        // Standard helvetiker font from three.js examples
        loader.load('https://unpkg.com/three@0.154.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            
            const createPiece = (char, posX, posY, posZ, rotX, rotY, rotZ, index) => {
                const group = new THREE.Group();
                group.position.set(posX, posY, posZ);
                
                // Base cylinder
                const cylGeo = new THREE.CylinderGeometry(0.8, 0.8, 3, 32);
                const matBase = new THREE.MeshStandardMaterial({
                    color: '#1e293b',
                    roughness: 0.2,
                    metalness: 0.9,
                });
                const mesh = new THREE.Mesh(cylGeo, matBase);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);
                
                const dodGeo = new THREE.DodecahedronGeometry(0.8, 1);
                const matDod = new THREE.MeshStandardMaterial({ color: '#0f172a', roughness: 0.5, metalness: 0.5 });
                
                const dodTop = new THREE.Mesh(dodGeo, matDod);
                dodTop.position.set(0, 1.5, 0);
                dodTop.rotation.set(Math.random(), Math.random(), 0);
                group.add(dodTop);
                
                const dodBot = new THREE.Mesh(dodGeo, matDod);
                dodBot.position.set(0, -1.5, 0);
                dodBot.rotation.set(Math.random(), Math.random(), 0);
                group.add(dodBot);

                // Text
                const textGeo = new TextGeometry(char, {
                    font: font,
                    size: 1.8,
                    height: 0.2,
                });
                textGeo.computeBoundingBox();
                const centerOffset = - 0.5 * ( textGeo.boundingBox.max.x - textGeo.boundingBox.min.x );
                
                const textMat = new THREE.MeshStandardMaterial({ color: '#ef4444' });
                const textMesh = new THREE.Mesh(textGeo, textMat);
                textMesh.position.set(centerOffset, -0.6, 0.85);
                group.add(textMesh);
                
                scene.add(group);
                
                pieces.push({
                    mesh: group,
                    index: index,
                    basePos: new THREE.Vector3(posX, posY, posZ),
                    baseRot: new THREE.Vector3(rotX, rotY, rotZ)
                });
            };

            createPiece("4", -3, 0, 0, 0, 0, 0.2, 1);
            createPiece("0", 0, 0, 0, 0, 0, -0.1, 2);
            createPiece("4", 3, 0, 0, 0, 0, 0.3, 3);
        });

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const t = clock.getElapsedTime();
            const distanceToCenter = Math.sqrt(mouseX * mouseX + mouseY * mouseY);
            const brokenForce = distanceToCenter * 4;

            pieces.forEach(p => {
                const targetX = p.basePos.x + mouseX * 3 + Math.sin(t + p.index) * brokenForce;
                const targetY = p.basePos.y + mouseY * 3 + Math.cos(t + p.index) * brokenForce;
                const targetZ = p.basePos.z + Math.sin(t * 1.5 + p.index) * brokenForce;

                p.mesh.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.03);

                const rX = p.baseRot.x + mouseY * Math.PI + Math.sin(t) * brokenForce * 0.5;
                const rY = p.baseRot.y + mouseX * Math.PI + Math.cos(t) * brokenForce * 0.5;
                const rZ = p.baseRot.z + brokenForce * 0.2;

                p.mesh.rotation.x = THREE.MathUtils.lerp(p.mesh.rotation.x, rX, 0.02);
                p.mesh.rotation.y = THREE.MathUtils.lerp(p.mesh.rotation.y, rY, 0.02);
                p.mesh.rotation.z = THREE.MathUtils.lerp(p.mesh.rotation.z, rZ, 0.02);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
