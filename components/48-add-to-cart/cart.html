<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spatial Add to Cart Launcher</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        body {
            background: radial-gradient(circle at center, #101426 0%, #05070e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            perspective: 1200px;
            gap: 40px;
        }

        .product-card {
            position: relative;
            width: 340px;
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform-style: preserve-3d;
        }

        .product-visual {
            position: relative;
            height: 140px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.9));
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 3D Holographic Cube Token */
        .token-cube {
            width: 50px;
            height: 50px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(25deg) rotateY(45deg);
            animation: float-spin 6s infinite linear;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        @keyframes float-spin {
            0% { transform: rotateX(25deg) rotateY(0deg); }
            100% { transform: rotateX(25deg) rotateY(360deg); }
        }

        .cube-face {
            position: absolute;
            inset: 0;
            background: rgba(56, 189, 248, 0.3);
            border: 1.5px solid #38bdf8;
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .cube-face.front  { transform: translateZ(25px); }
        .cube-face.back   { transform: rotateY(180deg) translateZ(25px); }
        .cube-face.right  { transform: rotateY(90deg) translateZ(25px); }
        .cube-face.left   { transform: rotateY(-90deg) translateZ(25px); }
        .cube-face.top    { transform: rotateX(90deg) translateZ(25px); }
        .cube-face.bottom { transform: rotateX(-90deg) translateZ(25px); }

        .product-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            color: #f8fafc;
        }

        .product-price {
            font-size: 17px;
            font-weight: 700;
            font-family: var(--font-mono, monospace);
            color: #38bdf8;
        }

        /* 3D Cart Launcher Actuator Button */
        .cart-btn {
            position: relative;
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 
                0 10px 25px rgba(2, 132, 199, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        .cart-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 
                0 15px 35px rgba(2, 132, 199, 0.6),
                0 0 20px rgba(56, 189, 248, 0.4);
        }

        .cart-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .cart-icon {
            font-size: 16px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Flight Parabolic Projectile */
        .flying-projectile {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: #38bdf8;
            box-shadow: 0 0 20px #38bdf8;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Top Nav Cart Vault */
        .vault-pill {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(18, 24, 38, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            padding: 8px 18px;
            border-radius: 9999px;
            color: #f1f5f9;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .vault-badge {
            background: #38bdf8;
            color: #04060a;
            font-size: 11px;
            font-family: var(--font-mono, monospace);
            padding: 2px 7px;
            border-radius: 9999px;
            font-weight: 700;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .vault-pill.bump {
            transform: scale(1.15);
        }
        .vault-pill.bump .vault-badge {
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div class="vault-pill" id="vault">
        <span>🛒 Cart Vault</span>
        <span class="vault-badge" id="cart-count">0</span>
    </div>

    <div class="product-card" id="card">
        <div class="product-visual">
            <div class="token-cube" id="cube">
                <div class="cube-face front"></div>
                <div class="cube-face back"></div>
                <div class="cube-face right"></div>
                <div class="cube-face left"></div>
                <div class="cube-face top"></div>
                <div class="cube-face bottom"></div>
            </div>
        </div>

        <div class="product-info">
            <div>
                <div class="product-title">Quantum Neural Node</div>
                <div style="font-size: 11px; color: #64748b; font-family: var(--font-mono, monospace);">128-Qubit Crystal Matrix</div>
            </div>
            <div class="product-price">$499</div>
        </div>

        <button class="cart-btn" id="btn-add">
            <span class="cart-icon" id="cart-icon">🛒</span>
            <span id="btn-label">Deploy to Vault</span>
        </button>
    </div>

    <div class="flying-projectile" id="projectile"></div>

    <script>
        const btnAdd = document.getElementById('btn-add');
        const cartCount = document.getElementById('cart-count');
        const vault = document.getElementById('vault');
        const projectile = document.getElementById('projectile');
        const btnLabel = document.getElementById('btn-label');
        const cartIcon = document.getElementById('cart-icon');

        let count = 0;
        let isAnimating = false;

        btnAdd.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;

            const btnRect = btnAdd.getBoundingClientRect();
            const vaultRect = vault.getBoundingClientRect();

            // Set projectile start position
            projectile.style.transition = 'none';
            projectile.style.opacity = '1';
            projectile.style.transform = `translate3d(${btnRect.left + btnRect.width / 2}px, ${btnRect.top}px, 0) scale(1)`;

            btnLabel.textContent = 'Launching...';
            cartIcon.textContent = '🚀';

            setTimeout(() => {
                // Parabolic trajectory to cart vault in top right
                projectile.style.transition = 'transform 0.6s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.6s ease';
                projectile.style.transform = `translate3d(${vaultRect.left + 20}px, ${vaultRect.top + 10}px, 0) scale(0.3)`;
                projectile.style.opacity = '0';
            }, 30);

            setTimeout(() => {
                count++;
                cartCount.textContent = count;
                vault.classList.add('bump');
                btnLabel.textContent = '✓ Deployed!';
                cartIcon.textContent = '✨';

                setTimeout(() => vault.classList.remove('bump'), 300);

                setTimeout(() => {
                    btnLabel.textContent = 'Deploy to Vault';
                    cartIcon.textContent = '🛒';
                    isAnimating = false;
                }, 1200);
            }, 650);
        });
    </script>
</body>
</html>
