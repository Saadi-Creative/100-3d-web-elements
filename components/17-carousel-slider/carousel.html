<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>17 - Prismatic 3D Rotor Gallery Deck</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      perspective: 1200px;
      user-select: none;
      overflow: hidden;
    }

    .carousel-header {
      text-align: center;
      margin-bottom: var(--space-6);
      z-index: 5;
    }

    .carousel-title {
      font-size: var(--text-2xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
    }

    .carousel-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      margin-top: var(--space-2);
    }

    /* 3D Rotor Stage */
    .rotor-stage {
      position: relative;
      width: 100%;
      max-width: 580px;
      height: 320px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-item {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 240px;
      height: 280px;
      margin-top: -140px;
      margin-left: -120px;
      border-radius: var(--radius-2xl);
      overflow: hidden;
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-2xl);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: all 0.5s ease;
      backface-visibility: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, transparent 60%);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card-item.is-active {
      border-color: rgba(99, 102, 241, 0.6);
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
    }

    .card-item.is-active .card-overlay {
      opacity: 1;
    }

    .card-label {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--text-heading);
    }

    .card-desc {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-top: var(--space-8);
      z-index: 5;
    }

    .nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-heading);
      font-size: var(--text-lg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      border-color: var(--accent-base);
      color: var(--accent-base);
      transform: scale(1.08);
    }

    .dots-track {
      display: flex;
      gap: var(--space-2);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--surface-overlay);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.is-active {
      width: 24px;
      border-radius: var(--radius-full);
      background: var(--accent-base);
      border-color: var(--accent-base);
      box-shadow: 0 0 10px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="carousel-header">
      <h1 class="carousel-title">Spatial Rotor Deck</h1>
      <p class="carousel-sub">Cylindrical 3D Gallery View</p>
    </div>

    <div class="rotor-stage" id="rotorStage"></div>

    <div class="controls-bar">
      <button class="nav-btn" id="prevBtn" aria-label="Previous slide">‹</button>
      <div class="dots-track" id="dotsTrack"></div>
      <button class="nav-btn" id="nextBtn" aria-label="Next slide">›</button>
    </div>
  </div>

  <script>
    const items = [
      { img: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=800&fit=crop&q=90&auto=format', title: 'Alpine Peaks', desc: 'Switzerland' },
      { img: 'https://images.unsplash.com/photo-1448375240586-882707db888b?w=800&h=800&fit=crop&q=90&auto=format', title: 'Forest Mist', desc: 'Oregon, USA' },
      { img: 'https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=800&h=800&fit=crop&q=90&auto=format', title: 'Desert Dunes', desc: 'Sahara' },
      { img: 'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=800&h=800&fit=crop&q=90&auto=format', title: 'Ocean Vista', desc: 'Pacific' },
      { img: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=800&h=800&fit=crop&q=90&auto=format', title: 'Northern Lights', desc: 'Iceland' }
    ];

    const stage = document.getElementById('rotorStage');
    const dotsTrack = document.getElementById('dotsTrack');
    const radius = 280;
    let currentIndex = 0;

    const cards = items.map((item, i) => {
      const card = document.createElement('div');
      card.className = 'card-item';
      card.innerHTML = `
        <img class="card-img" src="${item.img}" alt="${item.title}" crossorigin="anonymous" />
        <div class="card-overlay">
          <div class="card-label">${item.title}</div>
          <div class="card-desc">${item.desc}</div>
        </div>
      `;
      card.addEventListener('click', () => selectIndex(i));
      stage.appendChild(card);
      return card;
    });

    const dots = items.map((_, i) => {
      const dot = document.createElement('div');
      dot.className = `dot ${i === 0 ? 'is-active' : ''}`;
      dot.addEventListener('click', () => selectIndex(i));
      dotsTrack.appendChild(dot);
      return dot;
    });

    function updateRotor() {
      const angleStep = 360 / items.length;

      cards.forEach((card, i) => {
        const angle = angleStep * i;
        let diff = ((i - currentIndex) % items.length + items.length) % items.length;
        if (diff > items.length / 2) diff -= items.length;

        const distance = Math.abs(diff);
        const scale = Math.max(0.7, 1 - distance * 0.15);
        const opacity = Math.max(0.2, 1 - distance * 0.35);

        card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px) scale(${scale})`;
        card.style.opacity = opacity;
        card.classList.toggle('is-active', i === currentIndex);
      });

      stage.style.transform = `rotateY(${-currentIndex * angleStep}deg)`;

      dots.forEach((dot, i) => dot.classList.toggle('is-active', i === currentIndex));
    }

    function selectIndex(idx) {
      currentIndex = ((idx % items.length) + items.length) % items.length;
      updateRotor();
    }

    document.getElementById('prevBtn').addEventListener('click', () => selectIndex(currentIndex - 1));
    document.getElementById('nextBtn').addEventListener('click', () => selectIndex(currentIndex + 1));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') selectIndex(currentIndex - 1);
      if (e.key === 'ArrowRight') selectIndex(currentIndex + 1);
    });

    updateRotor();
  </script>
</body>
</html>
