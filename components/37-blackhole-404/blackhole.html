<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Event Horizon Gravitational Lens</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000003;
            min-height: 100vh;
            overflow: hidden;
            color: white;
            font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, sans-serif);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hud-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
            padding: 24px;
        }

        .hud-warning {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 6px 16px;
            border-radius: 9999px;
            font-family: var(--font-mono, monospace);
            font-size: 11px;
            color: #f87171;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
            animation: pulse-border 2s infinite ease-in-out;
        }

        @keyframes pulse-border {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        .hero-code {
            font-size: clamp(72px, 16vw, 130px);
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.4) 70%, transparent 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.3);
            margin-bottom: 8px;
            position: relative;
        }

        .hero-sub {
            font-size: 18px;
            font-weight: 500;
            color: #cbd5e1;
            max-width: 440px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .hero-desc {
            font-size: 13px;
            font-family: var(--font-mono, monospace);
            color: #64748b;
            max-width: 380px;
            margin-bottom: 32px;
        }

        .hud-actions {
            pointer-events: auto;
            display: flex;
            gap: 14px;
        }

        .btn-action {
            background: #ffffff;
            color: #05070a;
            font-size: 13px;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 9999px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.8);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            box-shadow: none;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .telemetry-corners {
            position: absolute;
            inset: 20px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: var(--font-mono, monospace);
            font-size: 10px;
            color: #475569;
            z-index: 15;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="hud-overlay">
        <div class="hud-warning">
            <span>⚠️</span> Gravitational Singularity
        </div>
        <h1 class="hero-code">404</h1>
        <p class="hero-sub">Coordinate Trapped in Event Horizon</p>
        <p class="hero-desc">The requested URI has slipped beyond Schwarzschild radius (r &lt; 2GM/c²). Photons unable to escape.</p>
        <div class="hud-actions">
            <button class="btn-action" id="warp-btn">
                <span>🚀</span> Warp to Safety
            </button>
            <button class="btn-action btn-ghost" id="pulse-btn">
                <span>💥</span> Inject Tetryon Pulse
            </button>
        </div>
    </div>

    <div class="telemetry-corners">
        <div>SINGULARITY: SAGITTARIUS A* CLUSTER</div>
        <div id="grav-readout">CURVATURE: 9.84 × 10⁸ m⁻²</div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3.5, 9);
        camera.lookAt(0, 0, 0);

        // Black hole core (Pitch black event horizon sphere)
        const coreGeo = new THREE.SphereGeometry(1.2, 64, 64);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        // Photon Sphere / Gravitational Lensing Glow Ring
        const photonGeo = new THREE.RingGeometry(1.2, 1.45, 64);
        const photonMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;
                void main() {
                    float dist = length(vUv - 0.5) * 2.0;
                    float glow = smoothstep(0.0, 1.0, 1.0 - abs(dist - 0.8) * 4.0);
                    vec3 col = mix(vec3(0.3, 0.7, 1.0), vec3(1.0, 0.4, 0.1), sin(uTime * 2.0) * 0.5 + 0.5);
                    gl_FragColor = vec4(col, glow * 0.9);
                }
            `,
            side: THREE.DoubleSide,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const photonRing = new THREE.Mesh(photonGeo, photonMat);
        scene.add(photonRing);

        // Relativistic Accretion Disk Particles
        const PARTICLE_COUNT = 25000;
        const posArray = new Float32Array(PARTICLE_COUNT * 3);
        const colArray = new Float32Array(PARTICLE_COUNT * 3);
        const speedArray = new Float32Array(PARTICLE_COUNT);
        const radiusArray = new Float32Array(PARTICLE_COUNT);

        const colorInner = new THREE.Color(0x38bdf8); // Cyan blue
        const colorMid = new THREE.Color(0xf59e0b);   // Amber orange
        const colorOuter = new THREE.Color(0xec4899); // Magenta pink

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const r = 1.35 + Math.pow(Math.random(), 2) * 5.0; // Dense near horizon
            const theta = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * (0.25 / (r * 0.5));

            posArray[i * 3] = Math.cos(theta) * r;
            posArray[i * 3 + 1] = y;
            posArray[i * 3 + 2] = Math.sin(theta) * r;

            radiusArray[i] = r;
            // Keplerian orbital velocity v ~ 1 / sqrt(r)
            speedArray[i] = 0.8 / Math.sqrt(r);

            // Interpolate color based on temperature / radius
            const t = (r - 1.35) / 5.0;
            let pCol = new THREE.Color();
            if (t < 0.3) {
                pCol.lerpColors(colorInner, colorMid, t / 0.3);
            } else {
                pCol.lerpColors(colorMid, colorOuter, (t - 0.3) / 0.7);
            }

            colArray[i * 3] = pCol.r;
            colArray[i * 3 + 1] = pCol.g;
            colArray[i * 3 + 2] = pCol.b;
        }

        const particleGeo = new THREE.BufferGeometry();
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colArray, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 0.035,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const accretionDisk = new THREE.Points(particleGeo, particleMat);
        scene.add(accretionDisk);

        // Interactive mouse gravity tracking
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth - 0.5) * 2;
            targetY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        // Pulse injection animation
        let pulseTime = 0;
        document.getElementById('pulse-btn').addEventListener('click', () => {
            pulseTime = 1.0;
        });

        document.getElementById('warp-btn').addEventListener('click', () => {
            camera.position.z = 1.0;
            setTimeout(() => {
                camera.position.set(0, 3.5, 9);
            }, 800);
        });

        const gravReadout = document.getElementById('grav-readout');

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            mouseX += (targetX - mouseX) * 0.05;
            mouseY += (targetY - mouseY) * 0.05;

            // Camera tilt responding to gravity well
            camera.position.x = mouseX * 2.5;
            camera.position.y = 3.5 - mouseY * 1.5;
            camera.lookAt(0, 0, 0);

            photonRing.lookAt(camera.position);
            photonMat.uniforms.uTime.value = time;

            // Rotate particles along accretion disk orbits
            const positions = particleGeo.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const r = radiusArray[i];
                const spd = speedArray[i] * (1.0 + pulseTime * 3.0);
                const idx = i * 3;

                let angle = Math.atan2(positions[idx + 2], positions[idx]);
                angle += spd * delta * 2.0;

                positions[idx] = Math.cos(angle) * r;
                positions[idx + 2] = Math.sin(angle) * r;
            }
            particleGeo.attributes.position.needsUpdate = true;

            if (pulseTime > 0) {
                pulseTime = Math.max(0, pulseTime - delta * 1.5);
                particleMat.size = 0.035 + pulseTime * 0.05;
            }

            // Real-time telemetry noise
            gravReadout.textContent = `CURVATURE: ${(9.84 + Math.sin(time * 3) * 0.12).toFixed(2)} × 10⁸ m⁻²`;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
