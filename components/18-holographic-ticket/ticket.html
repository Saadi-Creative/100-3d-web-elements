<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>18 - Spatial Holographic Access Pass</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      perspective: 1000px;
      user-select: none;
    }

    /* Spatial Ticket Stage */
    .ticket-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      border-radius: var(--radius-2xl);
      background: linear-gradient(160deg, #1e1b4b, #0f172a);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-2xl);
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      overflow: hidden;
      cursor: pointer;
    }

    /* Holographic Iridescent Spectrum Overlay */
    .holo-layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(239, 68, 68, 0.4) 0%,
        rgba(245, 158, 11, 0.4) 20%,
        rgba(16, 185, 129, 0.4) 40%,
        rgba(6, 182, 212, 0.4) 60%,
        rgba(99, 102, 241, 0.4) 80%,
        rgba(236, 72, 153, 0.4) 100%
      );
      background-size: 300% 300%;
      mix-blend-mode: color-dodge;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    .ticket-card:hover .holo-layer {
      opacity: 0.45;
    }

    /* Ticket Header */
    .ticket-header {
      padding: var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transform: translateZ(20px);
    }

    .pass-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-base);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .qr-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background: #ffffff;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
    }

    .qr-pixel {
      background: #0f172a;
      border-radius: 1px;
    }

    /* Event Title */
    .ticket-body {
      padding: 0 var(--space-6);
      transform: translateZ(30px);
    }

    .event-title {
      font-size: var(--text-2xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
    }

    /* Perforated Divider */
    .ticket-divider {
      margin: var(--space-6) 0;
      display: flex;
      align-items: center;
      position: relative;
    }

    .notch-left, .notch-right {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #020617;
      top: 50%;
      transform: translateY(-50%);
    }

    .notch-left { left: -10px; }
    .notch-right { right: -10px; }

    .dash-line {
      width: 100%;
      height: 1px;
      border-top: 2px dashed rgba(255, 255, 255, 0.15);
    }

    /* Grid Details */
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
      padding: 0 var(--space-6);
      transform: translateZ(20px);
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: var(--tracking-wider);
      color: var(--text-subtle);
    }

    .detail-val {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-heading);
    }

    /* Barcode Footer */
    .ticket-footer {
      padding: var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-subtle);
      margin-top: var(--space-6);
      transform: translateZ(25px);
    }

    .seat-num {
      font-size: var(--text-lg);
      font-weight: 800;
      color: var(--text-heading);
    }

    .barcode-strip {
      display: flex;
      gap: 3px;
      height: 32px;
      align-items: center;
    }

    .bar {
      width: 2px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 1px;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="ticket-card" id="ticketCard">
      <div class="holo-layer" id="holoLayer"></div>

      <div class="ticket-header">
        <span class="pass-badge">VIP VIP ACCESS</span>
        <div class="qr-box" id="qrBox"></div>
      </div>

      <div class="ticket-body">
        <h2 class="event-title">Cybernetic Summit 2026</h2>
      </div>

      <div class="ticket-divider">
        <div class="notch-left"></div>
        <div class="dash-line"></div>
        <div class="notch-right"></div>
      </div>

      <div class="detail-grid">
        <div class="detail-item">
          <span class="detail-label">Date</span>
          <span class="detail-val">OCT 24</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Time</span>
          <span class="detail-val">09:00</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Zone</span>
          <span class="detail-val">DELTA</span>
        </div>
      </div>

      <div class="ticket-footer">
        <div>
          <div class="detail-label">Gate / Seat</div>
          <div class="seat-num">G-04 · 12B</div>
        </div>

        <div class="barcode-strip" id="barcode"></div>
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('ticketCard');
    const holo = document.getElementById('holoLayer');

    // Generate QR pixels
    const qrBox = document.getElementById('qrBox');
    for (let i = 0; i < 16; i++) {
      const px = document.createElement('div');
      px.className = 'qr-pixel';
      px.style.opacity = Math.random() > 0.3 ? '1' : '0.1';
      qrBox.appendChild(px);
    }

    // Generate Barcode
    const barcode = document.getElementById('barcode');
    for (let i = 0; i < 16; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = `${16 + Math.random() * 16}px`;
      barcode.appendChild(bar);
    }

    // Parallax & Holographic Spectrum Shift
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const rotX = ((y - rect.height / 2) / (rect.height / 2)) * -14;
      const rotY = ((x - rect.width / 2) / (rect.width / 2)) * 14;

      card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(-4px)`;
      holo.style.backgroundPosition = `${(x / rect.width) * 100}% ${(y / rect.height) * 100}%`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
    });
  </script>
</body>
</html>
