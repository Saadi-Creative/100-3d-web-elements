<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Switch Button</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        /* Mechanical Switch Metaphor */
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-6);
            perspective: 1200px;
        }

        .switch-assembly {
            position: relative;
            width: 160px;
            height: 160px;
            transform-style: preserve-3d;
            /* Base tilt for 2.5D look */
            transform: rotateX(25deg) rotateZ(0deg);
            transition: transform var(--time-slow) var(--ease-out);
        }

        .switch-assembly:hover {
            transform: rotateX(15deg) rotateZ(0deg);
        }

        /* The Base Plinth */
        .switch-base {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            top: 40px;
            background: var(--surface-base);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-strong);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.5),
                inset 0 1px 1px rgba(255,255,255,0.05);
            transform: translateZ(-20px);
        }

        /* The Keycap Container */
        .keycap-container {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            transition: transform var(--time-fast) var(--ease-spring);
        }

        /* The Keycap Surface */
        .keycap {
            position: absolute;
            inset: 10px;
            border-radius: var(--radius-lg);
            background: linear-gradient(145deg, var(--bg-elevated), var(--bg-primary));
            border: 1px solid var(--border-subtle);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            font-weight: 600;
            font-size: var(--text-lg);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            user-select: none;
            
            /* Physical thickness using multiple box-shadows */
            box-shadow: 
                0 4px 0 var(--border-strong),
                0 8px 0 oklch(10% 0.01 var(--hue-base)),
                0 15px 25px rgba(0,0,0,0.4),
                inset 0 1px 1px rgba(255,255,255,0.1);

            transition: all var(--time-fast) var(--ease-spring);
        }

        /* The internal LED Indicator */
        .led-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--surface-elevated);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
            transition: all var(--time-fast) var(--ease-out);
        }

        /* Interaction States */
        .keycap-container:hover .keycap {
            background: linear-gradient(145deg, var(--surface-interactive), var(--bg-elevated));
            box-shadow: 
                0 4px 0 var(--border-strong),
                0 8px 0 oklch(10% 0.01 var(--hue-base)),
                0 20px 35px rgba(0,0,0,0.5),
                inset 0 1px 1px rgba(255,255,255,0.15);
        }

        .switch-assembly.active .keycap-container {
            transform: translateZ(-15px) translateY(8px);
        }

        .switch-assembly.active .keycap {
            box-shadow: 
                0 0px 0 var(--border-strong),
                0 0px 0 oklch(10% 0.01 var(--hue-base)),
                0 5px 10px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(0,0,0,0.4);
            color: var(--text-muted);
        }

        .switch-assembly.active .led-indicator {
            background-color: var(--accent-base);
            box-shadow: 
                0 0 10px var(--accent-base),
                0 0 20px var(--accent-base);
        }

        /* Pointer Light Reflection Overlay */
        .glare {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--time-base) var(--ease-out);
        }

        .keycap-container:hover .glare {
            opacity: 1;
        }

        .status {
            font-size: var(--text-sm);
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="switch-assembly" id="assembly">
            <div class="switch-base"></div>
            <div class="keycap-container" id="keycapWrapper">
                <div class="keycap" role="button" tabindex="0" id="button" aria-pressed="false">
                    <div class="led-indicator"></div>
                    Push
                    <div class="glare" id="glare"></div>
                </div>
            </div>
        </div>
        <div class="status" id="status">System Idle</div>
    </div>

    <script>
        const assembly = document.getElementById('assembly');
        const button = document.getElementById('button');
        const glare = document.getElementById('glare');
        const statusEl = document.getElementById('status');
        let clickCount = 0;
        let isDown = false;

        // Pointer tracking for glare & tilt
        button.addEventListener('mousemove', (e) => {
            const rect = button.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Glare
            glare.style.setProperty('--mx', `${x}px`);
            glare.style.setProperty('--my', `${y}px`);

            // Subtle parallax tilt on the keycap based on pointer
            const tiltX = ((y / rect.height) - 0.5) * -10;
            const tiltY = ((x / rect.width) - 0.5) * 10;
            
            if (!isDown) {
                assembly.style.transform = `rotateX(${15 + tiltX}deg) rotateY(${tiltY}deg)`;
            }
        });

        button.addEventListener('mouseleave', () => {
            assembly.style.transform = `rotateX(25deg) rotateY(0deg)`;
        });

        // Interaction logic
        function pressDown() {
            if(isDown) return;
            isDown = true;
            button.setAttribute('aria-pressed', 'true');
            assembly.classList.add('active');
            statusEl.textContent = 'Engaged';
            statusEl.style.color = 'var(--accent-base)';
        }

        function releaseUp() {
            if(!isDown) return;
            isDown = false;
            button.setAttribute('aria-pressed', 'false');
            assembly.classList.remove('active');
            clickCount++;
            statusEl.textContent = `Cycles: ${clickCount}`;
            statusEl.style.color = 'var(--text-muted)';
            
            // Trigger a structural "bounce" on release
            assembly.animate([
                { transform: 'rotateX(20deg) scale(0.98)' },
                { transform: 'rotateX(15deg) scale(1.02)' },
                { transform: 'rotateX(15deg) scale(1)' }
            ], {
                duration: 400,
                easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)'
            });
        }

        button.addEventListener('mousedown', pressDown);
        window.addEventListener('mouseup', releaseUp);
        button.addEventListener('touchstart', (e) => { e.preventDefault(); pressDown(); });
        window.addEventListener('touchend', releaseUp);

        // Keyboard
        button.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') pressDown();
        });
        button.addEventListener('keyup', (e) => {
            if (e.key === ' ' || e.key === 'Enter') releaseUp();
        });
    </script>
</body>
</html>
