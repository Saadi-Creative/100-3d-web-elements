<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>08 - Pressure-Sensitive Rating Gauge</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-8);
      perspective: 1000px;
      user-select: none;
    }

    /* Machined Obsidian Plate */
    .rating-deck {
      position: relative;
      padding: var(--space-8) var(--space-10);
      border-radius: var(--radius-2xl);
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid var(--border-subtle);
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-6);
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rating-deck:hover {
      transform: translateY(-4px) rotateX(4deg) rotateY(-2deg);
    }

    /* Deck Header & Live Score */
    .deck-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-width: 320px;
    }

    .deck-title {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .score-badge {
      font-size: var(--text-sm);
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: var(--surface-overlay);
      border: 1px solid var(--border-subtle);
      color: var(--accent-base);
      box-shadow: 0 0 12px var(--accent-glow);
      transition: all 0.3s ease;
    }

    /* Star Track Slot */
    .star-slot-row {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-xl);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.8);
      transform-style: preserve-3d;
    }

    /* 3D Star Jewel Button */
    .star-jewel {
      position: relative;
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      cursor: pointer;
      outline: none;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .star-jewel-body {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-subtle);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateZ(10px);
    }

    .star-jewel-body svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      transition: transform 0.25s ease, fill 0.25s ease, filter 0.25s ease;
    }

    /* Hover & Active States */
    .star-jewel:hover .star-jewel-body {
      transform: translateZ(18px) scale(1.1);
      color: #facc15;
      border-color: rgba(250, 204, 21, 0.4);
      box-shadow: 0 8px 20px rgba(250, 204, 21, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .star-jewel:active .star-jewel-body {
      transform: translateZ(4px) scale(0.95);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
    }

    /* Selected Star State */
    .star-jewel.is-active .star-jewel-body {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      border-color: #fef08a;
      color: #0f172a;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transform: translateZ(16px);
    }

    .star-jewel.is-active .star-jewel-body svg {
      fill: #0f172a;
      filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.4));
    }

    .star-jewel:focus-visible .star-jewel-body {
      border-color: var(--accent-base);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Feedback Label */
    .feedback-label {
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: var(--tracking-wide);
      min-height: 20px;
    }

    /* Pressure Shockwave Pulse */
    .shockwave {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(234, 179, 8, 0.8);
      pointer-events: none;
      animation: shockwavePulse 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes shockwavePulse {
      0% {
        width: 10px;
        height: 10px;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        width: 140px;
        height: 140px;
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.5);
      }
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="rating-deck" id="deck">
      <div class="deck-header">
        <span class="deck-title">Experience Rating</span>
        <span class="score-badge" id="scoreBadge">0.0 / 5.0</span>
      </div>

      <div class="star-slot-row" id="starRow" role="radiogroup" aria-label="Rating scale 1 to 5 stars">
        <!-- 5 Star Buttons -->
        <button class="star-jewel" data-value="1" role="radio" aria-checked="false" aria-label="1 star">
          <div class="star-jewel-body">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          </div>
        </button>
        <button class="star-jewel" data-value="2" role="radio" aria-checked="false" aria-label="2 stars">
          <div class="star-jewel-body">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          </div>
        </button>
        <button class="star-jewel" data-value="3" role="radio" aria-checked="false" aria-label="3 stars">
          <div class="star-jewel-body">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          </div>
        </button>
        <button class="star-jewel" data-value="4" role="radio" aria-checked="false" aria-label="4 stars">
          <div class="star-jewel-body">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          </div>
        </button>
        <button class="star-jewel" data-value="5" role="radio" aria-checked="false" aria-label="5 stars">
          <div class="star-jewel-body">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          </div>
        </button>
      </div>

      <div class="feedback-label" id="feedbackLabel">Click or press 1–5 to record feedback</div>
    </div>
  </div>

  <script>
    const stars = document.querySelectorAll('.star-jewel');
    const scoreBadge = document.getElementById('scoreBadge');
    const feedbackLabel = document.getElementById('feedbackLabel');
    const deck = document.getElementById('deck');

    const descriptions = [
      'Needs Significant Improvement',
      'Fair · Room for Growth',
      'Good · Solid Performance',
      'Very Good · Highly Recommended',
      'Exceptional · Unrivaled Excellence'
    ];

    let currentRating = 0;
    let hoverRating = 0;

    function renderRating(val) {
      stars.forEach((star, idx) => {
        const ratingVal = idx + 1;
        const isActive = ratingVal <= val;
        star.classList.toggle('is-active', isActive);
        star.setAttribute('aria-checked', isActive ? 'true' : 'false');
      });

      if (val > 0) {
        scoreBadge.textContent = `${val}.0 / 5.0`;
        feedbackLabel.textContent = descriptions[val - 1];
      } else {
        scoreBadge.textContent = `0.0 / 5.0`;
        feedbackLabel.textContent = 'Click or press 1–5 to record feedback';
      }
    }

    stars.forEach((star, idx) => {
      const val = idx + 1;

      star.addEventListener('mouseenter', () => {
        hoverRating = val;
        renderRating(hoverRating);
      });

      star.addEventListener('click', (e) => {
        currentRating = val;
        renderRating(currentRating);
        createShockwave(e.clientX, e.clientY);
      });
    });

    document.getElementById('starRow').addEventListener('mouseleave', () => {
      hoverRating = 0;
      renderRating(currentRating);
    });

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '5') {
        currentRating = parseInt(e.key, 10);
        renderRating(currentRating);
        const targetStar = stars[currentRating - 1];
        const rect = targetStar.getBoundingClientRect();
        createShockwave(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
    });

    function createShockwave(x, y) {
      const wave = document.createElement('div');
      wave.className = 'shockwave';
      wave.style.left = `${x}px`;
      wave.style.top = `${y}px`;
      document.body.appendChild(wave);

      wave.addEventListener('animationend', () => wave.remove());
    }
  </script>
</body>
</html>
