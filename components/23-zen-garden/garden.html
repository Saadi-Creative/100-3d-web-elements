<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>23 - Tactile Sand Rake & Wave Relief</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #e8e4db;
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: crosshair;
    }

    .hero-center {
      position: absolute;
      top: var(--space-8);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .hero-title {
      font-size: var(--text-2xl);
      font-weight: 700;
      color: #4a453d;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
    }

    .hero-sub {
      font-size: var(--text-xs);
      color: #8a8375;
      margin-top: var(--space-2);
    }

    /* Rake Controls Toolbar */
    .zen-toolbar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(16px);
    }

    .rake-btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: #4a453d;
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .rake-btn.is-active {
      background: #ffffff;
      border-color: rgba(0, 0, 0, 0.15);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="hero-center">
      <h1 class="hero-title">Zen Sand Rake Relief</h1>
      <p class="hero-sub">Drag cursor to carve high-relief tactile sand ripples</p>
    </div>

    <div id="canvas-container"></div>

    <div class="zen-toolbar" role="toolbar" aria-label="Rake controls">
      <button class="rake-btn is-active" data-intensity="1.0">Fine Rake</button>
      <button class="rake-btn" data-intensity="2.2">Deep Groove</button>
      <button class="rake-btn" id="clearBtn">Smooth Sand</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    let W = container.clientWidth, H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, 0.1, 100);
    camera.position.set(0, 0, 10);

    const MAX_POINTS = 50;
    const points = [];
    for (let i = 0; i < MAX_POINTS; i++) {
      points.push(new THREE.Vector4(-9999, -9999, 0, 0));
    }

    const fragmentShader = `
      uniform vec4 uPoints[${MAX_POINTS}];
      uniform vec2 uResolution;
      uniform float uTime;
      varying vec2 vUv;

      float random(vec2 st) {
        return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
      }

      void main() {
        vec2 st = gl_FragCoord.xy;
        float height = 0.0;
        vec2 slope = vec2(0.0);

        for (int i = 0; i < ${MAX_POINTS}; i++) {
          vec2 p = uPoints[i].xy;
          float age = uPoints[i].z;
          float intensity = uPoints[i].w;
          if (p.x < -9000.0) continue;

          vec2 diff = st - p;
          float dist = length(diff);
          float decay = exp(-dist * 0.015) * intensity;
          float wave = sin(dist * 0.1 - age * 8.0);

          height += wave * decay;
          slope += (diff / (dist + 0.001)) * cos(dist * 0.1 - age * 8.0) * decay * 0.1;
        }

        float r = random(st * 4.0) * 0.06;
        vec3 normal = normalize(vec3(-slope.x, -slope.y, 1.0));
        vec3 lightDir = normalize(vec3(-1.0, 1.0, 0.5));
        float light = dot(normal, lightDir);

        vec3 colorHighlight = vec3(0.98, 0.98, 0.96);
        vec3 colorShadow = vec3(0.78, 0.76, 0.69);
        vec3 finalColor = mix(colorShadow, colorHighlight, clamp(light + height * 0.5 + 0.5 + r, 0.0, 1.0));

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    const uniforms = {
      uPoints: { value: points },
      uResolution: { value: new THREE.Vector2(W, H) },
      uTime: { value: 0 }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader,
      uniforms
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(W, H), material);
    scene.add(plane);

    let isDragging = false;
    let pointIdx = 0;
    let currentIntensity = 1.0;

    function addPoint(x, y) {
      points[pointIdx].set(x, H - y, 0, currentIntensity);
      pointIdx = (pointIdx + 1) % MAX_POINTS;
    }

    container.addEventListener('mousedown', (e) => { isDragging = true; addPoint(e.clientX, e.clientY); });
    container.addEventListener('mouseup', () => { isDragging = false; });
    container.addEventListener('mousemove', (e) => { if (isDragging) addPoint(e.clientX, e.clientY); });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      for (let i = 0; i < MAX_POINTS; i++) {
        if (points[i].x > -9000) {
          points[i].z += dt;
          points[i].w *= 0.985;
          if (points[i].w < 0.01) points[i].x = -9999;
        }
      }

      uniforms.uTime.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      W = container.clientWidth;
      H = container.clientHeight;
      camera.left = -W / 2; camera.right = W / 2;
      camera.top = H / 2; camera.bottom = -H / 2;
      camera.updateProjectionMatrix();
      plane.geometry.dispose();
      plane.geometry = new THREE.PlaneGeometry(W, H);
      renderer.setSize(W, H);
      uniforms.uResolution.value.set(W, H);
    });

    const rakeBtns = document.querySelectorAll('.rake-btn');
    rakeBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.id === 'clearBtn') {
          for (let i = 0; i < MAX_POINTS; i++) points[i].set(-9999, -9999, 0, 0);
          return;
        }
        rakeBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        currentIntensity = parseFloat(btn.dataset.intensity);
      });
    });
  </script>
</body>
</html>
