<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Notification Tile</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        .stage {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            padding-bottom: var(--space-24);
            perspective: 1000px;
        }

        /* Glass Tile */
        .notification-tile {
            position: absolute;
            width: 380px;
            padding: var(--space-4) var(--space-6);
            display: flex;
            align-items: center;
            gap: var(--space-4);
            border-radius: var(--radius-xl);
            
            /* Glass material */
            background: linear-gradient(135deg, 
                oklch(95% 0.01 var(--hue-base) / 0.1), 
                oklch(95% 0.01 var(--hue-base) / 0.05)
            );
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.4),
                inset 0 1px 1px rgba(255,255,255,0.1);

            transform-style: preserve-3d;
            
            /* Hidden State */
            opacity: 0;
            pointer-events: none;
            /* Suspended high up and tilted back */
            transform: translate3d(0, -60px, -100px) rotateX(15deg);
            
            transition: all 0.8s var(--ease-spring);
        }

        /* Arrived State */
        .notification-tile.show {
            opacity: 1;
            pointer-events: auto;
            /* Settles flat */
            transform: translate3d(0, 0, 0) rotateX(0deg);
        }

        /* Dismissed State */
        .notification-tile.dismissed {
            opacity: 0;
            pointer-events: none;
            /* Falls down and away */
            transform: translate3d(0, 40px, 100px) rotateX(-10deg);
            transition: all 0.4s var(--ease-in);
        }

        /* Ambient subtle float when idle */
        .notification-tile.show.idle {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate3d(0, 0, 0) rotateX(0deg); }
            50% { transform: translate3d(0, -6px, 10px) rotateX(2deg); }
        }

        /* Icon Container */
        .icon-container {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            background: var(--surface-interactive);
            border: 1px solid var(--border-strong);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--success);
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.1),
                0 0 15px oklch(70% 0.15 150 / 0.3);
        }

        .icon-container svg {
            width: 20px;
            height: 20px;
            stroke-width: 2.5;
        }

        /* Content */
        .content {
            flex-grow: 1;
        }

        .title {
            font-size: var(--text-base);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .message {
            font-size: var(--text-sm);
            color: var(--text-secondary);
        }

        /* Dismiss button */
        .dismiss-btn {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all var(--time-fast) var(--ease-out);
        }

        .dismiss-btn:hover {
            background: var(--surface-interactive);
            border-color: var(--border-subtle);
            color: var(--text-primary);
        }

        /* Trigger for preview */
        .trigger-btn {
            padding: var(--space-3) var(--space-6);
            background: var(--surface-interactive);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            border-radius: var(--radius-full);
            cursor: pointer;
            font-weight: 500;
            transition: all var(--time-base) var(--ease-out);
            z-index: 10;
        }

        .trigger-btn:hover {
            background: var(--surface-elevated);
            transform: translateY(-2px);
        }

    </style>
</head>
<body>
    <div class="stage">
        
        <button class="trigger-btn" id="triggerBtn">Trigger Event</button>

        <div class="notification-tile" id="notification">
            <div class="icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <div class="content">
                <div class="title">System Synchronized</div>
                <div class="message">All nodes updated successfully.</div>
            </div>
            <button class="dismiss-btn" id="dismissBtn" aria-label="Dismiss">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

    </div>

    <script>
        const notification = document.getElementById('notification');
        const triggerBtn = document.getElementById('triggerBtn');
        const dismissBtn = document.getElementById('dismissBtn');
        let autoDismissTimer;

        function showNotification() {
            // Reset state
            notification.classList.remove('dismissed', 'idle');
            // Force reflow
            void notification.offsetWidth;
            
            // Show
            notification.classList.add('show');

            // Add ambient idle floating after it settles
            setTimeout(() => {
                if(notification.classList.contains('show')) {
                    notification.classList.add('idle');
                }
            }, 800);

            // Auto dismiss
            clearTimeout(autoDismissTimer);
            autoDismissTimer = setTimeout(dismissNotification, 5000);
        }

        function dismissNotification() {
            clearTimeout(autoDismissTimer);
            notification.classList.remove('show', 'idle');
            notification.classList.add('dismissed');
        }

        triggerBtn.addEventListener('click', showNotification);
        dismissBtn.addEventListener('click', dismissNotification);
    </script>
</body>
</html>
