<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07 - Curved Rotary Menu</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-8);
      perspective: 1200px;
      user-select: none;
    }

    .rotary-stage {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* Curved guide background overlay */
    .rotary-lens {
      position: absolute;
      inset: 40px 20px;
      border-radius: var(--radius-2xl);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-xl);
      pointer-events: none;
      z-index: 0;
    }

    .rotary-lens::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 64px;
      transform: translateY(-50%);
      background: linear-gradient(
        90deg,
        rgba(59, 130, 246, 0.08) 0%,
        rgba(99, 102, 241, 0.15) 50%,
        rgba(59, 130, 246, 0.08) 100%
      );
      border-top: 1px solid rgba(99, 102, 241, 0.3);
      border-bottom: 1px solid rgba(99, 102, 241, 0.3);
      pointer-events: none;
    }

    .rotary-track {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      z-index: 1;
      cursor: grab;
    }

    .rotary-track:active {
      cursor: grabbing;
    }

    .rotary-item {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 56px;
      margin-top: -28px;
      margin-left: -160px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-5);
      border-radius: var(--radius-lg);
      background: var(--surface-overlay);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-weight: 500;
      font-size: var(--text-sm);
      letter-spacing: var(--tracking-wide);
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      outline: none;
    }

    .rotary-item .item-left {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .rotary-item .icon {
      width: 20px;
      height: 20px;
      opacity: 0.6;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .rotary-item .badge {
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-subtle);
      transition: all 0.3s ease;
    }

    /* Active Focused State */
    .rotary-item.is-active {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border-color: rgba(99, 102, 241, 0.6);
      color: var(--text-heading);
      box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .rotary-item.is-active .icon {
      opacity: 1;
      transform: scale(1.1);
      color: var(--accent-base);
    }

    .rotary-item.is-active .badge {
      background: var(--accent-base);
      color: #ffffff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .rotary-item:focus-visible {
      border-color: var(--accent-base);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    /* Hints / Nav control bar */
    .nav-hints {
      margin-top: var(--space-6);
      display: flex;
      align-items: center;
      gap: var(--space-4);
      color: var(--text-subtle);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
    }

    .hint-key {
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      background: var(--surface-overlay);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="rotary-stage" id="stage">
      <div class="rotary-lens"></div>
      <div class="rotary-track" id="track" tabindex="0" role="menu" aria-label="Curved Navigation Menu">
        <!-- Items injected dynamically -->
      </div>
    </div>

    <div class="nav-hints">
      <span><span class="hint-key">↑</span> <span class="hint-key">↓</span> OR <span class="hint-key">SCROLL</span> TO ROTATE</span>
      <span>•</span>
      <span><span class="hint-key">ENTER</span> SELECT</span>
    </div>
  </div>

  <script>
    const menuItemsData = [
      { id: 'overview', label: 'Overview & Stats', icon: '<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>', count: 'Live' },
      { id: 'analytics', label: 'Realtime Analytics', icon: '<path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>', count: '+24%' },
      { id: 'deployments', label: 'Cloud Infrastructure', icon: '<path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>', count: '99.9%' },
      { id: 'security', label: 'Security Vault', icon: '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>', count: 'Active' },
      { id: 'database', label: 'Database Cluster', icon: '<path d="M12 2C6.48 2 2 3.79 2 6v12c0 2.21 4.48 4 10 4s10-1.79 10-4V6c0-2.21-4.48-4-10-4zm0 3c4.42 0 8 1.12 8 2.5S16.42 10 12 10 4 8.88 4 7.5 7.58 5 12 5z"/>', count: '12 Node' },
      { id: 'settings', label: 'System Configuration', icon: '<path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65z"/>', count: 'v4.2' }
    ];

    const track = document.getElementById('track');
    const radius = 220; // 3D arc radius
    const angleStep = 22; // Degrees between items
    let currentIndex = 0;
    let targetRotation = 0;
    let currentRotation = 0;

    // Render Menu Items
    menuItemsData.forEach((item, index) => {
      const el = document.createElement('div');
      el.className = `rotary-item ${index === 0 ? 'is-active' : ''}`;
      el.setAttribute('role', 'menuitem');
      el.setAttribute('tabindex', '0');
      el.dataset.index = index;
      el.innerHTML = `
        <div class="item-left">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">${item.icon}</svg>
          <span>${item.label}</span>
        </div>
        <span class="badge">${item.count}</span>
      `;

      el.addEventListener('click', () => selectIndex(index));
      track.appendChild(el);
    });

    const itemEls = document.querySelectorAll('.rotary-item');

    function updatePositions() {
      // Lerp smooth rotation
      currentRotation += (targetRotation - currentRotation) * 0.12;

      itemEls.forEach((el, index) => {
        const offsetIndex = index - (currentRotation / angleStep);
        const angle = offsetIndex * angleStep;
        
        // 3D Cylinder curve equation
        const rad = (angle * Math.PI) / 180;
        const translateY = Math.sin(rad) * radius;
        const translateZ = (Math.cos(rad) - 1) * radius * 0.8;
        const rotateX = -angle * 0.75;

        const distance = Math.abs(offsetIndex);
        const opacity = Math.max(0.15, 1 - distance * 0.35);
        const scale = Math.max(0.75, 1 - distance * 0.08);

        el.style.transform = `translateY(${translateY}px) translateZ(${translateZ}px) rotateX(${rotateX}deg) scale(${scale})`;
        el.style.opacity = opacity;

        const isActive = Math.round(distance) === 0;
        el.classList.toggle('is-active', isActive);
      });

      requestAnimationFrame(updatePositions);
    }

    function selectIndex(index) {
      currentIndex = Math.max(0, Math.min(menuItemsData.length - 1, index));
      targetRotation = currentIndex * angleStep;
    }

    // Wheel listener
    window.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > 10) {
        if (e.deltaY > 0) selectIndex(currentIndex + 1);
        else selectIndex(currentIndex - 1);
      }
    }, { passive: true });

    // Keyboard Navigation
    track.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectIndex(currentIndex + 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectIndex(currentIndex - 1);
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const activeItem = menuItemsData[currentIndex];
        alert(`Selected: ${activeItem.label}`);
      }
    });

    // Touch / Drag Navigation
    let startY = 0;
    let isDragging = false;

    track.addEventListener('mousedown', (e) => {
      isDragging = true;
      startY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const diffY = startY - e.clientY;
      if (Math.abs(diffY) > 30) {
        if (diffY > 0) selectIndex(currentIndex + 1);
        else selectIndex(currentIndex - 1);
        startY = e.clientY;
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Start loop
    updatePositions();
  </script>
</body>
</html>
