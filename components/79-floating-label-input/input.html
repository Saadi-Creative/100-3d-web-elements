<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sparkle Input Field</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #020617; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .ai-border-wrapper {
            position: relative;
            border-radius: 9999px;
            overflow: hidden;
            padding: 2px;
        }
        .ai-border-spin {
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, transparent 60%, #8b5cf6 80%, #ec4899 100%);
            animation: spin 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .is-focused .ai-border-spin {
            opacity: 1;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .shimmer-text {
            background: linear-gradient(90deg, #94a3b8 0%, #ffffff 50%, #94a3b8 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer { 100% { background-position: 200% center; } }
        
        /* Static border fade out */
        .static-border {
            transition: opacity 0.3s;
        }
        .is-focused .static-border {
            opacity: 0;
        }
        
        /* Floor glow */
        .floor-glow {
            transition: opacity 0.5s, transform 0.5s;
            opacity: 0;
            transform: scale(0.9);
        }
        .is-focused .floor-glow {
            opacity: 0.8;
            transform: scale(1.1);
        }

        /* Submit Button transition */
        .btn-active {
            background-color: #c026d3;
            color: white;
            box-shadow: 0 0 20px rgba(192,38,211,0.5);
        }
        .btn-active:hover {
            background-color: #d946ef;
        }
        .btn-inactive {
            background-color: #1e293b;
            color: #64748b;
        }

        /* Sparkle Animation */
        @keyframes sparkle-anim {
            0% { transform: scale(0) rotate(0deg) translateY(0) translateX(0); opacity: 1; }
            50% { transform: scale(1.5) rotate(90deg) translateY(-20px) translateX(var(--tx)); opacity: 1; }
            100% { transform: scale(0) rotate(180deg) translateY(-40px) translateX(calc(var(--tx) * 2)); opacity: 0; }
        }
        
        .sparkle-el {
            position: absolute;
            pointer-events: none;
            z-index: 50;
            mix-blend-mode: screen;
            animation: sparkle-anim var(--dur, 1s) ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex flex-col items-center">
            
            <div class="text-center mb-16 pointer-events-none z-10">
                <h1 class="text-6xl font-black text-white tracking-tighter mb-4">Neural Field</h1>
                <p class="text-slate-400 font-medium text-lg leading-relaxed max-w-lg mx-auto">
                    The definitive AI input pattern. Focus the field to trigger an infinitely rotating conic-gradient mask. Typing spawns physically tracked DOM SVG stars that erupt from your cursor.
                </p>
            </div>

            <div id="input-container" class="relative w-full max-w-2xl px-4 z-20 w-[600px]">
                
                <div class="floor-glow absolute inset-0 bg-fuchsia-600/20 blur-[60px] rounded-full z-[-1]"></div>

                <div class="ai-border-wrapper shadow-2xl relative w-full group">
                    
                    <div class="ai-border-spin"></div>

                    <div class="static-border absolute inset-0 rounded-full border border-slate-700/50"></div>

                    <div class="relative w-full bg-slate-900 rounded-full flex items-center p-2 z-10 shadow-inner">
                        
                        <div class="p-3 pl-4">
                            <svg class="w-6 h-6 text-fuchsia-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>

                        <div class="relative flex-1 h-full flex items-center">
                            
                            <div id="placeholder" class="absolute inset-x-0 ml-1 pointer-events-none shimmer-text font-bold text-lg select-none">
                                Ask the neural engine anything...
                            </div>

                            <input 
                                id="ai-input"
                                type="text" 
                                class="w-full h-full bg-transparent text-white font-bold text-lg focus:outline-none py-3 px-1 relative z-10"
                            />

                            <div id="sparkle-container" class="absolute inset-0 pointer-events-none overflow-visible"></div>
                        </div>

                        <button id="submit-btn" class="btn-inactive ml-2 mr-1 p-3 rounded-full flex items-center justify-center transition-all">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>
    <script>
        const container = document.getElementById('input-container');
        const input = document.getElementById('ai-input');
        const placeholder = document.getElementById('placeholder');
        const submitBtn = document.getElementById('submit-btn');
        const sparkleContainer = document.getElementById('sparkle-container');

        input.addEventListener('focus', () => {
            container.classList.add('is-focused');
        });

        input.addEventListener('blur', () => {
            container.classList.remove('is-focused');
        });

        input.addEventListener('input', (e) => {
            const val = e.target.value;
            
            // Toggle placeholder and btn states
            if (val.length > 0) {
                placeholder.style.display = 'none';
                submitBtn.classList.remove('btn-inactive');
                submitBtn.classList.add('btn-active');
            } else {
                placeholder.style.display = 'block';
                submitBtn.classList.add('btn-inactive');
                submitBtn.classList.remove('btn-active');
            }

            // Spawn Sparkle
            spawnSparkle(val.length);
        });

        function spawnSparkle(len) {
            const rect = input.getBoundingClientRect();
            // Estimate x pos
            const estimatedX = 40 + Math.min(len * 10, rect.width - 100);
            const size = Math.random() * 10 + 10;
            const tx = (Math.random() - 0.5) * 40; // random drift
            
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle-el';
            sparkle.style.left = `${estimatedX}px`;
            sparkle.style.top = `${10 + (Math.random() * 10 - 5)}px`;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.setProperty('--tx', `${tx}px`);
            sparkle.style.setProperty('--dur', `${0.8 + Math.random() * 0.4}s`);
            
            sparkle.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" class="text-fuchsia-400 drop-shadow-[0_0_8px_rgba(232,121,249,0.8)]">
                    <path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10L12 0Z" fill="currentColor"/>
                </svg>
            `;
            
            sparkleContainer.appendChild(sparkle);
            
            sparkle.addEventListener('animationend', () => {
                if (sparkleContainer.contains(sparkle)) {
                    sparkleContainer.removeChild(sparkle);
                }
            });
        }
    </script>
</body>
</html>
