<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Split-Flap Search Matrix</title>
    <link rel="stylesheet" href="../../styles/shared.css">
    <style>
        body {
            background: radial-gradient(circle at center, #0f121e 0%, #05070d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            perspective: 1000px;
            gap: 28px;
            font-family: var(--font-mono, monospace);
        }

        .solari-hud {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .hud-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink { 0% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Solari Search Chassis */
        .solari-chassis {
            position: relative;
            background: #090c14;
            border: 2px solid #1e293b;
            border-radius: 20px;
            padding: 24px 28px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.9),
                inset 0 2px 4px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 640px;
            width: 90%;
        }

        /* Input Row */
        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 16px;
        }

        .search-icon {
            color: #fbbf24;
            font-size: 16px;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f8fafc;
            font-family: var(--font-mono, monospace);
            font-size: 14px;
            letter-spacing: 0.05em;
        }

        .search-input::placeholder {
            color: #475569;
        }

        /* 3D Split-Flap Cells Display Matrix */
        .flap-board {
            display: flex;
            justify-content: center;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 0;
            perspective: 600px;
        }

        .flap-cell {
            position: relative;
            width: 32px;
            height: 48px;
            background: #111827;
            border-radius: 6px;
            border: 1px solid #1f2937;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
        }

        /* Horizontal Split Crease Line */
        .flap-cell::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #030712;
            z-index: 10;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        }

        .flap-half {
            position: absolute;
            left: 0;
            right: 0;
            height: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            background: #131b2e;
            color: #f8fafc;
            font-size: 24px;
            font-weight: 700;
        }

        .flap-top {
            top: 0;
            align-items: flex-end;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            border-bottom: 1px solid rgba(0,0,0,0.6);
            transform-origin: bottom center;
        }

        .flap-bottom {
            bottom: 0;
            align-items: flex-start;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
            transform-origin: top center;
        }

        .flap-top span { transform: translateY(50%); }
        .flap-bottom span { transform: translateY(-50%); }

        /* Flip Animation */
        .flap-cell.flipping .flap-top {
            animation: flip-top 0.15s ease-in forwards;
        }

        @keyframes flip-top {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        .preset-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            font-family: var(--font-mono, monospace);
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            background: rgba(251, 191, 36, 0.15);
            border-color: #fbbf24;
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="solari-hud">
        <span class="hud-dot"></span>
        <span>Solari-Line Split-Flap Departure Index</span>
    </div>

    <div class="solari-chassis">
        <div class="input-row">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="search-input" placeholder="Type query to flip flaps..." maxlength="14" autofocus>
        </div>

        <div class="flap-board" id="flap-board">
            <!-- 14 Flap cells rendered dynamically -->
        </div>

        <div class="preset-tags">
            <button class="preset-btn" data-text="DEPARTURES">DEPARTURES</button>
            <button class="preset-btn" data-text="TOKENS / 3D">TOKENS / 3D</button>
            <button class="preset-btn" data-text="CYBER VAULT">CYBER VAULT</button>
            <button class="preset-btn" data-text="FLUID MATRIX">FLUID MATRIX</button>
            <button class="preset-btn" data-text="TOPOLOGY">TOPOLOGY</button>
        </div>
    </div>

    <script>
        const CELL_COUNT = 14;
        const flapBoard = document.getElementById('flap-board');
        const searchInput = document.getElementById('search-input');
        const presetBtns = document.querySelectorAll('.preset-btn');

        // Web Audio Synthesized Split-Flap Rattle
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playFlapTick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.02);

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.025);
        }

        const cells = [];
        let currentText = 'DEPARTURES'.padEnd(CELL_COUNT, ' ');

        for (let i = 0; i < CELL_COUNT; i++) {
            const cell = document.createElement('div');
            cell.className = 'flap-cell';
            cell.innerHTML = `
                <div class="flap-half flap-top"><span>${currentText[i]}</span></div>
                <div class="flap-half flap-bottom"><span>${currentText[i]}</span></div>
            `;
            flapBoard.appendChild(cell);
            cells.push(cell);
        }

        function flipTo(targetStr) {
            const targetPadded = targetStr.toUpperCase().padEnd(CELL_COUNT, ' ').slice(0, CELL_COUNT);

            cells.forEach((cell, idx) => {
                const targetChar = targetPadded[idx];
                const topSpan = cell.querySelector('.flap-top span');
                const botSpan = cell.querySelector('.flap-bottom span');

                if (topSpan.textContent !== targetChar) {
                    cell.classList.add('flipping');
                    setTimeout(() => {
                        topSpan.textContent = targetChar;
                        botSpan.textContent = targetChar;
                        cell.classList.remove('flipping');
                        playFlapTick();
                    }, 80 + idx * 20);
                }
            });

            currentText = targetPadded;
        }

        searchInput.addEventListener('input', (e) => {
            flipTo(e.target.value || 'DEPARTURES');
        });

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.dataset.text;
                searchInput.value = text;
                flipTo(text);
            });
        });

        // Auto suggestion cycle
        const AUTO_SUGGESTIONS = ['QUANTUM CRYPT', 'NEURAL MESH', 'HYPERSPACE', 'SOLARI AIRPORT'];
        let autoIdx = 0;
        setInterval(() => {
            if (document.activeElement === searchInput) return;
            autoIdx = (autoIdx + 1) % AUTO_SUGGESTIONS.length;
            flipTo(AUTO_SUGGESTIONS[autoIdx]);
        }, 5000);
    </script>
</body>
</html>
