<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>20 - Precision Accordion Origami Unfold Menu</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      background: radial-gradient(circle at 30% 30%, #1e1b4b 0%, #020617 80%);
      font-family: var(--font-sans);
      user-select: none;
    }

    /* Trigger Toggle Button */
    .origami-trigger {
      position: fixed;
      top: var(--space-6);
      left: var(--space-6);
      z-index: 100;
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-heading);
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-lg);
      transition: all 0.2s ease;
      outline: none;
    }

    .origami-trigger:hover {
      border-color: var(--accent-base);
      color: var(--accent-base);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .trigger-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* 3D Sidebar Stage */
    .origami-stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100vh;
      perspective: 1200px;
      pointer-events: none;
      z-index: 90;
    }

    /* Folding Facet Panels */
    .origami-facet {
      position: absolute;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--surface-card);
      border-bottom: 1px solid var(--border-subtle);
      transform-origin: top center;
      transform: rotateX(-90deg);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      display: flex;
      align-items: center;
      padding: 0 var(--space-6);
      justify-content: space-between;
      color: var(--text-heading);
      font-weight: 600;
      font-size: var(--text-sm);
      cursor: pointer;
    }

    .origami-stage.is-open .origami-facet {
      transform: rotateX(0deg);
      opacity: 1;
      pointer-events: auto;
    }

    /* Staggered Facet Heights and Transition Delays */
    .origami-facet:nth-child(1) { top: 80px;  transition-delay: 0.05s; }
    .origami-facet:nth-child(2) { top: 144px; transition-delay: 0.10s; }
    .origami-facet:nth-child(3) { top: 208px; transition-delay: 0.15s; }
    .origami-facet:nth-child(4) { top: 272px; transition-delay: 0.20s; }
    .origami-facet:nth-child(5) { top: 336px; transition-delay: 0.25s; }

    .origami-facet:hover {
      background: var(--surface-overlay);
      color: var(--accent-base);
    }

    .facet-num {
      font-size: var(--text-xs);
      color: var(--text-subtle);
      font-weight: 700;
    }

    /* Backdrop Dimmer */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      z-index: 80;
      transition: opacity 0.4s ease;
    }

    .backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Hero Text */
    .hero-center {
      text-align: center;
    }

    .hero-title {
      font-size: var(--text-3xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
    }

    .hero-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      margin-top: var(--space-2);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <button class="origami-trigger" id="menuTrigger" aria-expanded="false" aria-label="Toggle origami navigation">
      <svg class="trigger-icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      <span>Unfold Facets</span>
    </button>

    <div class="backdrop" id="backdrop"></div>

    <div class="origami-stage" id="origamiStage" role="navigation" aria-label="Origami 3D sidebar">
      <div class="origami-facet" role="menuitem" tabindex="0">
        <span>01 · Executive Summary</span>
        <span class="facet-num">→</span>
      </div>
      <div class="origami-facet" role="menuitem" tabindex="0">
        <span>02 · System Architecture</span>
        <span class="facet-num">→</span>
      </div>
      <div class="origami-facet" role="menuitem" tabindex="0">
        <span>03 · Security Infrastructure</span>
        <span class="facet-num">→</span>
      </div>
      <div class="origami-facet" role="menuitem" tabindex="0">
        <span>04 · Performance Analytics</span>
        <span class="facet-num">→</span>
      </div>
      <div class="origami-facet" role="menuitem" tabindex="0">
        <span>05 · Global Deployments</span>
        <span class="facet-num">→</span>
      </div>
    </div>

    <div class="hero-center">
      <h1 class="hero-title">Precision Origami Unfold</h1>
      <p class="hero-sub">3D Facet Hinge Mechanism</p>
    </div>
  </div>

  <script>
    const trigger = document.getElementById('menuTrigger');
    const stage = document.getElementById('origamiStage');
    const backdrop = document.getElementById('backdrop');
    let isOpen = false;

    function toggleMenu() {
      isOpen = !isOpen;
      trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      stage.classList.toggle('is-open', isOpen);
      backdrop.classList.toggle('is-visible', isOpen);
    }

    trigger.addEventListener('click', toggleMenu);
    backdrop.addEventListener('click', toggleMenu);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isOpen) toggleMenu();
    });

    const facets = document.querySelectorAll('.origami-facet');
    facets.forEach((facet) => {
      facet.addEventListener('click', () => {
        const text = facet.querySelector('span').textContent;
        alert(`Navigating to: ${text}`);
        toggleMenu();
      });
    });
  </script>
</body>
</html>
