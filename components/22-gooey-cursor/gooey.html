<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>22 - Viscous Liquid Mercury Cursor</title>
  <link rel="stylesheet" href="../../styles/shared.css" />
  <style>
    .demo-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #030712 100%);
      font-family: var(--font-sans);
      cursor: none;
      overflow: hidden;
    }

    /* SVG Filter Metaball Merge */
    .goo-wrapper {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      filter: blur(14px) contrast(28);
    }

    .blob-head {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .blob-trail {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, #c084fc, #8b5cf6);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Crisp Precision Ring */
    .cursor-ring {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid rgba(167, 139, 250, 0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1000;
      transition: width 0.15s ease, height 0.15s ease, border-color 0.2s ease;
    }

    .cursor-ring.is-clicking {
      width: 40px;
      height: 40px;
      border-color: #f0abfc;
    }

    /* Content Overlay */
    .hero-center {
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    .hero-title {
      font-size: var(--text-3xl);
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: var(--tracking-tight);
    }

    .hero-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-2);
    }

    .split-btn {
      margin-top: var(--space-6);
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius-full);
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-heading);
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-lg);
      transition: all 0.2s ease;
    }

    .split-btn:hover {
      border-color: var(--accent-base);
      color: var(--accent-base);
      box-shadow: 0 0 16px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="cursor-ring" id="cursorRing"></div>

    <div class="goo-wrapper" id="gooWrapper">
      <div class="blob-head" id="blobHead"></div>
      <div class="blob-trail" id="trail1" style="width: 30px; height: 30px;"></div>
      <div class="blob-trail" id="trail2" style="width: 22px; height: 22px;"></div>
      <div class="blob-trail" id="trail3" style="width: 16px; height: 16px;"></div>
    </div>

    <div class="hero-center">
      <h1 class="hero-title">Viscous Liquid Mercury Cursor</h1>
      <p class="hero-sub">Metaball liquid filter with lag-damped trail physics</p>

      <button class="split-btn" id="splitBtn">Click to Split Blobs</button>
    </div>
  </div>

  <script>
    const ring = document.getElementById('cursorRing');
    const head = document.getElementById('blobHead');
    const trails = [
      document.getElementById('trail1'),
      document.getElementById('trail2'),
      document.getElementById('trail3')
    ];

    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let headX = mx, headY = my;
    const trailPos = trails.map(() => ({ x: mx, y: my }));
    const trailLags = [0.1, 0.065, 0.045];

    function lerp(a, b, t) { return a + (b - a) * t; }

    window.addEventListener('mousemove', (e) => {
      mx = e.clientX;
      my = e.clientY;
    });

    window.addEventListener('click', () => {
      ring.classList.add('is-clicking');
      setTimeout(() => ring.classList.remove('is-clicking'), 300);
    });

    function animate() {
      requestAnimationFrame(animate);

      headX = lerp(headX, mx, 0.2);
      headY = lerp(headY, my, 0.2);

      head.style.left = `${headX}px`;
      head.style.top = `${headY}px`;
      ring.style.left = `${headX}px`;
      ring.style.top = `${headY}px`;

      let prevX = headX, prevY = headY;
      trails.forEach((trail, i) => {
        trailPos[i].x = lerp(trailPos[i].x, prevX, trailLags[i]);
        trailPos[i].y = lerp(trailPos[i].y, prevY, trailLags[i]);
        trail.style.left = `${trailPos[i].x}px`;
        trail.style.top = `${trailPos[i].y}px`;
        prevX = trailPos[i].x;
        prevY = trailPos[i].y;
      });
    }
    animate();
  </script>
</body>
</html>
