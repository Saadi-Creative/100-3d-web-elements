<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topographical Cyber-Grid Background</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #030712; min-height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; cursor: crosshair; }
        canvas { display: block; position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root">
        <div class="w-full h-screen relative flex items-center justify-center">
            
            <canvas id="cyber-grid"></canvas>

            <div class="relative z-10 text-center max-w-2xl px-6 pointer-events-none">
                <div class="inline-block p-4 bg-emerald-500/10 rounded-full mb-6 border border-emerald-500/30 backdrop-blur-sm">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5" /></svg>
                </div>
                <h1 class="text-5xl font-black text-white tracking-tighter mb-4 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]">Topographical Grid</h1>
                <p class="text-slate-400 font-medium leading-relaxed">
                    Move your cursor. Utilizing raw HTML5 Canvas mathematical path rendering tied to <code class="text-emerald-400">requestAnimationFrame</code>. It creates a physical gravity well that repels the intersecting vectors, completely independent of the React render cycle.
                </p>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('cyber-grid');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        const spacing = 40; 
        const radius = 200; 
        const strength = 35; 
        
        let mx = -1000;
        let my = -1000;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mx = e.clientX;
            my = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mx = -1000;
            my = -1000;
        });
        
        resize();

        function getWarpedPoint(px, py) {
            const dx = px - mx;
            const dy = py - my;
            const dist = Math.hypot(dx, dy);

            if (dist > radius || mx < 0) return { x: px, y: py };

            const force = Math.max(0, 1 - (dist / radius));
            const angle = Math.atan2(dy, dx);
            const pushDist = (Math.sin(force * Math.PI / 2)) * strength;
            
            return {
                x: px + Math.cos(angle) * pushDist,
                y: py + Math.sin(angle) * pushDist
            };
        }

        function render() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.15)';
            ctx.lineWidth = 1;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();

            for (let y = 0; y <= height + spacing; y += spacing) {
                for (let x = 0; x <= width + spacing; x += spacing) {
                    const start = getWarpedPoint(x, y);
                    if (x === 0) ctx.moveTo(start.x, start.y);
                    else ctx.lineTo(start.x, start.y);
                }
            }

            for (let x = 0; x <= width + spacing; x += spacing) {
                for (let y = 0; y <= height + spacing; y += spacing) {
                    const start = getWarpedPoint(x, y);
                    if (y === 0) ctx.moveTo(start.x, start.y);
                    else ctx.lineTo(start.x, start.y);
                }
            }

            ctx.stroke();

            if (mx > 0 && my > 0) {
                ctx.beginPath();
                const gradient = ctx.createRadialGradient(mx, my, 0, mx, my, radius);
                gradient.addColorStop(0, 'rgba(16, 185, 129, 0.2)');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.arc(mx, my, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
